{% extends "layout_student.html" %}
{% block title %}📤 Nộp bài{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <h3 class="fw-bold mb-4">
    <i class="bi bi-upload"></i> Nộp bài: {{ assignment.title }}
  </h3>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <form action="/student/assignment/submit/{{ assignment.id }}" 
            method="post" enctype="multipart/form-data">

        <!-- Nội dung -->
        <div class="mb-3">
          <label class="form-label fw-bold">📝 Nội dung</label>
          <textarea name="submission_text" rows="5" class="form-control"
            placeholder="Nhập nội dung bài nộp (không bắt buộc nếu có file)..."></textarea>
        </div>

        <!-- Upload file -->
        <div class="mb-3">
          <label class="form-label fw-bold">📎 File đính kèm</label>
          <input type="file" name="files" multiple class="form-control">
          <small class="text-muted">
            Tối đa {{ assignment.max_files }} file • Loại file: {{ assignment.allowed_file_types }}
          </small>
        </div>

        <hr>

        <div class="text-end">
          <button class="btn btn-success">
            <i class="bi bi-send-check"></i> Nộp bài
          </button>

          <a href="/student/assignment/detail/{{ assignment.id }}" 
             class="btn btn-secondary ms-2">
            <i class="bi bi-x-circle"></i> Hủy
          </a>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
