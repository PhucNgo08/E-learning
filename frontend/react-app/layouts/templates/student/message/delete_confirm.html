{% extends "layout_student.html" %}
{% block title %}🗑️ Xóa tin nhắn{% endblock %}

{% block content %}

<style>
/* ================================================
💎 Delete Message – Glass Neo v3.1
================================================ */
.delete-wrapper {
  min-height: calc(100vh - 100px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem 1rem;
  animation: fadeIn .6s ease;
}

.delete-card {
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-glass);
  backdrop-filter: blur(20px);
  max-width: 480px;
  width: 100%;
  transition: all .3s ease;
}

.delete-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0,0,0,.18);
}

.delete-card .icon-danger {
  font-size: 3.2rem;
  color: #dc3545;
  text-shadow: 0 4px 12px rgba(220,53,69,.35);
}

/* Buttons */
.btn-danger {
  padding: .55rem 1.4rem;
  font-weight: 600;
  border-radius: 10px;
}

.btn-danger:hover i {
  transform: scale(1.15);
}

.btn-outline-secondary {
  border-radius: 10px;
  padding: .55rem 1.4rem;
  font-weight: 600;
}

.btn-outline-secondary:hover i {
  transform: translateX(-3px);
}

/* Floating back */
.fab-back {
  position: fixed;
  bottom: 40px;
  left: 40px;
  background: linear-gradient(135deg,#64748b,#334155);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  transition: all .3s ease;
  z-index: 999;
}

.fab-back:hover {
  background: linear-gradient(135deg,#475569,#1e293b);
  transform: scale(1.12);
}

/* Fade-in effect */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px);}
  to { opacity: 1; transform: translateY(0);}
}

/* 🔥 Dark Mode (chuẩn nhất – không cần Jinja) */
body.dark-mode .delete-card {
  background: rgba(15,23,42,0.7);
  border-color: rgba(255,255,255,0.1);
}
</style>



<div class="delete-wrapper">
  <div class="delete-card p-4 text-center">

    <div class="mb-3">
      <i class="bi bi-exclamation-triangle-fill icon-danger"></i>
    </div>

    <h5 class="fw-bold text-danger mb-2">
      Bạn có chắc muốn xóa tin nhắn này?
    </h5>

    <p class="text-muted mb-4">
      Hành động này <strong>không thể hoàn tác</strong>.  
      Tin nhắn và tệp đính kèm sẽ bị xoá vĩnh viễn.
    </p>

    <div class="d-flex justify-content-center gap-3 mt-3">
      <a href="/student/message/delete/{{ message.id }}" class="btn btn-danger">
        <i class="bi bi-trash me-1"></i> Xóa ngay
      </a>

      <a href="javascript:history.back()" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left-circle me-1"></i> Hủy
      </a>
    </div>

  </div>
</div>

<!-- Floating Back -->
<a href="/student/message/" class="fab-back" title="Quay lại hộp thư">
  <i class="bi bi-arrow-left"></i>
</a>

{% endblock %}
