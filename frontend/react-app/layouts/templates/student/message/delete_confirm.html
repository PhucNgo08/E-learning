{% extends "layout_student.html" %}
{% block title %}🗑️ Xóa tin nhắn{% endblock %}
{% block content %}
<div class="container py-5 text-center fade-in">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 480px;">
    <div class="card-body">
      <div class="mb-3">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
      </div>
      <h5 class="fw-bold mb-3 text-danger">Bạn có chắc muốn xóa tin nhắn này?</h5>
      <p class="text-muted">Sau khi xóa, dữ liệu sẽ không thể khôi phục.</p>
      <div class="d-flex justify-content-center gap-2 mt-4">
        <a href="/student/message/delete/{{ message.id }}" class="btn btn-danger">
          <i class="bi bi-trash"></i> Xóa ngay
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left-circle"></i> Hủy
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
