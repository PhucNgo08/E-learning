{% extends "student/layout_student.html" %}
{% block title %}✉️ Soạn thư{% endblock %}
{% block content %}
<h5 class="mb-3">✉️ Soạn thư</h5>
<form method="post">
<div class="mb-3">
<label class="form-label">Người nhận</label>
<input class="form-control" name="to" value="{{ draft.to or '' }}" required>
</div>
<div class="mb-3">
<label class="form-label">Chủ đề</label>
<input class="form-control" name="subject" value="{{ draft.subject or '' }}" required>
</div>
<div class="mb-3">
<label class="form-label">Nội dung</label>
<textarea class="form-control" name="body" rows="8" required>{{ draft.body or '' }}</textarea>
</div>
<button class="btn btn-primary">Gửi</button>
<a class="btn btn-outline-secondary" href="{{ url_for('student_message_inbox') }}">Hủy</a>
</form>
{% endblock %}
