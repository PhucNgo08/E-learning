{% extends "layout_student.html" %}
{% block title %}✉️ Soạn tin nhắn{% endblock %}

{% block content %}

<style>
/* ==========================================================
💎 Compose Message – Glass Neo PRO MAX v4.0 (2025)
========================================================== */
.compose-wrapper {
  display: flex;
  justify-content: center;
  min-height: calc(100vh - 100px);
  padding: 2rem 1rem;
}

.compose-container {
  width: 100%;
  max-width: 720px;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(25px);
  padding: 2rem 2.5rem;
  border: 1px solid var(--border-glass);
  animation: fadeIn .6s ease;
}

.compose-container:hover {
  box-shadow: 0 12px 32px rgba(0,0,0,.15);
}

.form-control {
  border-radius: 12px;
  background: rgba(255,255,255,.45);
  border: 1px solid rgba(0,0,0,.12);
  padding: .65rem .9rem;
}

textarea.form-control {
  min-height: 150px;
  resize: vertical;
  border-radius: 14px;
}

.file-upload {
  border: 2px dashed rgba(180,190,200,.45);
  border-radius: 12px;
  padding: 25px;
  cursor: pointer;
  text-align: center;
}

/* Floating Back */
.fab-back {
  position: fixed;
  bottom: 34px;
  left: 34px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg,#64748b,#334155);
  color: white;
  font-size: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>


<div class="compose-wrapper">
  <div class="compose-container">

    <h4 class="fw-bold mb-2">
      <i class="bi bi-pencil-square me-2 text-primary"></i> Soạn tin nhắn mới
    </h4>
    <p class="text-muted small mb-4">
      Bạn có thể nhập <b>Email</b>, <b>Username</b> hoặc <b>ID</b> để gửi tin nhắn.
    </p>

    <!-- FORM GỬI TIN -->
    <form method="post" action="/student/message/compose" enctype="multipart/form-data" onsubmit="return disableSubmit()">

      <!-- Người nhận -->
      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Người nhận</label>

        <input list="user_suggestions"
               type="text"
               class="form-control"
               name="receiver_id"
               placeholder="Nhập Email, Username hoặc ID người nhận"
               required />

        <datalist id="user_suggestions">
          {% for u in users %}
            <option value="{{ u.email }}">{{ u.full_name }} – ID: {{ u.id }} – @{{ u.username }}</option>
            <option value="{{ u.username }}">{{ u.full_name }} – Email: {{ u.email }}</option>
            <option value="{{ u.id }}">{{ u.full_name }} – @{{ u.username }}</option>
          {% endfor %}
        </datalist>
      </div>

      <!-- Nội dung -->
      <div class="mb-3">
        <label class="form-label fw-semibold">💬 Nội dung</label>
        <textarea name="content" class="form-control shadow-sm"
                  placeholder="Nhập nội dung tin nhắn..."></textarea>
      </div>

      <!-- Upload file -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📎 Đính kèm tệp</label>

        <div class="file-upload" onclick="openFilePicker()">
          <i class="bi bi-cloud-arrow-up fs-3 d-block mb-2"></i>
          <span id="file_label">Chọn tệp hoặc kéo thả vào đây</span>
        </div>

        <input type="file" name="attachment" id="fileInput" class="d-none"
               onchange="showFileName(this)">
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary" id="sendBtn">
          <i class="bi bi-send-fill me-1"></i> Gửi tin
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Floating Back -->
<a href="/student/message/" class="fab-back">
  <i class="bi bi-arrow-left"></i>
</a>


<script>
function openFilePicker() {
  document.getElementById("fileInput").click();
}

function showFileName(input) {
  const fileLabel = document.getElementById("file_label");

  if (!input.files.length) {
    fileLabel.innerHTML = "Chọn tệp hoặc kéo thả vào đây";
    return;
  }

  const file = input.files[0];
  let icon = "bi-file-earmark";

  if (file.type.startsWith("image/")) icon = "bi-image";
  else if (file.type === "application/pdf") icon = "bi-file-earmark-pdf";
  else if (file.type.includes("word")) icon = "bi-file-earmark-word";
  else if (file.type.includes("zip")) icon = "bi-file-zip";

  fileLabel.innerHTML = `
    <i class="bi ${icon} me-1"></i>
    <strong>${file.name}</strong>
    <span class="text-muted">(${(file.size / 1024).toFixed(1)} KB)</span>
  `;
}

function disableSubmit() {
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Đang gửi...';
  return true;
}
</script>

{% endblock %}
