{% extends "layout_student.html" %}
{% block title %}✉️ Soạn tin nhắn{% endblock %}

{% block content %}

<style>
/* ==========================================================
💎 Compose Message – Glass Neo v3.2 (2025 Production)
========================================================== */
.compose-wrapper {
  display: flex;
  justify-content: center;
  min-height: calc(100vh - 100px);
  padding: 2rem 1rem;
}

.compose-container {
  width: 100%;
  max-width: 720px;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(25px);
  padding: 2rem 2.5rem;
  border: 1px solid var(--border-glass);
  animation: fadeIn .6s ease;
}

.compose-container:hover {
  box-shadow: 0 12px 32px rgba(0,0,0,.15);
}

/* Inputs */
.form-control {
  border-radius: 12px;
  background: rgba(255,255,255,.45);
  border: 1px solid rgba(0,0,0,.12);
  padding: .65rem .9rem;
  transition: all .25s ease;
}

body.dark-mode .form-control {
  background: rgba(30,41,59,.45);
  border-color: rgba(255,255,255,.08);
  color: #e2e8f0;
}

.form-control:focus {
  border-color: var(--blue1);
  box-shadow: 0 0 14px rgba(37,99,235,.28);
}

/* Textarea */
textarea.form-control {
  min-height: 150px;
  resize: vertical;
  border-radius: 14px;
}

/* File upload */
.file-upload {
  border: 2px dashed rgba(180,190,200,.45);
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  cursor: pointer;
  background: rgba(255,255,255,.55);
  transition: all .25s ease;
}

.file-upload:hover {
  background: rgba(37,99,235,.06);
  border-color: var(--blue1);
}

body.dark-mode .file-upload {
  background: rgba(15,23,42,.45);
  border-color: rgba(255,255,255,.1);
  color: #e2e8f0;
}

.btn-primary {
  border-radius: 10px;
  font-weight: 600;
  padding: .55rem 1.4rem;
}

.btn-primary:hover i {
  transform: translateX(4px);
}

/* Floating Back Button */
.fab-back {
  position: fixed;
  bottom: 34px;
  left: 34px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg,#64748b,#334155);
  color: white;
  font-size: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 6px 15px rgba(0,0,0,.25);
  transition: transform .3s ease, background .3s ease;
  z-index: 999;
}

.fab-back:hover {
  transform: scale(1.1);
  background: linear-gradient(135deg,#475569,#1e293b);
}

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>


<div class="compose-wrapper">
  <div class="compose-container">

    <h4 class="fw-bold mb-2">
      <i class="bi bi-pencil-square me-2 text-primary"></i> Soạn tin nhắn mới
    </h4>
    <p class="text-muted small mb-4">
      Nhập người nhận, nội dung tin nhắn và đính kèm tệp nếu cần.
    </p>

    <!-- FORM GỬI TIN -->
    <form method="post" action="/student/message/compose" enctype="multipart/form-data" onsubmit="return disableSubmit()">

      <!-- Người nhận -->
      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Người nhận</label>
        <input list="user_suggestions" 
               type="text" 
               class="form-control"
               name="receiver_id"
               placeholder="Nhập Email, ID hoặc Username"
               required />

        <datalist id="user_suggestions">
          {% for u in users %}
            <option value="{{ u.email }}">{{ u.full_name }} – @{{ u.username }}</option>
          {% endfor %}
        </datalist>
      </div>

      <!-- Nội dung -->
      <div class="mb-3">
        <label class="form-label fw-semibold">💬 Nội dung tin nhắn</label>
        <textarea name="content" class="form-control shadow-sm"
                  placeholder="💭 Hãy nhập nội dung muốn gửi..."></textarea>
      </div>

      <!-- Upload file -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📎 Đính kèm tệp</label>

        <div class="file-upload" onclick="openFilePicker()">
          <i class="bi bi-cloud-arrow-up fs-3 d-block mb-2"></i>
          <span id="file_label">Chọn tệp hoặc kéo thả vào đây</span>
        </div>

        <input type="file" name="attachment" id="fileInput" class="d-none"
               onchange="showFileName(this)">
      </div>

      <!-- Gửi -->
      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary" id="sendBtn">
          <i class="bi bi-send-fill me-1"></i> Gửi tin
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Nút quay lại -->
<a href="/student/message/" class="fab-back">
  <i class="bi bi-arrow-left"></i>
</a>

<script>
function openFilePicker() {
  document.getElementById("fileInput").click();
}

function showFileName(input) {
  const fileLabel = document.getElementById("file_label");

  if (!input.files.length) {
    fileLabel.innerHTML = "Chọn tệp hoặc kéo thả vào đây";
    return;
  }

  const file = input.files[0];

  // Xác định icon theo loại file
  let icon = "bi-file-earmark";
  if (file.type.startsWith("image/")) icon = "bi-image";
  else if (file.type === "application/pdf") icon = "bi-file-earmark-pdf";
  else if (file.type.includes("word")) icon = "bi-file-earmark-word";
  else if (file.type.includes("zip")) icon = "bi-file-zip";

  fileLabel.innerHTML = `
    <i class="bi ${icon} me-1"></i>
    <strong>${file.name}</strong>
    <span class="text-muted">(${(file.size / 1024).toFixed(1)} KB)</span>
  `;
}

function disableSubmit() {
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Đang gửi...';
  return true;
}
</script>

{% endblock %}
