{% extends "layout_student.html" %}
{% block title %}Lịch học và kiểm tra{% endblock %}

{% block head_extra %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
<style>
  .schedule-page {
    max-width: 1180px;
    margin: 0 auto;
  }

  .schedule-page-title {
    color: var(--text, #0f172a);
  }

  .schedule-calendar-card {
    background: var(--surface-strong, #ffffff);
    color: var(--text, #0f172a);
    border: 1px solid var(--border, rgba(15, 23, 42, 0.08));
    border-radius: 18px;
    padding: 1rem;
    box-shadow: var(--shadow-soft, 0 10px 28px rgba(15, 23, 42, 0.08));
    overflow: hidden;
  }

  #calendar {
    background: transparent;
    color: var(--text, #0f172a);
  }

  .fc {
    font-family: "Inter", "Segoe UI", sans-serif;
    font-size: 0.95rem;
    color: var(--text, #0f172a);
  }

  .fc .fc-toolbar {
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .fc .fc-toolbar-title {
    font-weight: 800;
    color: var(--primary, #2563eb);
    font-size: 1.25rem;
  }

  .fc .fc-button {
    border-radius: 999px !important;
    border: 1px solid var(--border, rgba(15, 23, 42, 0.08)) !important;
    background: var(--surface, #ffffff) !important;
    color: var(--text, #0f172a) !important;
    box-shadow: none !important;
    font-weight: 600;
  }

  .fc .fc-button:hover,
  .fc .fc-button:focus,
  .fc .fc-button-primary:not(:disabled).fc-button-active {
    background: var(--primary, #2563eb) !important;
    border-color: var(--primary, #2563eb) !important;
    color: #ffffff !important;
  }

  .fc-theme-standard .fc-scrollgrid,
  .fc-theme-standard td,
  .fc-theme-standard th {
    border-color: var(--border, rgba(15, 23, 42, 0.08)) !important;
  }

  .fc .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day-number,
  .fc .fc-timegrid-axis-cushion,
  .fc .fc-timegrid-slot-label-cushion {
    color: var(--text, #0f172a);
    text-decoration: none;
  }

  .fc .fc-daygrid-day.fc-day-today,
  .fc .fc-timegrid-col.fc-day-today {
    background: var(--primary-soft, rgba(37, 99, 235, 0.12)) !important;
  }

  .fc .fc-event {
    border: none !important;
    color: #ffffff !important;
    font-weight: 600;
    padding: 3px 6px;
    border-radius: 9px;
    box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
  }

  .schedule-empty-note {
    background: var(--surface, #ffffff);
    color: var(--text-muted, #64748b);
    border: 1px solid var(--border, rgba(15, 23, 42, 0.08));
    border-radius: 14px;
    padding: 0.75rem 1rem;
  }

  body.dark-mode .schedule-calendar-card,
  body.theme-dark .schedule-calendar-card,
  html.dark .schedule-calendar-card,
  html.dark-mode .schedule-calendar-card,
  html[data-theme="dark"] .schedule-calendar-card,
  body[data-theme="dark"] .schedule-calendar-card,
  [data-bs-theme="dark"] .schedule-calendar-card {
    background: #0f172a;
    color: #e5e7eb;
    border-color: rgba(148, 163, 184, 0.25);
  }

  body.dark-mode .fc,
  body.theme-dark .fc,
  html.dark .fc,
  html.dark-mode .fc,
  html[data-theme="dark"] .fc,
  body[data-theme="dark"] .fc,
  [data-bs-theme="dark"] .fc {
    color: #e5e7eb;
  }

  body.dark-mode .fc .fc-button,
  body.theme-dark .fc .fc-button,
  html.dark .fc .fc-button,
  html.dark-mode .fc .fc-button,
  html[data-theme="dark"] .fc .fc-button,
  body[data-theme="dark"] .fc .fc-button,
  [data-bs-theme="dark"] .fc .fc-button {
    background: #111827 !important;
    color: #e5e7eb !important;
    border-color: rgba(148, 163, 184, 0.28) !important;
  }

  body.dark-mode .fc .fc-toolbar-title,
  body.theme-dark .fc .fc-toolbar-title,
  html.dark .fc .fc-toolbar-title,
  html.dark-mode .fc .fc-toolbar-title,
  html[data-theme="dark"] .fc .fc-toolbar-title,
  body[data-theme="dark"] .fc .fc-toolbar-title,
  [data-bs-theme="dark"] .fc .fc-toolbar-title {
    color: #93c5fd;
  }

  body.dark-mode .fc .fc-col-header-cell-cushion,
  body.dark-mode .fc .fc-daygrid-day-number,
  body.dark-mode .fc .fc-timegrid-axis-cushion,
  body.dark-mode .fc .fc-timegrid-slot-label-cushion,
  body.theme-dark .fc .fc-col-header-cell-cushion,
  body.theme-dark .fc .fc-daygrid-day-number,
  body.theme-dark .fc .fc-timegrid-axis-cushion,
  body.theme-dark .fc .fc-timegrid-slot-label-cushion,
  html.dark .fc .fc-col-header-cell-cushion,
  html.dark .fc .fc-daygrid-day-number,
  html.dark .fc .fc-timegrid-axis-cushion,
  html.dark .fc .fc-timegrid-slot-label-cushion,
  html[data-theme="dark"] .fc .fc-col-header-cell-cushion,
  html[data-theme="dark"] .fc .fc-daygrid-day-number,
  html[data-theme="dark"] .fc .fc-timegrid-axis-cushion,
  html[data-theme="dark"] .fc .fc-timegrid-slot-label-cushion,
  [data-bs-theme="dark"] .fc .fc-col-header-cell-cushion,
  [data-bs-theme="dark"] .fc .fc-daygrid-day-number,
  [data-bs-theme="dark"] .fc .fc-timegrid-axis-cushion,
  [data-bs-theme="dark"] .fc .fc-timegrid-slot-label-cushion {
    color: #e5e7eb;
  }

  body.dark-mode .fc-theme-standard .fc-scrollgrid,
  body.dark-mode .fc-theme-standard td,
  body.dark-mode .fc-theme-standard th,
  body.theme-dark .fc-theme-standard .fc-scrollgrid,
  body.theme-dark .fc-theme-standard td,
  body.theme-dark .fc-theme-standard th,
  html[data-theme="dark"] .fc-theme-standard .fc-scrollgrid,
  html[data-theme="dark"] .fc-theme-standard td,
  html[data-theme="dark"] .fc-theme-standard th,
  [data-bs-theme="dark"] .fc-theme-standard .fc-scrollgrid,
  [data-bs-theme="dark"] .fc-theme-standard td,
  [data-bs-theme="dark"] .fc-theme-standard th {
    border-color: rgba(148, 163, 184, 0.22) !important;
  }

  @media (max-width: 768px) {
    .schedule-page {
      padding-left: 0.25rem;
      padding-right: 0.25rem;
    }

    .schedule-calendar-card {
      padding: 0.75rem;
      border-radius: 16px;
    }

    .schedule-page .btn {
      width: 100%;
    }

    .fc {
      font-size: 0.82rem;
    }

    .fc .fc-toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.65rem;
    }

    .fc .fc-toolbar-chunk {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .fc .fc-toolbar-title {
      font-size: 1.05rem;
      text-align: center;
    }

    .fc .fc-button {
      padding: 0.35rem 0.55rem !important;
      font-size: 0.78rem !important;
    }

    .fc .fc-event {
      font-size: 0.72rem;
      padding: 2px 4px;
      white-space: normal;
      line-height: 1.25;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="container py-4 fade-in schedule-page">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="fw-bold schedule-page-title mb-0">
      <i class="bi bi-calendar3 text-primary"></i> Lịch học và kiểm tra
    </h4>
    <a href="/student/schedule/list" class="btn btn-outline-primary btn-sm rounded-pill px-3">
      <i class="bi bi-list-task"></i> Xem dạng danh sách
    </a>
  </div>

  {% if not events %}
  <div class="schedule-empty-note mb-3">
    <i class="bi bi-info-circle me-1"></i> Hiện chưa có lịch học hoặc kiểm tra.
  </div>
  {% endif %}

  <div class="schedule-calendar-card">
    <div id="calendar"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script id="schedule-data" type="application/json">
  {{ events | default([], true) | tojson | safe }}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const calendarEl = document.getElementById("calendar");
  const rawDataEl = document.getElementById("schedule-data");

  let scheduleData = [];
  try {
    scheduleData = JSON.parse(rawDataEl.textContent || "[]");
  } catch (err) {
    console.error("Không đọc được dữ liệu lịch:", err);
    scheduleData = [];
  }

  const events = scheduleData.map(function (item) {
    return {
      id: item.lesson_id || null,
      title: item.lesson_title ? `${item.course_name || "Khóa học"} - ${item.lesson_title}` : (item.course_name || "Sự kiện"),
      start: item.start,
      end: item.end,
      color: item.color || "#2563eb",
      extendedProps: {
        module_name: item.module_name || "Không có module",
        location: item.location || "Trực tuyến",
        type_label: item.type_label || item.type || "Sự kiện"
      }
    };
  });

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: window.innerWidth < 768 ? "timeGridWeek" : "dayGridMonth",
    locale: "vi",
    height: "auto",
    nowIndicator: true,
    eventDisplay: "block",

    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,timeGridDay"
    },

    buttonText: {
      today: "Hôm nay",
      month: "Tháng",
      week: "Tuần",
      day: "Ngày"
    },

    events: events,

    eventClick: function (info) {
      const props = info.event.extendedProps || {};
      alert(
`Môn học: ${info.event.title}
Module: ${props.module_name || "Không có module"}
Địa điểm: ${props.location || "Trực tuyến"}
Loại lịch: ${props.type_label || "Sự kiện"}`
      );
    }
  });

  calendar.render();
});
</script>
{% endblock %}
