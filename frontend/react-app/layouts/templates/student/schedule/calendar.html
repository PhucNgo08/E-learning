{% extends "layout_student.html" %}
{% block title %}🗓️ Lịch học & Kiểm tra{% endblock %}

{% block content %}
<div class="container mt-4 fade-in">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-primary mb-0">
      <i class="bi bi-calendar3"></i> Lịch học & Kiểm tra
    </h4>
    <a href="/student/schedule/list" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-list-task"></i> Xem dạng danh sách
    </a>
  </div>

  <div id="calendar" class="shadow-sm border rounded-3 p-2"></div>
</div>

<!-- 📅 FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar');
  const scheduleData = JSON.parse(`{{ schedule | tojson | safe }}`);

  // ✨ Chuẩn hóa dữ liệu sự kiện
  const events = scheduleData.map(s => ({
    id: s.lesson_id,
    title: `${s.course_name} - ${s.lesson_title}`,
    start: s.start,
    end: s.end,
    color: s.color,
    extendedProps: {
      module: s.module_name,
      location: s.location || "Trực tuyến"
    }
  }));

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'vi',
    height: "auto",
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    buttonText: { today: 'Hôm nay', month: 'Tháng', week: 'Tuần', day: 'Ngày' },
    events: events,

    eventClick: function(info) {
      const e = info.event.extendedProps;
      alert(`📘 ${info.event.title}\n📦 ${e.module}\n📍 ${e.location}`);
    }
  });

  calendar.render();
});
</script>

<style>
  /* 🌈 Calendar style */
  #calendar {
    background: #fff;
    border-radius: 15px;
    padding: 15px;
  }
  .fc { font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .fc-toolbar-title { font-weight: 600; color: #0d6efd; }
  .fc-button { border-radius: 6px !important; }
  .fc-event {
    border: none !important;
    color: #fff !important;
    font-weight: 500;
    padding: 3px 5px;
    border-radius: 8px;
  }
  .fc .fc-daygrid-day.fc-day-today {
    background-color: rgba(13, 110, 253, 0.1) !important;
  }
</style>
{% endblock %}
