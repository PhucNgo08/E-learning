{% extends "layout_student.html" %}
{% block title %}🎉 Hoàn thành bài học{% endblock %}
{% block content %}
<div class="container py-4 text-center fade-in">
  <div class="card shadow-sm border-0 p-5">
    <h2 class="fw-bold text-success mb-3">
      <i class="bi bi-check-circle-fill"></i> Chúc mừng!
    </h2>
    <p class="text-muted mb-4">
      Bạn đã hoàn thành bài học <strong>{{ lesson.title }}</strong> trong khóa học
      <strong>{{ course.course_name if course else 'Không xác định' }}</strong>.
    </p>
    <a href="/student/lesson/module/{{ lesson.module_id }}" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left-circle"></i> Quay lại danh sách bài học
    </a>
  </div>
</div>
{% endblock %}
