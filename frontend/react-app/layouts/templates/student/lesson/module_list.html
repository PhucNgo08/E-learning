{% extends "layout_student.html" %}
{% block title %}📘 Danh sách module{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <h3 class="fw-bold text-primary mb-3">
    <i class="bi bi-collection"></i> Danh sách module
  </h3>

  {% if modules %}
    {% for module in modules %}
    <a href="/student/lesson/module/{{ module.id }}" class="text-decoration-none">
      <div class="card shadow-sm border-0 mb-3 glass-card p-3">
        <h5 class="mb-0 text-dark">{{ module.title }}</h5>
        <small class="text-muted">{{ module.description or "" }}</small>
      </div>
    </a>
    {% endfor %}
  {% else %}
    <div class="alert alert-info">Không có module nào.</div>
  {% endif %}

</div>
{% endblock %}
