{% extends "layout_student.html" %}
{% block title %}🖋️ Thêm ghi chú{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <!-- Quay lại danh sách ghi chú -->
  <a href="/student/lesson/notes/{{ lesson.id }}" class="btn btn-outline-secondary mb-3">
    <i class="bi bi-arrow-left"></i> Quay lại ghi chú
  </a>

  <div class="card shadow-sm border-0 glass-card p-4">

    <h4 class="fw-bold text-primary mb-3">
      <i class="bi bi-pencil-square me-2"></i> Thêm ghi chú
    </h4>

    <!-- ❗ ROUTE POST CHUẨN -->
    <form method="post" action="/student/lesson/notes/{{ lesson.id }}">
      <textarea name="content" rows="4" required class="form-control mb-3"
                placeholder="Nhập ghi chú..."></textarea>

      <div class="text-end">
        <button class="btn btn-success px-4">
          <i class="bi bi-save"></i> Lưu ghi chú
        </button>
      </div>
    </form>

  </div>
</div>

<style>
.glass-card {
  background: rgba(255,255,255,.1);
  backdrop-filter: blur(20px);
}
</style>
{% endblock %}
