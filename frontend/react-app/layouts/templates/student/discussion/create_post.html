{% extends "layout_student.html" %}
{% block title %}✏️ Tạo bài thảo luận{% endblock %}

{% block content %}
<div class="discussion-create p-4 shadow-sm bg-white rounded-4 fade-in">
  <h4 class="fw-bold mb-4 text-gradient"><i class="bi bi-pencil-square me-2"></i> Tạo bài thảo luận mới</h4>

  <form method="post" action="/student/discussion/create{% if course %}/{{ course.id }}{% endif %}">
    {% if not course %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Chọn khóa học</label>
      <select name="course_id" class="form-select" required>
        <option value="">-- Chọn khóa học --</option>
        {% for c in courses %}
        <option value="{{ c.id }}">{{ c.course_name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label fw-semibold">Nội dung thảo luận</label>
      <textarea name="content" rows="6" class="form-control" placeholder="Viết nội dung bạn muốn trao đổi..." required></textarea>
    </div>

    <button type="submit" class="btn btn-primary px-4 rounded-pill">
      <i class="bi bi-send"></i> Gửi thảo luận
    </button>
    <a href="/student/discussion/" class="btn btn-outline-secondary ms-2">Hủy</a>
  </form>
</div>
{% endblock %}
