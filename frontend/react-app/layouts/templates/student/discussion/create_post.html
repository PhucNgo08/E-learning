{% extends "layout_student.html" %}
{% block title %}✏️ Tạo bài thảo luận{% endblock %}

{% block content %}
<div class="discussion-create discussion-panel fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="fw-bold mb-0 text-gradient">
      <i class="bi bi-pencil-square me-2"></i>
      Tạo bài thảo luận mới
    </h4>

    <a href="{% if course %}/student/discussion/{{ course.id }}{% else %}/student/discussion/{% endif %}"
       class="btn btn-outline-secondary rounded-pill">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
  </div>

  {% if error %}
  <div class="alert alert-danger rounded-3">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
  </div>
  {% endif %}

  <form method="post"
        action="/student/discussion/create{% if course %}/{{ course.id }}{% endif %}">

    {% if not course %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Chọn khóa học</label>
      <select name="course_id" class="form-select rounded-3" required>
        <option value="">-- Chọn khóa học --</option>
        {% for c in courses %}
        <option value="{{ c.id }}"
                {% if old_course_id and old_course_id == c.id %}selected{% endif %}>
          {{ c.course_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    {% else %}
    <div class="alert alert-info rounded-3 py-2">
      <i class="bi bi-book me-1"></i>
      <strong>Khóa học:</strong> {{ course.course_name }}
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label fw-semibold">Nội dung thảo luận</label>
      <textarea
        name="content"
        rows="6"
        class="form-control rounded-3 discussion-textarea"
        placeholder="Viết nội dung bạn muốn trao đổi..."
        required>{{ old_content or '' }}</textarea>
    </div>

    <div class="discussion-actions d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary px-4 rounded-pill">
        <i class="bi bi-send"></i> Gửi thảo luận
      </button>

      <a href="{% if course %}/student/discussion/{{ course.id }}{% else %}/student/discussion/{% endif %}"
         class="btn btn-outline-secondary rounded-pill">
        Hủy
      </a>
    </div>
  </form>
</div>
{% endblock %}
