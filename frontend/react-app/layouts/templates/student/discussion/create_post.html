{% extends "layout_student.html" %}
{% block title %}✏️ Tạo bài thảo luận{% endblock %}

{% block content %}

<style>
  .discussion-create {
    background: var(--card-bg, #ffffff);
    border-radius: 18px;
    padding: 2rem;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

 .text-gradient {
    background: linear-gradient(90deg, #2563eb, #0ea5e9);
    background-clip: text;                 /* 🔵 Bổ sung bản tiêu chuẩn */
    -webkit-background-clip: text;         /* 🔵 Bản hoạt động trên Chrome/Safari */
    color: transparent;
    -webkit-text-fill-color: transparent;  /* Cần cho Chrome */
}


  textarea:focus, select:focus, input:focus {
    border-color: #3b82f6 !important;
    box-shadow: 0 0 0 0.15rem rgba(59,130,246,0.25) !important;
  }
</style>

<div class="discussion-create fade-in">
  <h4 class="fw-bold mb-4 text-gradient">
    <i class="bi bi-pencil-square me-2"></i> 
    Tạo bài thảo luận mới
  </h4>

  <!-- ============================
       🚀 FORM CREATE DISCUSSION
  =============================== -->
  <form method="post" 
        action="/student/discussion/create{% if course %}/{{ course.id }}{% endif %}">
    
    <!-- ============================
         📘 Chọn khóa học (chỉ khi tạo chung)
    =============================== -->
    {% if not course %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Chọn khóa học</label>
      <select name="course_id" class="form-select rounded-3" required>
        <option value="">-- Chọn khóa học --</option>
        {% for c in courses %}
        <option value="{{ c.id }}">
          {{ c.course_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    {% else %}
    <!-- Hiển thị tên khóa học khi tạo theo course -->
    <div class="alert alert-info rounded-3 py-2">
      <i class="bi bi-book me-1"></i>
      <strong>Khóa học:</strong> {{ course.course_name }}
    </div>
    {% endif %}

    <!-- ============================
         ✏️ Nội dung thảo luận
    =============================== -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Nội dung thảo luận</label>
      <textarea 
        name="content" 
        rows="6" 
        class="form-control rounded-3"
        placeholder="Viết nội dung bạn muốn trao đổi..."
        style="resize: vertical;"
        required></textarea>
    </div>

    <!-- ============================
         🔘 Action Buttons
    =============================== -->
    <button type="submit" class="btn btn-primary px-4 rounded-pill">
      <i class="bi bi-send"></i> Gửi thảo luận
    </button>

    <a href="/student/discussion/" 
       class="btn btn-outline-secondary rounded-pill ms-2">
      Hủy
    </a>
  </form>
</div>
{% endblock %}
