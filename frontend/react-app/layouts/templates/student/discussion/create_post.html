{% extends "layout_student.html" %}
{% block title %}✏️ Tạo bài thảo luận{% endblock %}

{% block content %}
<div class="container mt-4">

  <!-- 🔹 Tiêu đề trang -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-primary mb-0">
      <i class="bi bi-pencil-square"></i> {{ page_title or "Tạo bài thảo luận" }}
    </h4>
    <a href="/student/discussion" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left-circle"></i> Quay lại
    </a>
  </div>

  <!-- 🔹 Form tạo bài -->
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="post" action="/student/discussion/create/{{ course_id if course_id else '' }}">
        
        <!-- 🔸 Chọn khóa học nếu không truyền course_id -->
        {% if not course_id %}
        <div class="mb-3">
          <label class="form-label fw-semibold">📘 Chọn khóa học</label>
          <select class="form-select" name="course_id" required>
            <option value="" selected disabled>-- Chọn khóa học --</option>
            {% for c in courses %}
            <option value="{{ c.id }}">{{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}

        <!-- 🔸 Nội dung thảo luận -->
        <div class="mb-3">
          <label class="form-label fw-semibold">💭 Nội dung thảo luận</label>
          <textarea
            name="content"
            rows="6"
            class="form-control"
            placeholder="Nhập nội dung thảo luận của bạn..."
            required
          ></textarea>
        </div>

        <!-- 🔸 Nút hành động -->
        <div class="text-end">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-send"></i> Đăng bài
          </button>
          <a href="/student/discussion" class="btn btn-outline-secondary">
            Hủy
          </a>
        </div>
      </form>
    </div>

    {% if course_name %}
    <div class="card-footer bg-light small text-secondary">
      📘 Khóa học: <strong>{{ course_name }}</strong>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
