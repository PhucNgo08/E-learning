{% extends "layout_student.html" %}
{% block title %}✏️ Tạo bài thảo luận{% endblock %}

{% block content %}
<style>
  .discussion-create {
    background: var(--card-bg, #ffffff);
    border-radius: 18px;
    padding: 2rem;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    animation: fadeUp 0.4s ease;
    max-width: 900px;
    margin: 0 auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .text-gradient {
    background: linear-gradient(90deg, #2563eb, #0ea5e9);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  textarea:focus, select:focus, input:focus {
    border-color: #3b82f6 !important;
    box-shadow: 0 0 0 0.15rem rgba(59,130,246,0.25) !important;
  }
</style>

<div class="discussion-create fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="fw-bold mb-0 text-gradient">
      <i class="bi bi-pencil-square me-2"></i>
      Tạo bài thảo luận mới
    </h4>

    <a href="{% if course %}/student/discussion/{{ course.id }}{% else %}/student/discussion/{% endif %}"
       class="btn btn-outline-secondary rounded-pill">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
  </div>

  {% if error %}
  <div class="alert alert-danger rounded-3">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
  </div>
  {% endif %}

  <form method="post"
        action="/student/discussion/create{% if course %}/{{ course.id }}{% endif %}">

    {% if not course %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Chọn khóa học</label>
      <select name="course_id" class="form-select rounded-3" required>
        <option value="">-- Chọn khóa học --</option>
        {% for c in courses %}
        <option value="{{ c.id }}"
                {% if old_course_id and old_course_id == c.id %}selected{% endif %}>
          {{ c.course_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    {% else %}
    <div class="alert alert-info rounded-3 py-2">
      <i class="bi bi-book me-1"></i>
      <strong>Khóa học:</strong> {{ course.course_name }}
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label fw-semibold">Nội dung thảo luận</label>
      <textarea
        name="content"
        rows="6"
        class="form-control rounded-3"
        placeholder="Viết nội dung bạn muốn trao đổi..."
        style="resize: vertical;"
        required>{{ old_content or '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary px-4 rounded-pill">
      <i class="bi bi-send"></i> Gửi thảo luận
    </button>

    <a href="{% if course %}/student/discussion/{{ course.id }}{% else %}/student/discussion/{% endif %}"
       class="btn btn-outline-secondary rounded-pill ms-2">
      Hủy
    </a>
  </form>
</div>
{% endblock %}
