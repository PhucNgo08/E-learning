{% for r in replies %}
<div class="card mb-2 ms-{{ loop.depth * 3 }} p-2 border-0 shadow-sm">
  <div class="card-body py-2">
    <div class="d-flex justify-content-between align-items-center">
      <span class="fw-semibold">{{ r.author.full_name if r.author else "Ẩn danh" }}</span>
      <small class="text-muted">{{ r.created_at.strftime('%d/%m/%Y %H:%M') }}</small>
    </div>
    <p class="mb-2">{{ r.content }}</p>

    <form action="/student/discussion/reply/{{ r.id }}" method="post" class="ms-3 mb-2">
      <input type="hidden" name="parent_id" value="{{ r.id }}" />
      <textarea name="content" rows="2" class="form-control mb-2" placeholder="Phản hồi..." required></textarea>
      <button class="btn btn-sm btn-outline-primary rounded-pill"><i class="bi bi-reply"></i> Trả lời</button>
    </form>

    {% if r.children %}
      {% include "student/discussion/_reply_thread.html" with context({'replies': r.children}) %}
    {% endif %}
  </div>
</div>
{% endfor %}
