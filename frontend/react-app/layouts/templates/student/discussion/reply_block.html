{% macro render_replies(replies) %}
  {% for r in replies %}
    <div class="reply-item mb-3 p-3 bg-white shadow-sm rounded-3">

      <!-- Avatar + Name + Time -->
      <div class="d-flex align-items-center mb-2">
        <img src="{{ r.author.avatar_url if r.author and r.author.avatar_url else '/static/default-avatar.png' }}"
             class="rounded-circle me-3" width="42" height="42" />
        <div>
          <strong>{{ r.author.full_name if r.author else "Người dùng" }}</strong><br>
          <small class="text-muted">
            <i class="bi bi-clock"></i> {{ r.created_at.strftime('%d/%m/%Y %H:%M') }}
          </small>
        </div>
      </div>

      <!-- Nội dung -->
      <p class="mb-2" style="white-space: pre-line;">{{ r.content }}</p>

      <!-- Reply button -->
      <button class="btn btn-sm btn-outline-primary"
              onclick="setReplyParent('{{ r.id }}')">
        <i class="bi bi-reply"></i> Trả lời
      </button>

      <!-- Children (Replies cấp dưới) -->
      {% if r.children %}
      <div class="ms-4 mt-3 border-start ps-3">
        {{ render_replies(r.children) }}
      </div>
      {% endif %}

    </div>
  {% endfor %}
{% endmacro %}
