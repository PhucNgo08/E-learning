{% extends "layout_student.html" %}
{% block title %}✏️ Chỉnh sửa hồ sơ{% endblock %}

{% block content %}

<style>
/* =====================================================
✏️ EDIT PROFILE – Glass Neo 2025
===================================================== */

.edit-area {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 0;
  min-height: 80vh;
  background: radial-gradient(circle at top left, #f0f7ff 0%, #dce6ff 100%);
}

.edit-box {
  background: #ffffff;
  border-radius: 22px;
  width: 100%;
  max-width: 650px;
  padding: 40px 45px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.08);
  animation: fadeIn 0.6s ease;
  position: relative;
  overflow: hidden;
}

.edit-box::before {
  content: "";
  position: absolute;
  top: -70px;
  right: -70px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: radial-gradient(circle at center, #0d6efd40 0%, transparent 70%);
}

h3 {
  font-weight: 700;
  color: #0056d2;
  text-align: center;
  margin-bottom: 28px;
}

.form-label {
  font-weight: 600;
  color: #003087;
}

.form-control {
  border-radius: 12px;
  border-color: #cfd9e6;
}
.form-control:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 0.25rem rgba(13,110,253,.15);
}

.btn-save {
  background: linear-gradient(90deg, #007bff, #0056d2);
  color: white;
  font-weight: 600;
  border-radius: 12px;
  padding: 10px 22px;
  border: none;
  transition: 0.25s ease;
}
.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 16px rgba(0,0,0,0.2);
}

.btn-back {
  border-radius: 12px;
  font-weight: 500;
  transition: 0.25s ease;
}
.btn-back:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Alerts */
.alert {
  border-radius: 12px;
  font-weight: 500;
}

/* Dark mode */
body.dark-mode .edit-box {
  background: rgba(15, 23, 42, 0.85);
  color: #e2e8f0;
}
body.dark-mode .form-control {
  background: rgba(30, 41, 59, 0.85);
  border-color: #475569;
  color: #e2e8f0;
}
body.dark-mode h3 {
  color: #60a5fa;
}
body.dark-mode .form-label {
  color: #93c5fd;
}

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>


<div class="edit-area">
  <div class="edit-box">

    <h3><i class="bi bi-person-lines-fill"></i> Chỉnh sửa hồ sơ</h3>

    <!-- 🔔 Notifications -->
    {% if request.query_params.get("error") == "update_failed" %}
    <div class="alert alert-danger text-center py-2">❌ Cập nhật thất bại, vui lòng thử lại.</div>
    {% endif %}

    <!-- 📝 FORM EDIT -->
    <form method="post" action="/student/profile/edit">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">👤 Họ tên</label>
          <input type="text" class="form-control" name="full_name"
                 value="{{ user.full_name }}" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">📧 Email</label>
          <input type="text" class="form-control" value="{{ user.email }}" disabled>
        </div>
      </div>

      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">📱 Số điện thoại</label>
          <input type="text" class="form-control" name="phone"
                 value="{{ user.phone or '' }}" placeholder="Nhập số điện thoại...">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">📅 Ngày sinh</label>
          <input type="date" class="form-control" name="date_of_birth"
                 value="{{ user.date_of_birth }}">
        </div>

      </div>

      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">⚧ Giới tính</label>
          <select class="form-select form-control" name="gender">
            <option value="">-- Chọn giới tính --</option>
            <option value="male"   {% if user.gender == 'male' %}selected{% endif %}>Nam</option>
            <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Nữ</option>
            <option value="other"  {% if user.gender == 'other' %}selected{% endif %}>Khác</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">🎓 Ngành học</label>
          <input type="text" class="form-control"
                 value="{{ major.major_name if major else 'Chưa cập nhật' }}" disabled>
        </div>

      </div>

      <div class="row">

        <div class="col-md-6 mb-4">
          <label class="form-label">🏫 Khóa học</label>
          <input type="text" class="form-control"
                 value="{{ academic_year.year_name if academic_year else 'Chưa cập nhật' }}" disabled>
        </div>

        <div class="col-md-6 mb-4">
          <label class="form-label">🆔 MSSV</label>
          <input type="text" class="form-control"
                 value="{{ user.mssv or 'Chưa có' }}" disabled>
        </div>

      </div>

      <!-- Action buttons -->
      <div class="d-flex justify-content-between mt-2">
        <a href="/student/profile" class="btn btn-outline-secondary btn-back">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-save">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
      </div>

    </form>

  </div>
</div>

{% endblock %}
