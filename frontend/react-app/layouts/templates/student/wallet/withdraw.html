{% extends "layout_student.html" %}
{% block title %}💸 Rút tiền{% endblock %}

{% block content %}

<div class="container mt-4 fade show" style="max-width: 650px;">

    <div class="glass-card shadow-lg p-4" style="border-radius: 22px;">

        <!-- HEADER -->
        <div class="text-center mb-4">
            <div class="mx-auto mb-3"
                 style="width: 85px; height: 85px; border-radius: 50%;
                        background: linear-gradient(135deg, #dc2626, #b91c1c);
                        display:flex; justify-content:center; align-items:center;
                        box-shadow:0 10px 22px rgba(220,38,38,0.35);">
                <i class="bi bi-bank2 text-white" style="font-size: 2.6rem;"></i>
            </div>

            <h2 class="fw-bold mb-1">💸 Rút tiền</h2>
            <p class="text-muted mb-0">Nhập số tiền cần rút và ghi chú nếu cần.</p>
        </div>

        <!-- ERROR -->
        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-3">
            <i class="bi bi-x-circle-fill me-2"></i>
            <strong>{{ error }}</strong>
        </div>
        {% endif %}

        <!-- FORM -->
        <form action="/student/wallet/withdraw" method="post">

            <!-- Amount -->
            <label class="form-label fw-semibold">Số tiền cần rút</label>
            <div class="input-group mb-3">
                <span class="input-group-text fw-bold text-danger"
                      style="background: rgba(220,38,38,0.12); border-radius:12px 0 0 12px;">
                    <i class="bi bi-currency-exchange"></i>
                </span>

                <input type="number"
                       name="amount"
                       min="1000"
                       class="form-control form-control-lg"
                       style="border-radius:0 12px 12px 0;"
                       placeholder="Ví dụ: 100.000"
                       required>
            </div>

            <!-- Note -->
            <label class="form-label fw-semibold">Ghi chú (không bắt buộc)</label>
            <div class="input-group mb-2">
                <span class="input-group-text text-muted"
                      style="background: rgba(0,0,0,0.08); border-radius:12px 0 0 12px;">
                    <i class="bi bi-pencil-square"></i>
                </span>

                <input type="text"
                       name="note"
                       class="form-control"
                       style="border-radius:0 12px 12px 0;"
                       placeholder="Ví dụ: Rút về ngân hàng"
                >
            </div>

            <!-- BUTTON -->
            <button class="btn btn-danger w-100 fw-semibold py-3 mt-3"
                    style="border-radius: 12px;
                           background: linear-gradient(135deg, #dc2626, #991b1b);
                           box-shadow: 0 6px 16px rgba(220,38,38,0.32);">
                <i class="bi bi-box-arrow-down me-1"></i>
                Xác nhận rút tiền
            </button>

        </form>

        <!-- BACK -->
        <div class="text-center mt-4">
            <a href="/student/wallet/page"
               class="fw-semibold"
               style="text-decoration:none; color:#2563eb;">
                ← Quay về ví
            </a>
        </div>

    </div>

</div>

{% endblock %}
