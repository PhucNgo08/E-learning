{% extends "layout_student.html" %}
{% block title %}⚙️ Cài đặt thông báo{% endblock %}

{% block content %}
<div class="container py-4">
  <a href="{{ url_for('student_notifications_list') }}" class="btn btn-outline-secondary btn-sm mb-3">
    <i class="bi bi-arrow-left-circle"></i> Quay lại thông báo
  </a>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h5 class="fw-bold text-primary mb-3"><i class="bi bi-gear"></i> Cài đặt thông báo</h5>
      <form>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="system" {% if settings.system %}checked{% endif %}>
          <label class="form-check-label" for="system">Thông báo hệ thống</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="course" {% if settings.course %}checked{% endif %}>
          <label class="form-check-label" for="course">Cập nhật khóa học</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="assignment" {% if settings.assignment %}checked{% endif %}>
          <label class="form-check-label" for="assignment">Bài tập mới</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="quiz" {% if settings.quiz %}checked{% endif %}>
          <label class="form-check-label" for="quiz">Trắc nghiệm & bài kiểm tra</label>
        </div>

        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" id="message" {% if settings.message %}checked{% endif %}>
          <label class="form-check-label" for="message">Tin nhắn cá nhân</label>
        </div>

        <button type="button" class="btn btn-primary">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
