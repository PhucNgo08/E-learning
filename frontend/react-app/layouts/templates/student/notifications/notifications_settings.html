{% extends "layout_student.html" %}
{% block title %}⚙️ Cài đặt thông báo{% endblock %}
{% block content %}
<style>
  .settings-container {
    max-width: 650px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    padding: 2rem;
  }
</style>

<div class="container py-4 fade-in">
  <div class="settings-container">
    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-gear-fill"></i> Cài đặt thông báo</h4>
    <p class="text-muted small mb-4">Tùy chỉnh cách bạn nhận thông báo từ hệ thống.</p>

    <form method="post" action="#">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="emailNotif" {% if settings.email_enabled %}checked{% endif %}>
        <label class="form-check-label" for="emailNotif">Nhận thông báo qua email</label>
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="appNotif" {% if settings.app_enabled %}checked{% endif %}>
        <label class="form-check-label" for="appNotif">Hiển thị thông báo trong ứng dụng</label>
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="soundNotif" {% if settings.sound_enabled %}checked{% endif %}>
        <label class="form-check-label" for="soundNotif">Âm thanh khi có thông báo mới</label>
      </div>

      <div class="text-end mt-4">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
