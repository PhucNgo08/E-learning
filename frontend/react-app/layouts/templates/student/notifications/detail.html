{% extends "layout_student.html" %}
{% block title %}📄 Chi tiết thông báo{% endblock %}
{% block content %}
<style>
  .notif-detail {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    padding: 2rem;
  }
  .notif-detail h5 {
    color: #0d6efd;
  }
  .fab-back {
    position: fixed;
    bottom: 40px;
    left: 40px;
    background: linear-gradient(135deg, #6c757d, #495057);
    color: #fff;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: 0.3s;
  }
  .fab-back:hover {
    transform: scale(1.1);
    background: linear-gradient(135deg, #495057, #343a40);
  }
</style>

<div class="container py-4 fade-in">
  <div class="notif-detail">
    <h5 class="fw-bold mb-3"><i class="bi bi-bell"></i> {{ notification.title }}</h5>
    <p class="text-muted small mb-2">
      <i class="bi bi-clock"></i> {{ notification.created_at.strftime("%d/%m/%Y %H:%M") }}
    </p>
    <hr>
    <p>{{ notification.message | safe }}</p>

    <div class="text-end mt-4">
      <a href="/student/notifications/delete/{{ notification.id }}" class="btn btn-outline-danger btn-sm">
        <i class="bi bi-trash"></i> Xóa thông báo
      </a>
    </div>
  </div>
</div>

<a href="/student/notifications" class="fab-back" title="Quay lại danh sách">
  <i class="bi bi-arrow-left"></i>
</a>
{% endblock %}
