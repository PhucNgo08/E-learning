{% extends "layout_student.html" %}
{% block title %}🗑️ Xóa thông báo{% endblock %}
{% block content %}
<div class="container py-5 text-center fade-in">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 480px;">
    <div class="card-body">
      <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
      <h5 class="fw-bold mb-3 text-danger">Xác nhận xóa thông báo?</h5>
      <p class="text-muted mb-4">Hành động này không thể hoàn tác.</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="/student/notifications/delete/{{ notification.id }}" class="btn btn-danger">
          <i class="bi bi-trash"></i> Xóa
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Hủy
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
