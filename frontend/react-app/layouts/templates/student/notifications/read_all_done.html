{% extends "layout_student.html" %}
{% block title %}✅ Đã đọc tất cả{% endblock %}
{% block content %}
<div class="container py-5 text-center fade-in">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 480px;">
    <div class="card-body py-4">
      <i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
      <h5 class="fw-bold text-success mb-2">Hoàn tất!</h5>
      <p class="text-muted mb-4">{{ message }}</p>
      <a href="/student/notifications" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> Quay lại danh sách
      </a>
    </div>
  </div>
</div>
{% endblock %}
