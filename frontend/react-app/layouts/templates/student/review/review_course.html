{% extends "layout_student.html" %}
{% block title %}⭐ Đánh giá khóa học{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card border-0 shadow-sm p-4">
    <div class="d-flex align-items-center mb-3">
      <i class="bi bi-star text-warning fs-4 me-2"></i>
      <h4 class="fw-bold text-primary mb-0">Đánh giá khóa học: {{ course.course_name }}</h4>
    </div>

    <form method="post" action="/student/review/submit/{{ course.id }}">
      <div class="mb-4">
        <label class="form-label fw-semibold">Chọn số sao:</label>
        <div class="rating">
          {% for i in range(5,0,-1) %}
          <input type="radio" id="star{{i}}" name="rating" value="{{i}}" required>
          <label for="star{{i}}" title="{{i}} sao">
            <i class="bi bi-star-fill"></i>
          </label>
          {% endfor %}
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Nhận xét của bạn:</label>
        <textarea class="form-control" name="comment" rows="4" placeholder="Viết nhận xét..."></textarea>
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-send"></i> Gửi đánh giá
        </button>
      </div>
    </form>
  </div>
</div>

<style>
.rating {
  direction: rtl;
  display: inline-flex;
  gap: 4px;
}
.rating input { display: none; }
.rating label {
  color: #ddd;
  font-size: 1.6rem;
  cursor: pointer;
  transition: color 0.2s;
}
.rating input:checked ~ label,
.rating label:hover,
.rating label:hover ~ label {
  color: #ffc107;
}
</style>
{% endblock %}
