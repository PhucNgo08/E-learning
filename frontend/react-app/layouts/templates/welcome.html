<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chào mừng - E-Learning Academy</title>

  <!-- Font & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .welcome-card {
      background-color: #ffffffee;
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 3rem 2rem;
      max-width: 480px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .welcome-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    .welcome-icon {
      font-size: 3rem;
      color: #2563eb;
      margin-bottom: 1rem;
    }

    h2 {
      font-weight: 700;
      color: #1e3a8a;
    }

    p {
      font-size: 1.05rem;
      margin-top: 0.75rem;
      color: #334155;
    }

    .btn-dashboard {
      background: #2563eb;
      color: white;
      border-radius: 9999px;
      padding: 0.6rem 1.6rem;
      font-weight: 600;
      margin-top: 1.5rem;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-dashboard:hover {
      background: #1d4ed8;
      transform: translateY(-3px);
    }

    footer {
      position: absolute;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="welcome-card" data-aos="fade-up">
    <div class="welcome-icon">🎓</div>
    <h2>Xin chào, <span style="color:#2563eb;">{{ username }}</span>!</h2>
    <p>Chào mừng bạn quay lại <strong>E-Learning Academy</strong>.</p>
    <p><b>Vai trò:</b> {{ role }}</p>

    <a href="/dashboard" class="btn-dashboard" data-aos="zoom-in" data-aos-delay="300">Vào trang quản lý</a>
  </div>

  <footer>
    © 2025 E-Learning Academy. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>
