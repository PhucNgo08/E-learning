<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}E-Learning Academy{% endblock %}</title>

  <!-- Google Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- AOS Animation -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-light: #f3f6fd;
      --text-dark: #1e293b;
      --footer-bg: #0f172a;
    }

    body.dark-mode {
      --bg-light: #0f172a;
      --text-dark: #e2e8f0;
      --footer-bg: #020617;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      margin: 0;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ===================== HEADER ===================== */
    header {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: background 0.3s;
    }

    body.dark-mode header {
      background: rgba(15, 23, 42, 0.7);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .navbar {
      padding: 0.9rem 1.2rem;
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.55rem;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar-brand:hover {
      color: var(--primary-dark);
      transform: translateY(-2px);
    }

    /* Login Button */
    .btn-login {
      background: var(--primary);
      color: #fff;
      border-radius: 50px;
      padding: 0.55rem 1.3rem;
      font-weight: 600;
      transition: 0.25s;
    }

    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    /* ===================== FOOTER ===================== */
    footer {
      background-color: var(--footer-bg);
      color: #e2e8f0;
      text-align: center;
      padding: 2.2rem 1rem;
      font-size: 0.95rem;
      margin-top: 5rem;
      transition: background 0.3s;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
      transition: 0.25s;
    }

    footer a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    /* ===================== DARK MODE TOGGLE ===================== */
    .toggle-dark {
      cursor: pointer;
      font-size: 1.4rem;
      margin-left: 12px;
      color: var(--text-dark);
      transition: 0.3s;
    }

    .toggle-dark:hover {
      opacity: 0.8;
      transform: scale(1.1);
    }

  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header data-aos="fade-down">
    <nav class="navbar container d-flex justify-content-between align-items-center">

      <div class="d-flex align-items-center">
        <a href="/" class="navbar-brand">E-Learning Academy</a>
      </div>

      <div class="d-flex align-items-center">
        <a href="/auth/login" class="btn btn-login">Đăng nhập</a>
        <span class="toggle-dark ms-2" id="darkToggle">🌙</span>
      </div>

    </nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer data-aos="fade-up">
    <p>© 2025 E-Learning Academy. Designed with ❤️ by <a href="#">YourTeam</a></p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <script>
    AOS.init({ duration: 1000, once: true });

    // Dark mode toggle
    const toggleBtn = document.getElementById("darkToggle");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      toggleBtn.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
