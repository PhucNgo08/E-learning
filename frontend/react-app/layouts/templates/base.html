<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}E-Learning Academy{% endblock %}</title>

  <!-- Google Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- AOS Animation -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f6fd;
      color: #1e293b;
      margin: 0;
      overflow-x: hidden;
    }

    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      padding: 0.9rem 1.2rem;
    }

    .navbar-brand {
      font-weight: 700;
      color: #2563eb;
      font-size: 1.5rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .navbar-brand:hover {
      color: #1e40af;
    }

    .btn-login {
      background-color: #2563eb;
      color: #fff;
      border-radius: 9999px;
      padding: 0.55rem 1.4rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    footer {
      background-color: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      margin-top: 5rem;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- ===== HEADER ===== -->
  <header data-aos="fade-down">
    <nav class="navbar container d-flex justify-content-between align-items-center">
      <a href="/" class="navbar-brand">E-Learning Academy</a>
      <a href="/auth/login" class="btn btn-login">Đăng nhập</a>
    </nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer data-aos="fade-up">
    <p>© 2025 E-Learning Academy. Designed with ❤️ by <a href="#">YourTeam</a></p>
  </footer>

  <!-- ===== JS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1000, once: true });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
