<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "🔒 Đặt lại mật khẩu" }}</title>

  <!-- FONT & BOOTSTRAP -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* 📌 NỀN ĐẸP + LỚP PHỦ */
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45)),
        url("/static/images/nen_dn (1).png") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Sao chuyển động */
    body::before {
      content: "";
      position: fixed;
      width: 180%;
      height: 180%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      opacity: 0.15;
      animation: starMove 130s linear infinite;
      z-index: 0;
    }
    @keyframes starMove {
      from { transform: translate(0, 0); }
      to   { transform: translate(-60px, -90px); }
    }

    /* GLASS BOX */
    .reset-wrapper {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.25);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00d4ff;
      text-shadow: 0 0 12px #00d4ff;
      margin-bottom: 1rem;
    }

    /* INPUT */
    .form-control {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: #00d4ff;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.3);
    }

    label {
      color: #ddd;
      font-weight: 500;
    }

    /* BUTTON */
    .btn-primary {
      background: linear-gradient(90deg, #007bff, #00d4ff);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
      transition: 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00d4ff, #007bff);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
      transform: translateY(-1px);
    }

    /* ALERT BOX */
    .alert {
      border-radius: 12px;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.9rem;
    }
    .alert-success { color: #00ffb3; border-color: #00ffb3; }
    .alert-danger  { color: #ff8585; border-color: #ff5252; }

    a {
      color: #00d4ff;
      text-decoration: none;
      transition: 0.3s;
    }
    a:hover {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .reset-wrapper {
        padding: 30px 25px;
      }
      h2 { font-size: 1.4rem; }
    }
  </style>
</head>

<body>

  <div class="reset-wrapper">
    <h2>🔒 Đặt lại mật khẩu</h2>

    {% if error %}
      <div class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>
    {% endif %}

    {% if message %}
      <div class="alert alert-success py-2">
        <i class="bi bi-check-circle"></i> {{ message }}
      </div>
    {% endif %}

    {% if not disabled %}

    <form method="post" action="/auth/reset-password">
      <input type="hidden" name="token" value="{{ token }}" />

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Mật khẩu mới</label>
        <input type="password" name="new_password" class="form-control" placeholder="Nhập mật khẩu mới..." required />
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu..." required />
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="bi bi-lock-fill me-1"></i> Cập nhật mật khẩu
      </button>
    </form>

    {% endif %}

    <p class="mt-4 mb-0">
      <a href="/auth/login" class="fw-semibold">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại đăng nhập
      </a>
    </p>

  </div>

</body>
</html>
