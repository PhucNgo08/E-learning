<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Gaming Portal{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/frontend/react-app/layouts/styles/auth.css" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #0d0f1b, #000);
      background-image: url("/static/images/rog-bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(0,255,255,0.15), transparent 70%),
                  radial-gradient(circle at 20% 80%, rgba(255,0,255,0.1), transparent 70%);
      z-index: 0;
    }
    .forgot-wrapper {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid rgba(0,255,255,0.4);
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,255,255,0.25);
      backdrop-filter: blur(10px);
      z-index: 2;
      animation: slideIn 0.8s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .logo-img {
      max-height: 80px;
      filter: drop-shadow(0 0 10px #00ffff);
    }
    .btn-primary {
      background: linear-gradient(90deg, #00ffff, #00b3ff);
      color: #000;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.7rem 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0,255,255,0.5);
    }
    a { color: #00ffff; text-decoration: none; }
    a:hover { color: #fff; }
  </style>
</head>

<body>
  {% block content %}{% endblock %}
</body>
</html>
