<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu | Gaming Portal</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #0d0f1b, #000);
      background-image: url("/static/images/rog-bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(0,255,255,0.15), transparent 70%),
                  radial-gradient(circle at 20% 80%, rgba(255,0,255,0.1), transparent 70%);
      z-index: 0;
    }

    .forgot-wrapper {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid rgba(0,255,255,0.4);
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,255,255,0.25);
      backdrop-filter: blur(10px);
      z-index: 2;
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo-img {
      max-height: 80px;
      filter: drop-shadow(0 0 10px #00ffff);
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00ffff;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-control {
      background-color: rgba(255,255,255,0.15);
      border: 1px solid rgba(0,255,255,0.4);
      color: #fff;
    }

    .form-control:focus {
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.4);
      background-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00ffff, #00b3ff);
      color: #000;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.7rem 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0,255,255,0.5);
    }

    a {
      color: #00ffff;
      text-decoration: none;
    }

    a:hover {
      color: #fff;
    }

    .text-muted {
      color: #ccc !important;
    }

  </style>
</head>

<body>
  <div class="forgot-wrapper">
    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-2" />
    <h2>Quên mật khẩu</h2>

    {% if message %}
      <div class="alert alert-info py-2" role="alert">{{ message }}</div>
    {% endif %}
    {% if error %}
      <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    {% endif %}

    <p class="text-muted mb-4">
      Nhập địa chỉ email bạn đã đăng ký. Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.
    </p>

    <form method="post">
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">
        <i class="bi bi-envelope-arrow-up me-1"></i> Gửi hướng dẫn
      </button>
    </form>

    <p class="mt-3" style="font-size: 0.9rem;">
      <a href="/auth/login" class="fw-semibold"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
    </p>
  </div>
</body>
</html>
