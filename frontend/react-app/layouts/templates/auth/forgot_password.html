<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "🔑 Quên mật khẩu" }}</title>

  <!-- 🌐 Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* =========================================================
       A) BACKGROUND + LAYER FX (pan/zoom nhẹ)
       - body dùng ảnh nền chính
       - body::after tạo lớp nền animate pan/zoom (rất nhẹ)
       - body::before là lớp sao
       ========================================================= */
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, 0.30), rgba(0, 0, 0, 0.50)),
        url("/static/images/nen_dn (1).png") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* ⭐ Star texture (bạn đang dùng) */
    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      opacity: 0.14;                /* ✅ chỉnh độ sao: 0.08 -> 0.22 */
      animation: drift 140s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(-50px, -90px); }
    }

    /* 🌫️ Lớp pan/zoom nền nhẹ (tạo cảm giác “background sống”) */
    body::after{
      content:"";
      position: fixed;
      inset: -8%;
      z-index: 0;
      pointer-events: none;

      /* Lặp lại ảnh nền để animate bằng transform (không ảnh hưởng body background) */
      background:
        radial-gradient(circle at 20% 30%, rgba(0,212,255,.16), transparent 48%),
        radial-gradient(circle at 80% 70%, rgba(255,204,0,.10), transparent 55%),
        url("/static/images/nen_dn (1).png") no-repeat center center;
      background-size: cover;
      opacity: .45;                 /* ✅ chỉnh mức “sống” nền: 0.25 -> 0.60 */
      filter: blur(0px);
      transform: scale(1.08);
      animation: bgPan 18s ease-in-out infinite alternate; /* ✅ tốc độ background */
    }
    @keyframes bgPan {
      0%   { transform: translate3d(-10px, 6px, 0) scale(1.10); }
      100% { transform: translate3d(12px, -8px, 0) scale(1.14); }
    }

    /* =========================================================
       B) CARD GLASS
       ========================================================= */
    .forgot-wrapper {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.28);
      padding: 36px 34px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: fadeInUp 0.8s ease;
      overflow: hidden;
    }

    /* viền glow nhẹ */
    .forgot-wrapper::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: 24px;
      background: conic-gradient(
        from 0deg,
        rgba(0,212,255,.0),
        rgba(0,212,255,.40),
        rgba(255,204,0,.20),
        rgba(0,212,255,.0)
      );
      filter: blur(14px);
      opacity: .42;                 /* ✅ độ “neon” viền card */
      z-index: -1;
      animation: neonSpin 7s linear infinite;
    }
    @keyframes neonSpin { to { transform: rotate(360deg); } }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =========================================================
       C) ẢNH MINH HOẠ (HÌNH BẠN GỬI) + HOẠT ẢNH
       - Float nhẹ (bay lên xuống)
       - Glow pulse (ánh sáng nhịp)
       - Shimmer sweep (ánh sáng quét ngang)
       - Dust particles (hạt bụi bay) thuần CSS
       ========================================================= */
    .hero-illu-wrap{
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 6px 0 14px;
      isolation: isolate;
    }

    /* 🌟 Glow blob phía sau ảnh */
    .hero-illu-wrap::before{
      content:"";
      position:absolute;
      width: 280px;
      height: 180px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 40%, rgba(0,212,255,.35), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(255,204,0,.20), transparent 60%);
      filter: blur(14px);
      opacity: .9;
      z-index: 0;
      animation: glowPulse 3.8s ease-in-out infinite;
    }
    @keyframes glowPulse{
      0%,100% { transform: scale(1); opacity:.75; }
      50%     { transform: scale(1.06); opacity:1; }
    }

    /* ✨ Shimmer quét ngang phía trước ảnh */
    .hero-illu-wrap::after{
      content:"";
      position:absolute;
      width: 55%;
      height: 120%;
      top: -10%;
      left: -70%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      transform: skewX(-18deg);
      opacity: .0;
      z-index: 2;
      animation: heroShimmer 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes heroShimmer{
      0%   { left:-70%; opacity:0; }
      20%  { opacity:.55; }
      55%  { opacity:.25; }
      100% { left:130%; opacity:0; }
    }

    /* 🖼️ Ảnh minh hoạ */
    .hero-illu{
      width: min(320px, 92%);
      border-radius: 16px;
      z-index: 1;
      box-shadow: 0 18px 45px rgba(0,0,0,0.28);
      filter: saturate(1.05) contrast(1.03);
      animation: floatY 4.6s ease-in-out infinite;
      transform: translateZ(0);
    }
    @keyframes floatY{
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    /* 🌬️ Dust particles (hạt bụi bay) – 10 hạt */
    .dust{
      position:absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .dust i{
      position:absolute;
      width: var(--s);
      height: var(--s);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,.10) 68%, transparent 72%);
      opacity: var(--o);
      left: var(--x);
      top:  var(--y);
      filter: blur(.2px);
      animation: dustMove var(--d) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes dustMove{
      0%   { transform: translate3d(0, 10px, 0); }
      100% { transform: translate3d(var(--dx), -42px, 0); }
    }

    /* =========================================================
       D) LOGO + TEXT
       ========================================================= */
    .logo-img {
      width: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffcc00, #007bff);
      padding: 8px;
      box-shadow: 0 0 18px rgba(0,212,255,.22);
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00d4ff;
      text-shadow: 0 0 12px #00d4ff;
      margin-bottom: 0.7rem;
    }

    p.text-muted {
      color: #d5d5d5 !important;
    }

    /* =========================================================
       E) INPUT
       ========================================================= */
    .form-control {
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.18);
      border-color: #00d4ff;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
    }

    /* =========================================================
       F) BUTTON
       ========================================================= */
    .btn-primary {
      background: linear-gradient(90deg, #007bff, #00d4ff);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
      transition: 0.35s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after{
      content:"";
      position:absolute;
      top:-60%;
      left:-60%;
      width: 60%;
      height: 220%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      transform: rotate(18deg);
      opacity:.0;
      animation: btnSweep 2.6s ease-in-out infinite;
    }
    @keyframes btnSweep{
      0%   { left:-70%; opacity:0; }
      18%  { opacity:.65; }
      100% { left:140%; opacity:0; }
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #00d4ff, #007bff);
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.55);
      transform: translateY(-2px);
    }

    /* RESET LINK */
    .reset-link-box a {
      font-weight: bold;
      color: #ffd75e !important;
      text-decoration: none;
    }
    .reset-link-box a:hover {
      color: #ffe9a3 !important;
      text-shadow: 0 0 10px #ffe9a3;
    }

    a {
      text-decoration: none;
      color: #00d4ff;
    }
    a:hover {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00;
    }

    /* =========================================================
       G) Reduce motion (tắt animation nếu user bật reduce motion)
       ========================================================= */
    @media (prefers-reduced-motion: reduce){
      body::before, body::after,
      .forgot-wrapper, .forgot-wrapper::before,
      .hero-illu, .hero-illu-wrap::before, .hero-illu-wrap::after,
      .dust i, .btn-primary::after{
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="forgot-wrapper">

    <!-- ✅ ẢNH MINH HOẠ (thêm hoạt ảnh) -->
    <div class="hero-illu-wrap">
      <!-- 🔁 ĐỔI src thành ảnh bạn lưu trong static -->
          

      <!-- 🌬️ Dust particles (hạt bụi bay) -->
      <span class="dust" aria-hidden="true">
        <i style="--x:12%;--y:20%;--s:3px;--o:.35;--d:6s; --dx:10px; --delay:-1s"></i>
        <i style="--x:26%;--y:52%;--s:2px;--o:.24;--d:7s; --dx:-8px;--delay:-3s"></i>
        <i style="--x:35%;--y:30%;--s:2.6px;--o:.28;--d:8s;--dx:12px;--delay:-2s"></i>
        <i style="--x:48%;--y:18%;--s:3.2px;--o:.32;--d:7.5s;--dx:-10px;--delay:-4s"></i>
        <i style="--x:58%;--y:44%;--s:2px;--o:.20;--d:9s; --dx:14px;--delay:-5s"></i>
        <i style="--x:66%;--y:26%;--s:2.4px;--o:.26;--d:8.5s;--dx:-12px;--delay:-2.5s"></i>
        <i style="--x:72%;--y:56%;--s:3px;--o:.22;--d:9.5s;--dx:10px;--delay:-6s"></i>
        <i style="--x:80%;--y:22%;--s:2px;--o:.18;--d:10s;--dx:-9px;--delay:-7s"></i>
        <i style="--x:86%;--y:48%;--s:2.8px;--o:.24;--d:8.2s;--dx:11px;--delay:-3.8s"></i>
        <i style="--x:92%;--y:30%;--s:2px;--o:.16;--d:11s;--dx:-7px;--delay:-8s"></i>
      </span>
    </div>

    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-2" />
    <h2>🔑 Quên mật khẩu</h2>

    {% if message %}
      <div class="alert alert-info py-2">
        <i class="bi bi-info-circle"></i> {{ message }}
      </div>
    {% endif %}

    {% if error %}
      <div class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>
    {% endif %}

    {% if reset_link %}
      <div class="alert alert-success py-2 reset-link-box">
        <i class="bi bi-link-45deg"></i>
        <a href="{{ reset_link }}" target="_blank">
          👉 Bấm vào đây để đặt lại mật khẩu
        </a>
      </div>
    {% endif %}

    <p class="text-muted mb-4">
      Nhập email bạn đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.
    </p>

    <form method="post" action="/auth/forgot-password">
      <div class="mb-3 text-start">
        <label for="email" class="form-label text-light fw-semibold">Email</label>
        <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="bi bi-envelope-arrow-up me-1"></i> Gửi hướng dẫn
      </button>
    </form>

    <p class="mt-4 mb-0">
      <a href="/auth/login" class="fw-semibold">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại đăng nhập
      </a>
    </p>

  </div>

</body>
</html>
