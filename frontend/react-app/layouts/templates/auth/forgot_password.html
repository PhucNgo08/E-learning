<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "🔑 Quên mật khẩu" }}</title>

  <!-- 🌐 Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>

    /* NỀN ĐẸP + LỚP PHỦ */
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, 0.30), rgba(0, 0, 0, 0.50)),
        url("/static/images/nen_dn (1).png") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Hiệu ứng sao */
    body::before {
      content: "";
      position: fixed;
      width: 180%;
      height: 180%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      opacity: 0.15;
      animation: drift 140s linear infinite;
      z-index: 0;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(-50px, -90px); }
    }

    /* FORM GLASS ĐẸP */
    .forgot-wrapper {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.28);
      padding: 40px 35px;
      width: 100%;
      max-width: 430px;
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* LOGO */
    .logo-img {
      width: 88px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffcc00, #007bff);
      padding: 8px;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00d4ff;
      text-shadow: 0 0 12px #00d4ff;
      margin-bottom: 0.7rem;
    }

    p.text-muted {
      color: #d5d5d5 !important;
    }

    /* INPUT */
    .form-control {
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.18);
      border-color: #00d4ff;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
    }

    /* BUTTON */
    .btn-primary {
      background: linear-gradient(90deg, #007bff, #00d4ff);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
      transition: 0.35s;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00d4ff, #007bff);
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.55);
      transform: translateY(-2px);
    }

    /* RESET LINK */
    .reset-link-box a {
      font-weight: bold;
      color: #ffd75e !important;
      text-decoration: none;
    }
    .reset-link-box a:hover {
      color: #ffe9a3 !important;
      text-shadow: 0 0 10px #ffe9a3;
    }

    a {
      text-decoration: none;
      color: #00d4ff;
    }
    a:hover {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00;
    }

  </style>
</head>

<body>

  <div class="forgot-wrapper">

    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-3" />
    <h2>🔑 Quên mật khẩu</h2>

    <!-- MESSAGE -->
    {% if message %}
      <div class="alert alert-info py-2">
        <i class="bi bi-info-circle"></i> {{ message }}
      </div>
    {% endif %}

    {% if error %}
      <div class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>
    {% endif %}

    {% if reset_link %}
      <div class="alert alert-success py-2 reset-link-box">
        <i class="bi bi-link-45deg"></i>
        <a href="{{ reset_link }}" target="_blank">
          👉 Bấm vào đây để đặt lại mật khẩu
        </a>
      </div>
    {% endif %}

    <p class="text-muted mb-4">
      Nhập email bạn đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.
    </p>

    <form method="post" action="/auth/forgot-password">
      <div class="mb-3 text-start">
        <label for="email" class="form-label text-light fw-semibold">Email</label>
        <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="bi bi-envelope-arrow-up me-1"></i> Gửi hướng dẫn
      </button>
    </form>

    <p class="mt-4 mb-0">
      <a href="/auth/login" class="fw-semibold">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại đăng nhập
      </a>
    </p>

  </div>

</body>
</html>
