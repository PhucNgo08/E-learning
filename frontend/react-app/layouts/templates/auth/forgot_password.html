<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "🔑 Quên mật khẩu" }}</title>

  <!-- 🌐 Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* 🎨 Tổng thể nền */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1e1e2f, #101018 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* 🌌 Hiệu ứng sao động */
    body::before {
      content: "";
      position: fixed;
      width: 200%;
      height: 200%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      opacity: 0.15;
      animation: drift 120s linear infinite;
      z-index: 0;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-50px, -100px); }
    }

    /* 🦊 Khung chính */
    .forgot-wrapper {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .forgot-wrapper img.logo-img {
      width: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #ffcc00, #007bff);
      padding: 8px;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00d4ff;
      text-shadow: 0 0 10px #00d4ff;
      margin-bottom: 0.5rem;
    }

    p.text-muted {
      color: #d0d0d0 !important;
    }

    /* ✉️ Input và nút */
    .form-control {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: #00d4ff;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(90deg, #007bff, #00d4ff);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
      transition: 0.3s;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00d4ff, #007bff);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      transform: translateY(-1px);
    }

    .alert {
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    a {
      text-decoration: none;
      color: #00d4ff;
      transition: 0.3s;
    }
    a:hover {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00;
    }

    /* 📱 Mobile tối ưu */
    @media (max-width: 480px) {
      .forgot-wrapper {
        padding: 30px 25px;
      }
      h2 { font-size: 1.4rem; }
    }
  </style>
</head>

<body>
  <div class="forgot-wrapper">
    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-3" />
    <h2>🔑 Quên mật khẩu</h2>

    {% if message %}
      <div class="alert alert-info py-2">
        <i class="bi bi-info-circle"></i> {{ message }}
      </div>
    {% endif %}
    {% if error %}
      <div class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>
    {% endif %}

    <p class="text-muted mb-4">
      Nhập địa chỉ email bạn đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.
    </p>

    <form method="post" action="/auth/forgot-password">
      <div class="mb-3 text-start">
        <label for="email" class="form-label text-light fw-semibold">Email</label>
        <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
        <i class="bi bi-envelope-arrow-up me-1"></i> Gửi hướng dẫn
      </button>
    </form>

    <p class="mt-4 mb-0">
      <a href="/auth/login" class="fw-semibold">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại đăng nhập
      </a>
    </p>
  </div>
</body>
</html>
