<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "Quên mật khẩu" }}</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/react-app/layouts/styles/auth.css" />
</head>

<body>
  <div class="forgot-wrapper">
    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-2" />
    <h2>Quên mật khẩu</h2>

    {% if message %}
      <div class="alert alert-info py-2">{{ message }}</div>
    {% endif %}
    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <p class="text-muted mb-4">
      Nhập địa chỉ email bạn đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.
    </p>

    <form method="post" action="/auth/forgot-password">
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input name="email" id="email" type="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-envelope-arrow-up me-1"></i> Gửi hướng dẫn
      </button>
    </form>

    <p class="mt-3">
      <a href="/auth/login" class="fw-semibold"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
    </p>
  </div>
</body>
</html>
