<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập | Gaming Portal</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* ===== 🌌 Tổng thể ===== */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #0b0e19, #000);
      background-image: url("/static/images/rog-bg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 💫 Hiệu ứng ánh sáng mềm */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(0,255,255,0.15), transparent 70%),
                  radial-gradient(circle at 15% 80%, rgba(255,0,180,0.1), transparent 70%);
      z-index: 0;
    }

    /* ===== 🧊 Hộp đăng nhập ===== */
    .login-wrapper {
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(0,255,255,0.4);
      border-radius: 1.25rem;
      padding: 2.8rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,255,255,0.25), inset 0 0 10px rgba(0,255,255,0.1);
      backdrop-filter: blur(10px);
      z-index: 2;
      animation: fadeIn 0.9s ease-out;
    }

    @keyframes fadeIn {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ===== 🦊 Logo ===== */
    .logo-img {
      max-height: 90px;
      filter: drop-shadow(0 0 15px #00ffff);
      transition: all 0.3s ease;
      animation: pulse 3s infinite ease-in-out;
    }

    .logo-img:hover { transform: scale(1.1) rotate(2deg); }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 10px #00ffff); }
      50% { filter: drop-shadow(0 0 25px #00ffff); }
    }

    /* ===== 🔠 Tiêu đề ===== */
    .card-title {
      font-family: 'Orbitron', sans-serif;
      color: #00ffff;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-top: 1rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 8px rgba(0,255,255,0.6);
    }

    /* ===== 🔒 Input ===== */
    .form-control {
      background-color: rgba(255,255,255,0.12);
      border: 1px solid rgba(0,255,255,0.3);
      color: #fff;
      border-radius: 0.6rem;
      padding-right: 2.5rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #00ffff;
      box-shadow: 0 0 18px rgba(0,255,255,0.4);
      background-color: rgba(255,255,255,0.2);
    }

    .form-label { color: #bcd; font-weight: 500; }

    /* 👁 Toggle password */
    .toggle-password {
      cursor: pointer;
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: #00ffff;
      transition: color 0.2s ease, transform 0.3s ease;
    }

    .toggle-password:hover {
      color: #fff;
      transform: translateY(-50%) scale(1.2);
    }

    /* ===== 🔘 Button ===== */
    .btn-primary {
      background: linear-gradient(90deg, #00ffff, #008cff);
      color: #000;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.75rem 1.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0,255,255,0.25);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(0,255,255,0.6);
      background: linear-gradient(90deg, #00e0ff, #00b3ff);
    }

    /* ===== 🧩 Liên kết nhỏ ===== */
    a {
      color: #00ffff;
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover { color: #fff; }

    /* ===== ⚙️ Ghi nhớ & chia cách ===== */
    .form-check-label { color: #bcd; font-size: 0.9rem; }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #00ffff, transparent);
      margin: 1.5rem 0;
      opacity: 0.8;
    }

    /* ===== 📱 Responsive ===== */
    @media (max-width: 576px) {
      .login-wrapper { padding: 2rem 1.5rem; margin: 0 1rem; }
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <img src="/static/images/fox-logo.png" alt="Logo" class="logo-img mb-2" />
    <h2 class="card-title">Đăng nhập</h2>

    {% if error %}
      <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="alert alert-success py-2" role="alert">{{ success }}</div>
    {% endif %}

    <form method="post" novalidate>
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <input name="username" id="username" type="text" class="form-control" placeholder="Nhập tên đăng nhập..." required />
      </div>

      <div class="mb-3 text-start position-relative">
        <label for="password" class="form-label">Mật khẩu</label>
        <input name="password" id="password" type="password" class="form-control" placeholder="••••••••" required />
        <i class="bi bi-eye-slash toggle-password"></i>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Ghi nhớ</label>
        </div>
        <a href="/auth/forgot-password" style="font-size: 0.9rem;">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
      </button>
    </form>

    <div class="divider"></div>

    <p style="font-size: 0.9rem;">
      Chưa có tài khoản?
      <a href="/auth/register" class="fw-semibold">Đăng ký ngay</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.classList.toggle('bi-eye');
      toggleBtn.classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
