<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập | E-Learning Portal</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- ✅ External CSS -->
  <link rel="stylesheet" href="/frontend/react-app/layouts/styles/auth.css" />
</head>

<body>
  <div class="login-wrapper text-center">
    <img src="{{ url_for('static', path='images/fox-logo.png') }}" alt="Logo" class="logo-img mb-2" />
    <h2 class="fw-bold mb-3">🔐 Đăng nhập</h2>

    <!-- 🟢 Thông báo đổi mật khẩu -->
    {% if request.query_params.get("msg") == "logout_after_change" %}
      <div class="alert alert-success py-2 text-center">
        ✅ Mật khẩu đã được đổi thành công. Vui lòng đăng nhập lại.
      </div>
    {% endif %}

    <!-- ⚠️ Hiển thị thông báo lỗi / cảnh báo -->
    {% if error %}
      <div class="alert alert-danger text-start small py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
      </div>
    {% endif %}
    {% if success %}
      <div class="alert alert-success text-start small py-2" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i> {{ success }}
      </div>
    {% endif %}

    <!-- 🔐 Form đăng nhập -->
    <form method="post" novalidate>
      <div class="mb-3 text-start">
        <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
        <input 
          name="username" id="username" type="text" 
          class="form-control" placeholder="Nhập tên đăng nhập..." required 
          autofocus />
      </div>

      <div class="mb-3 text-start position-relative">
        <label for="password" class="form-label fw-semibold">Mật khẩu</label>
        <input 
          name="password" id="password" type="password" 
          class="form-control" placeholder="••••••••" required />
        <i class="bi bi-eye-slash toggle-password"></i>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Ghi nhớ</label>
        </div>
        <a href="/auth/forgot-password" class="small text-decoration-none text-primary">
          Quên mật khẩu?
        </a>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
      </button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- 👁 Toggle password -->
  <script>
    const toggleBtn = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.classList.toggle('bi-eye');
      toggleBtn.classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
