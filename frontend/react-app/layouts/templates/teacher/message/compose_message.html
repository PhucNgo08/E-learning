{% extends "layout_teacher.html" %}
{% block title %}✉️ Soạn tin nhắn{% endblock %}

{% block content %}
<style>
  .compose-container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    padding: 2rem;
  }
  .file-upload {
    border: 2px dashed #d0d7de;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: #6c757d;
    cursor: pointer;
    transition: 0.3s;
  }
  .file-upload:hover {
    border-color: #0d6efd;
    background: #f8f9fa;
    color: #0d6efd;
  }
</style>

<div class="container py-4">
  <div class="compose-container">
    <h4 class="fw-bold text-primary mb-3">
      <i class="bi bi-pencil-square"></i> Soạn tin nhắn mới
    </h4>
    <p class="text-muted small mb-4">
      Nhập email hoặc ID người nhận, soạn nội dung và đính kèm tệp nếu cần.
    </p>

    <form method="post" action="/teacher/message/compose" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Người nhận (Email hoặc ID)</label>
        <input type="text" class="form-control" name="receiver_id"
               placeholder="VD: hocvien@email.com hoặc UUID" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">💬 Nội dung tin nhắn</label>
        <textarea class="form-control" name="content" rows="6"
                  placeholder="Nhập nội dung cần gửi..." required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📎 Đính kèm tệp (tùy chọn)</label>
        <div class="file-upload" onclick="document.getElementById('file_input').click()">
          <i class="bi bi-cloud-arrow-up fs-3 d-block mb-2"></i>
          <span id="file_label">Chọn tệp hoặc kéo thả vào đây</span>
        </div>
        <input type="file" id="file_input" name="attachment" class="d-none" onchange="showFileName(this)">
      </div>

      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-send-fill"></i> Gửi tin nhắn
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function showFileName(input) {
  const label = document.getElementById('file_label');
  if (input.files.length > 0) {
    const f = input.files[0];
    label.innerHTML = `<strong>${f.name}</strong> (${(f.size / 1024).toFixed(1)} KB)`;
  } else {
    label.textContent = "Chọn tệp hoặc kéo thả vào đây";
  }
}
</script>
{% endblock %}
