<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}🎓 E-Learning - Giáo viên{% endblock %}</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Teacher Layout CSS -->
<link rel="stylesheet" href="/frontend/react-app/layouts/styles/teacher.css" />


  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
  </style>
</head>

<body>
  <!-- 🌐 SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-header text-center">
      <img src="/static/images/fox-logo.png" alt="Teacher Avatar" />
      <span class="fw-semibold">Giáo viên E-Learning</span>
    </div>

    <a href="/teacher/dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/teacher/classes/list"><i class="bi bi-people-fill"></i> Lớp học</a>
    <a href="/teacher/schedule/list"><i class="bi bi-calendar-week"></i> Lịch dạy</a>
    <a href="/teacher/courses/list"><i class="bi bi-journal-bookmark"></i> Khóa học</a>
    <a href="/teacher/materials/list"><i class="bi bi-folder2-open"></i> Tài liệu</a>
    <a href="/teacher/statistics/index"><i class="bi bi-bar-chart"></i> Thống kê</a>
    <a href="/teacher/assignments/list"><i class="bi bi-journal-check"></i> Bài tập</a>
    <a href="/teacher/reviews/manage"><i class="bi bi-star"></i> Đánh giá</a>
    <a href="/teacher/profile"><i class="bi bi-person-circle"></i> Hồ sơ cá nhân</a>

    <div class="sidebar-footer">
      <img src="/static/images/fox-logo.png" alt="Teacher Avatar" />
      <div>👋 Xin chào, <strong>{{ teacher.full_name if teacher else "Teacher" }}</strong></div>
      <a href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
    </div>
  </nav>

  <!-- 🌟 HEADER -->
  <header class="teacher-header">
    <div class="nav-icons ms-auto">
      <i class="bi bi-bell"></i>
      <i class="bi bi-envelope"></i>
      <i class="bi bi-person-circle"></i>
    </div>
  </header>

  <!-- ⚙️ TOGGLE BUTTONS -->
  <button class="toggle-btn" id="toggleSidebar"><i class="bi bi-list"></i></button>
  <button class="mode-toggle" id="toggleMode"><i class="bi bi-moon-fill"></i></button>

  <!-- 📄 CONTENT -->
  <main id="content" class="p-4">
    {% block content %}{% endblock %}
  </main>

  <!-- ⚡ FOOTER -->
  <footer class="text-center mt-4 mb-2">
    <small>© {{ now.year }} E-Learning Platform | Teacher Panel</small>
  </footer>

  <!-- 🔧 SCRIPT -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleSidebar");
    const modeToggle = document.getElementById("toggleMode");

    toggleBtn.addEventListener("click", () => sidebar.classList.toggle("hidden"));

    const setDarkMode = (dark) => {
      document.body.classList.toggle("dark-mode", dark);
      modeToggle.innerHTML = dark
        ? '<i class="bi bi-sun-fill"></i>'
        : '<i class="bi bi-moon-fill"></i>';
      localStorage.setItem("darkMode", dark);
    };

    modeToggle.addEventListener("click", () =>
      setDarkMode(!document.body.classList.contains("dark-mode"))
    );

    if (localStorage.getItem("darkMode") === "true") setDarkMode(true);
  </script>
</body>
</html>
