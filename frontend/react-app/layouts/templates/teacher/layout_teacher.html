<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}👨‍🏫 Bảng điều khiển giảng viên{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  {% block extra_head %}{% endblock %}

  <style>
    body {
      background-color: #f3f6fd;
      font-family: "Segoe UI", "Inter", sans-serif;
    }
    header {
      background: linear-gradient(135deg, #0d6efd, #003087);
      color: white;
      padding: 12px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    footer {
      background: #e9ecef;
      color: #6c757d;
      padding: 10px;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <header class="d-flex justify-content-between align-items-center">
    <h4 class="m-0">👨‍🏫 Khu vực giảng viên</h4>
    <div>
      <a href="/teacher/dashboard" class="btn btn-light btn-sm me-2">
        <i class="bi bi-house-door"></i> Trang chủ
      </a>
      <a href="/auth/logout" class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-right"></i> Đăng xuất
      </a>
    </div>
  </header>

  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; {{ now.year if now else 2025 }} E-Learning Platform — Teacher Dashboard
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
