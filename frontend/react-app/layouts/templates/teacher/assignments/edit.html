<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f6f9ff; }
    .container { max-width: 700px; }
  </style>
</head>
<body class="p-4">

  <div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-primary">
        <i class="bi bi-pencil-square"></i> Chỉnh sửa bài tập
      </h4>
      <a href="/teacher/assignments/list" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <form method="post" action="/teacher/assignments/edit/{{ assignment.id }}">
      <div class="mb-3">
        <label class="form-label fw-bold">Tiêu đề bài tập</label>
        <input type="text" name="title" class="form-control" value="{{ assignment.title }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Mô tả</label>
        <textarea name="description" class="form-control" rows="4">{{ assignment.description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Hạn nộp</label>
        <input type="datetime-local" name="due_date" class="form-control"
               value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') }}" required>
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
        <a href="/teacher/assignments/list" class="btn btn-outline-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
      </div>
    </form>
  </div>

</body>
</html>
