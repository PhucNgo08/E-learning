<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f6f9ff; }
    .card-custom {
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }
    .form-label { font-weight: 600; }
  </style>
</head>

<body class="p-4">
  <div class="container card-custom p-4 shadow-sm" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold text-primary mb-0">
          <i class="bi bi-pencil-square"></i> Chỉnh sửa bài tập
        </h4>
        {% if teacher_name %}
        <small class="text-muted">Giáo viên: {{ teacher_name }}</small>
        {% endif %}
      </div>

      <a href="/teacher/assignments/list" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left-circle"></i> Quay lại
      </a>
    </div>

    <form method="post" action="/teacher/assignments/edit/{{ assignment.id }}">
      <div class="mb-3">
        <label class="form-label">Khóa học</label>
        <input type="text" class="form-control bg-light"
               value="{% if assignment.course %}{{ assignment.course.course_code }} - {{ assignment.course.course_name }}{% else %}Không xác định{% endif %}"
               disabled>
      </div>

      {% if assignment.module %}
      <div class="mb-3">
        <label class="form-label">Module</label>
        <input type="text" class="form-control bg-light"
               value="{{ assignment.module.module_number }}. {{ assignment.module.title }}"
               disabled>
      </div>
      {% endif %}

      <div class="mb-3">
        <label class="form-label">Tiêu đề bài tập <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" value="{{ assignment.title }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="4">{{ assignment.description or '' }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Hạn nộp <span class="text-danger">*</span></label>
        <input type="datetime-local" name="due_date" class="form-control"
               value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') if assignment.due_date else '' }}" required>
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
        <a href="/teacher/assignments/list" class="btn btn-outline-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
      </div>
    </form>
  </div>
</body>
</html>
