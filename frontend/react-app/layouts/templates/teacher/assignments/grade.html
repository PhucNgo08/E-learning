<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🧮 Chấm điểm bài nộp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f4f7fb; }
    .container { max-width: 700px; }
  </style>
</head>
<body class="p-4">

  <div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-primary">
        <i class="bi bi-pencil-square"></i> Chấm điểm bài nộp
      </h4>
      <a href="/teacher/assignments/submissions/{{ submission.assignment_id }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">👨‍🎓 Học viên</label>
      <p class="form-control-plaintext">{{ student.full_name }}</p>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">🗓️ Thời gian nộp</label>
      <p class="form-control-plaintext">
        {{ submission.submission_time.strftime('%d/%m/%Y %H:%M') if submission.submission_time else 'Chưa nộp' }}
      </p>
    </div>

    <form method="post" action="/teacher/assignments/grade/{{ submission.id }}">
      <div class="mb-3">
        <label class="form-label fw-bold">💯 Điểm</label>
        <input type="number" name="grade" class="form-control" min="0" max="100" step="0.1"
               value="{{ submission.grade if submission.grade else '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">📝 Phản hồi</label>
        <textarea name="feedback" class="form-control" rows="4">{{ submission.feedback or '' }}</textarea>
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle"></i> Lưu kết quả
        </button>
        <a href="/teacher/assignments/submissions/{{ submission.assignment_id }}" class="btn btn-outline-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
      </div>
    </form>
  </div>

</body>
</html>
