{% extends "layout_teacher.html" %}
{% block title %}📤 Upload tài liệu{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="bg-white shadow-sm rounded p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold text-primary">
        <i class="bi bi-cloud-upload"></i> Tải lên tài liệu mới
      </h3>
      <a href="/teacher/materials/list" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left-circle"></i> Quay lại danh sách
      </a>
    </div>

    <form method="post" action="/teacher/materials/upload" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">📘 Khóa học</label>
          <select name="course_id" class="form-select" required>
            <option value="">-- Chọn khóa học --</option>
            {% for c in courses %}
              <option value="{{ c.id }}">{{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">📝 Tiêu đề</label>
          <input type="text" name="title" class="form-control" placeholder="VD: Slide Chương 1" required>
        </div>

        <div class="col-12">
          <label class="form-label">📄 Mô tả (tùy chọn)</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Mô tả ngắn gọn về tài liệu..."></textarea>
        </div>

        <div class="col-12">
          <label class="form-label">📎 Chọn file</label>
          <input type="file" name="file" class="form-control" required>
          <div class="form-text text-muted">Hỗ trợ PDF, PPTX, DOCX, ZIP, MP4, ...</div>
        </div>

        <div class="col-12 text-end mt-3">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-upload"></i> Tải lên
          </button>
          <a href="/teacher/materials/list" class="btn btn-light">Huỷ</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
