<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📊 Thống kê giảng dạy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #f5f8ff, #e9efff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    .stats-card {
      border: none;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
    .stats-icon {
      font-size: 2rem;
      color: #0056d2;
    }
    .stats-value {
      font-size: 2rem;
      font-weight: bold;
      color: #003087;
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="text-primary fw-bold">
        <i class="bi bi-bar-chart-line"></i> Bảng thống kê giảng dạy
      </h3>
      <a href="/teacher/dashboard" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <div class="row g-4">
      <div class="col-md-3">
        <div class="stats-card p-4 text-center">
          <div class="stats-icon mb-2"><i class="bi bi-file-earmark-text"></i></div>
          <h6 class="text-muted">Bài tập đã tạo</h6>
          <div class="stats-value">{{ data.total_assignments }}</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card p-4 text-center">
          <div class="stats-icon mb-2"><i class="bi bi-upload"></i></div>
          <h6 class="text-muted">Bài nộp</h6>
          <div class="stats-value">{{ data.total_submissions }}</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card p-4 text-center">
          <div class="stats-icon mb-2"><i class="bi bi-mortarboard"></i></div>
          <h6 class="text-muted">Bài học hoàn thành</h6>
          <div class="stats-value">{{ data.completed_lessons }}</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card p-4 text-center">
          <div class="stats-icon mb-2"><i class="bi bi-clipboard-data"></i></div>
          <h6 class="text-muted">Điểm trung bình Quiz</h6>
          <div class="stats-value">{{ data.avg_quiz_score }}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
