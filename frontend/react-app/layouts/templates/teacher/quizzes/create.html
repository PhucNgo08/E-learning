{% extends "layout_teacher.html" %}
{% block title %}➕ Tạo Quiz{% endblock %}

{% block content %}
<style>
  .quiz-form-card {
    max-width: 920px;
    margin: 0 auto;
    border: 1px solid #e9ecef;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
  }
  .section-title {
    font-weight: 700;
    color: #0d6efd;
  }
  .hidden-block {
    display: none;
  }
</style>

<div class="container py-4">
  <div class="quiz-form-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h3 class="section-title mb-1">➕ Tạo Quiz mới</h3>
        <p class="text-muted mb-0">Tạo practice quiz hoặc graded quiz cho khóa học.</p>
      </div>
      <a href="/teacher/quizzes/list" class="btn btn-outline-secondary">← Quay lại</a>
    </div>

    <form method="post" action="/teacher/quizzes/create">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Khóa học</label>
          <select name="course_id" class="form-select" required>
            <option value="">-- Chọn khóa học --</option>
            {% for c in courses %}
            <option value="{{ c.id }}">{{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Loại quiz</label>
          <select name="quiz_type" id="quiz_type" class="form-select" required>
            <option value="practice">Practice Quiz</option>
            <option value="graded">Graded Quiz</option>
          </select>
        </div>

        <div class="col-md-8">
          <label class="form-label fw-semibold">Tiêu đề</label>
          <input type="text" name="title" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Số câu</label>
          <input type="number" name="total_questions" class="form-control" min="1" value="10" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Mô tả</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="col-md-4 practice-only">
          <label class="form-label fw-semibold">Độ khó</label>
          <select name="difficulty_level" class="form-select">
            <option value="easy">Dễ</option>
            <option value="medium" selected>Trung bình</option>
            <option value="hard">Khó</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Thời gian làm bài (phút)</label>
          <input type="number" name="time_limit_minutes" class="form-control" min="1" value="30" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Số lần làm tối đa</label>
          <input type="number" name="max_attempts" class="form-control" min="1" value="1" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Điểm đạt (%)</label>
          <input type="number" name="passing_score" class="form-control" min="0" max="100" step="0.1" value="60" required>
        </div>

        <div class="col-md-4 graded-only hidden-block">
          <label class="form-label fw-semibold">Mở từ</label>
          <input type="datetime-local" name="available_from" class="form-control">
        </div>

        <div class="col-md-4 graded-only hidden-block">
          <label class="form-label fw-semibold">Đóng lúc</label>
          <input type="datetime-local" name="available_to" class="form-control">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="/teacher/quizzes/list" class="btn btn-outline-secondary">Hủy</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Tạo Quiz
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function toggleQuizFields() {
    const type = document.getElementById("quiz_type").value;
    document.querySelectorAll(".graded-only").forEach(el => {
      el.classList.toggle("hidden-block", type !== "graded");
    });
    document.querySelectorAll(".practice-only").forEach(el => {
      el.classList.toggle("hidden-block", type === "graded");
    });
  }

  document.getElementById("quiz_type").addEventListener("change", toggleQuizFields);
  toggleQuizFields();
</script>
{% endblock %}
