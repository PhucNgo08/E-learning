{% extends "layout_teacher.html" %}
{% block title %}➕ Thêm câu hỏi{% endblock %}

{% block content %}

<style>
  :root {
    --quiz-bg: #f5f7fb;
    --quiz-card: #ffffff;
    --quiz-border: #e5e7eb;
    --quiz-text: #1f2937;
    --quiz-muted: #6b7280;
    --quiz-primary: #2563eb;
    --quiz-soft: #eff6ff;
    --quiz-shadow: 0 12px 28px rgba(15, 23, 42, .08);
  }

  body.dark-mode,
  body.theme-dark,
  html[data-theme="dark"],
  body[data-theme="dark"],
  [data-bs-theme="dark"] {
    --quiz-bg: #071226;
    --quiz-card: #0f1b33;
    --quiz-border: rgba(255,255,255,.12);
    --quiz-text: #e5edf8;
    --quiz-muted: #9caec8;
    --quiz-primary: #8ea6ff;
    --quiz-soft: rgba(96, 165, 250, .12);
    --quiz-shadow: 0 18px 44px rgba(0,0,0,.35);
  }

  .quiz-page {
    min-height: calc(100vh - 90px);
    padding: 24px 12px 42px;
    background: var(--quiz-bg);
    color: var(--quiz-text);
  }

  .quiz-card {
    background: var(--quiz-card);
    border: 1px solid var(--quiz-border);
    border-radius: 18px;
    box-shadow: var(--quiz-shadow);
    color: var(--quiz-text);
  }

  .quiz-card .text-muted { color: var(--quiz-muted) !important; }
  .quiz-title { color: var(--quiz-primary); font-weight: 800; }

  .quiz-card .form-label { font-weight: 700; color: var(--quiz-text); }
  .quiz-card .form-control,
  .quiz-card .form-select,
  .quiz-card textarea {
    border-radius: 12px;
    border-color: var(--quiz-border);
    background-color: var(--quiz-card);
    color: var(--quiz-text);
  }
  .quiz-card .form-control:focus,
  .quiz-card .form-select:focus,
  .quiz-card textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 .22rem rgba(37, 99, 235, .14);
  }
  .quiz-card .form-select option { background: var(--quiz-card); color: var(--quiz-text); }

  .quiz-table { margin-bottom: 0; }
  .quiz-table thead th {
    background: var(--quiz-soft) !important;
    color: var(--quiz-primary) !important;
    border-color: var(--quiz-border) !important;
    font-weight: 800;
    white-space: nowrap;
  }
  .quiz-table td { border-color: var(--quiz-border); vertical-align: middle; color: var(--quiz-text); }

  .quiz-empty {
    border: 1px dashed var(--quiz-border);
    border-radius: 16px;
    padding: 34px 18px;
    background: var(--quiz-soft);
    text-align: center;
  }

  .quiz-stat {
    border: 1px solid var(--quiz-border);
    border-radius: 16px;
    background: var(--quiz-card);
    padding: 18px;
    height: 100%;
  }

  .quiz-action-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .hidden-block { display: none !important; }

  @media (max-width: 768px) {
    .quiz-page { padding: 16px 8px 30px; }
    .quiz-card { border-radius: 14px; }
    .quiz-action-group { justify-content: flex-start; }
  }
</style>



<div class="quiz-page">
  <div class="container" style="max-width: 880px;">
    <div class="quiz-card p-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
          <h3 class="quiz-title mb-1"><i class="bi bi-plus-circle"></i> Thêm câu hỏi</h3>
          <p class="text-muted mb-0">Quiz: {{ quiz.title }}</p>
        </div>
        <a href="/teacher/quizzes/detail/{{ quiz.id }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>

      <form method="post" action="/teacher/quizzes/{{ quiz.id }}/question/create">
        <div class="mb-3">
          <label class="form-label">Nội dung câu hỏi <span class="text-danger">*</span></label>
          <textarea class="form-control" name="question_text" required rows="3" placeholder="Nhập câu hỏi..."></textarea>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Đáp án A <span class="text-danger">*</span></label>
            <input class="form-control" name="option_a" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Đáp án B <span class="text-danger">*</span></label>
            <input class="form-control" name="option_b" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Đáp án C <span class="text-danger">*</span></label>
            <input class="form-control" name="option_c" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Đáp án D <span class="text-danger">*</span></label>
            <input class="form-control" name="option_d" required>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">Đáp án đúng <span class="text-danger">*</span></label>
          <select class="form-select" name="correct" required>
            <option value="">-- Chọn đáp án đúng --</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
            <option value="d">D</option>
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 flex-wrap">
          <a class="btn btn-outline-secondary" href="/teacher/quizzes/detail/{{ quiz.id }}">Hủy</a>
          <button class="btn btn-success px-4" type="submit">
            <i class="bi bi-save"></i> Lưu câu hỏi
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
