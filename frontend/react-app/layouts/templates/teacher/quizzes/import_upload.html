{% extends "layout_teacher.html" %}
{% block title %}📥 Import câu hỏi – {{ quiz.title }}{% endblock %}

{% block content %}

<style>
/* ==========================================================
   📥 IMPORT QUESTIONS – GLASS NEO PRO MAX 2025 (v15)
========================================================== */

.import-wrapper {
  max-width: 760px;
  margin: auto;
  padding-top: 40px;
  padding-bottom: 60px;
}

.import-card {
  padding: 2rem 2.2rem;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(18px);
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.45);
  box-shadow: 0 10px 32px rgba(0,0,0,0.10);
  animation: fadeIn .45s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.dropzone-pro {
  border: 2px dashed #6c8cff;
  padding: 45px;
  border-radius: 18px;
  text-align: center;
  background: rgba(247,249,255,0.85);
  cursor: pointer;
  transition: .25s ease;
}

.dropzone-pro:hover {
  background: rgba(234,240,255,0.9);
  transform: scale(1.02);
}

/* Dragover Highlight */
.dropzone-pro.dragover {
  background: rgba(200,220,255,0.9);
  border-color: #3b6bff;
}

.file-name {
  margin-top: 10px;
  font-style: italic;
  color: #444;
}

.btn-pro {
  border-radius: 12px;
  padding: 10px 22px;
  transition: .25s ease;
}

.btn-pro:hover {
  transform: translateY(-3px);
}

/* 🌙 DARK MODE */
body.dark-mode .import-card {
  background: rgba(30,41,59,0.55);
  border-color: rgba(255,255,255,0.1);
}

body.dark-mode .dropzone-pro {
  background: rgba(40,50,70,0.55);
  border-color: rgba(150,170,255,0.4);
}

body.dark-mode .dropzone-pro:hover {
  background: rgba(60,80,140,0.55);
}

body.dark-mode .dropzone-pro.dragover {
  background: rgba(80,120,200,0.55);
}

body.dark-mode .file-name {
  color: #e2e8f0;
}
</style>


<div class="container import-wrapper fade-in">

  <div class="import-card">

    <h3 class="text-center fw-bold mb-4 text-primary">
      <i class="bi bi-upload"></i> Import câu hỏi vào Quiz
    </h3>

    <p class="text-center text-muted mb-4">
      Quiz: <strong class="text-primary">{{ quiz.title }}</strong>
    </p>

    <!-- FORM UPLOAD -->
    <form id="importForm"
          action="/teacher/quizzes/{{ quiz.id }}/import/preview"
          method="post"
          enctype="multipart/form-data">

      <label class="form-label fw-semibold">📄 Chọn file Excel / CSV / TXT</label>

      <!-- DROPZONE -->
      <label class="dropzone-pro" id="dropzone">
        <i class="bi bi-file-earmark-arrow-up text-primary fs-1"></i>
        <p class="mt-2 mb-1">Kéo thả file vào đây hoặc click để chọn</p>
        <small class="text-muted">Hỗ trợ: .xlsx / .csv / .txt</small>

        <input type="file"
               name="file"
               id="fileInput"
               accept=".xlsx,.csv,.txt"
               class="d-none"
               required>
      </label>

      <div id="fileName" class="file-name"></div>

      <div class="d-flex justify-content-between mt-4">

        <!-- Quay lại đúng route -->
        <a href="/teacher/quizzes/detail/{{ quiz.id }}"
           class="btn btn-secondary btn-pro">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>

        <button type="submit"
                class="btn btn-primary btn-pro"
                id="submitBtn">
          <i class="bi bi-cloud-arrow-up"></i> Tải lên
        </button>

      </div>

    </form>

  </div>

</div>


<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const submitBtn = document.getElementById("submitBtn");
const form = document.getElementById("importForm");

/* Click để mở file dialog */
dropzone.addEventListener("click", () => fileInput.click());

/* Khi chọn file */
fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) fileName.innerText = "📌 Đã chọn: " + file.name;
});

/* Drag-over highlight */
dropzone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});
dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");

  const file = e.dataTransfer.files[0];
  if (file) {
    fileInput.files = e.dataTransfer.files;
    fileName.innerText = "📌 Đã chọn: " + file.name;
  }
});

/* Submit loading */
form.addEventListener("submit", (e) => {
  if (!fileInput.files.length) {
    alert("Vui lòng chọn file!");
    e.preventDefault();
    return;
  }
  submitBtn.disabled = true;
  submitBtn.innerHTML = "<i class='bi bi-hourglass-split'></i> Đang xử lý...";
});
</script>

{% endblock %}
