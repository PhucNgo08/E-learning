{% extends "layout_teacher.html" %}
{% block title %}📥 Import câu hỏi{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="bg-white rounded shadow-sm p-4 mx-auto" style="max-width: 780px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold text-primary mb-1">📥 Import câu hỏi</h3>
        <p class="text-muted mb-0">Quiz: {{ quiz.title }}</p>
      </div>
      <a href="/teacher/quizzes/detail/{{ quiz.id }}" class="btn btn-outline-secondary">← Quay lại</a>
    </div>

    <div class="alert alert-info">
      Hỗ trợ file <strong>.txt</strong>, <strong>.csv</strong>, <strong>.xlsx</strong>.
      Dữ liệu cần có các cột: <code>question_text</code>, <code>option_a</code>, <code>option_b</code>, <code>option_c</code>, <code>option_d</code>, <code>correct</code>.
    </div>

    <form method="post" action="/teacher/quizzes/{{ quiz.id }}/import/preview" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label fw-semibold">Chọn file import</label>
        <input type="file" name="file" class="form-control" accept=".txt,.csv,.xlsx" required>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="/teacher/quizzes/detail/{{ quiz.id }}" class="btn btn-outline-secondary">Hủy</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-upload"></i> Xem trước dữ liệu
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
