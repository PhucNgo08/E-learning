{% extends "layout_teacher.html" %}
{% block title %}✏️ Chỉnh sửa Quiz{% endblock %}

{% block content %}
<style>
  .quiz-form-card {
    max-width: 920px;
    margin: 0 auto;
    border: 1px solid #e9ecef;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
  }
  .hidden-block {
    display: none;
  }
</style>

<div class="container py-4">
  <div class="quiz-form-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h3 class="fw-bold text-primary mb-1">✏️ Chỉnh sửa Quiz</h3>
        <p class="text-muted mb-0">{{ quiz.title }}</p>
      </div>
      <a href="/teacher/quizzes/list" class="btn btn-outline-secondary">← Quay lại</a>
    </div>

    <form method="post" action="/teacher/quizzes/edit/{{ quiz.id }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Khóa học</label>
          <select name="course_id" class="form-select" {% if mode == 'graded' %}disabled{% endif %} required>
            {% for c in courses %}
            <option value="{{ c.id }}" {% if quiz.course_id == c.id %}selected{% endif %}>
              {{ c.course_name }}
            </option>
            {% endfor %}
          </select>
          {% if mode == 'graded' %}
          <input type="hidden" name="course_id" value="{{ quiz.course_id }}">
          {% endif %}
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Loại quiz</label>
          <input type="text" class="form-control bg-light"
                 value="{{ 'Graded Quiz' if mode == 'graded' else 'Practice Quiz' }}" readonly>
          <input type="hidden" name="quiz_type" value="{{ mode }}">
        </div>

        <div class="col-md-8">
          <label class="form-label fw-semibold">Tiêu đề</label>
          <input type="text" name="title" class="form-control" value="{{ quiz.title }}" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Số câu</label>
          <input type="number" name="total_questions" class="form-control" min="1" value="{{ quiz.total_questions or 0 }}" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Mô tả</label>
          <textarea name="description" class="form-control" rows="3">{{ quiz.description or '' }}</textarea>
        </div>

        <div class="col-md-4 {% if mode == 'graded' %}hidden-block{% endif %}">
          <label class="form-label fw-semibold">Độ khó</label>
          <select name="difficulty_level" class="form-select">
            <option value="easy" {% if quiz.difficulty_level == 'easy' %}selected{% endif %}>Dễ</option>
            <option value="medium" {% if quiz.difficulty_level == 'medium' %}selected{% endif %}>Trung bình</option>
            <option value="hard" {% if quiz.difficulty_level == 'hard' %}selected{% endif %}>Khó</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Thời gian làm bài (phút)</label>
          <input type="number" name="time_limit_minutes" class="form-control" min="1" value="{{ quiz.time_limit_minutes or 30 }}" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Số lần làm tối đa</label>
          <input type="number" name="max_attempts" class="form-control" min="1" value="{{ quiz.max_attempts or 1 }}" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Điểm đạt (%)</label>
          <input type="number" name="passing_score" class="form-control" min="0" max="100" step="0.1" value="{{ quiz.passing_score or 60 }}" required>
        </div>

        {% if mode == "graded" %}
        <div class="col-md-4">
          <label class="form-label fw-semibold">Mở từ</label>
          <input type="datetime-local"
                 name="available_from"
                 class="form-control"
                 value="{{ quiz.available_from.strftime('%Y-%m-%dT%H:%M') if quiz.available_from else '' }}">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Đóng lúc</label>
          <input type="datetime-local"
                 name="available_to"
                 class="form-control"
                 value="{{ quiz.available_to.strftime('%Y-%m-%dT%H:%M') if quiz.available_to else '' }}">
        </div>
        {% else %}
        <input type="hidden" name="available_from" value="">
        <input type="hidden" name="available_to" value="">
        {% endif %}
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="/teacher/quizzes/list" class="btn btn-outline-secondary">Hủy</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
