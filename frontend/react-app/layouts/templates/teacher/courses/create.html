<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>➕ Tạo khóa học mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body { background: #f5f8ff; font-family: "Inter", "Segoe UI", sans-serif; }
    .navbar { background: linear-gradient(90deg,#0056d2,#003087); }
    .navbar-brand, .btn-outline-light { font-weight: 500; }
    .form-label { font-weight: 600; color: #003087; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/teacher/courses/list"><i class="bi bi-mortarboard-fill"></i> Quản lý khóa học</a>
      <a href="/teacher/courses/list" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Quay lại</a>
    </div>
  </nav>

  <div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width: 760px;">
    <h3 class="text-primary text-center mb-4"><i class="bi bi-plus-circle"></i> Tạo khóa học mới</h3>

    <form method="post" enctype="multipart/form-data" action="/teacher/courses/create">
      <div class="mb-3">
        <label class="form-label">Tên khóa học</label>
        <input type="text" name="course_name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả khóa học</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Tín chỉ</label>
          <input type="number" name="credit_hours" class="form-control" value="3" min="1">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Môn học</label>
          <input type="text" name="subject" class="form-control" placeholder="VD: Python, SQL,...">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Lớp / Khối</label>
          <input type="number" name="grade_level" class="form-control" placeholder="VD: 12">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Ảnh bìa (tùy chọn)</label>
        <input type="file" name="thumbnail" class="form-control" accept="image/*">
      </div>

      <div class="d-flex justify-content-between">
        <a href="/teacher/courses/list" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Hủy
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Lưu khóa học
        </button>
      </div>
    </form>
  </div>

  <footer class="text-center mt-5 text-muted small">© 2025 E-Learning Platform</footer>
</body>
</html>
