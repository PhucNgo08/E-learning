<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✏️ Chỉnh sửa khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width:760px;">
    <h3 class="text-center text-primary mb-4"><i class="bi bi-pencil-square"></i> Chỉnh sửa khóa học</h3>

    <form method="post" enctype="multipart/form-data" action="/teacher/courses/edit/{{ course.id }}">
      <div class="mb-3">
        <label class="form-label">Tên khóa học</label>
        <input type="text" name="course_name" class="form-control" value="{{ course.course_name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3">{{ course.description }}</textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Tín chỉ</label>
          <input type="number" name="credit_hours" class="form-control" value="{{ course.credit_hours }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Trạng thái</label>
          <select name="status_str" class="form-select">
            <option value="draft" {% if course.status == 'draft' %}selected{% endif %}>Nháp</option>
            <option value="published" {% if course.status == 'published' %}selected{% endif %}>Xuất bản</option>
            <option value="archived" {% if course.status == 'archived' %}selected{% endif %}>Lưu trữ</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Ảnh bìa (nếu muốn thay)</label>
        <input type="file" name="thumbnail" class="form-control">
      </div>

      <div class="d-flex justify-content-between">
        <a href="/teacher/courses/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Lưu thay đổi</button>
      </div>
    </form>
  </div>
</body>
</html>
