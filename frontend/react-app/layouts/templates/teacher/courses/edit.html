{% extends "layout_teacher.html" %}
{% block title %}✏️ Chỉnh sửa Khóa Học{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #eef3ff;
      font-family: "Inter", sans-serif;
    }
    .page-wrapper {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 2rem 2.5rem;
      margin-top: 35px;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    }
    .nav-tabs .nav-link.active {
      background: #0d6efd;
      color: #fff !important;
    }
    label {
      font-weight: 600;
    }
    .preview-img {
      width: 100%;
      max-height: 260px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.2);
      object-fit: cover;
      margin-top: 10px;
    }
  </style>

</head>
<body>

<div class="page-wrapper">

  <h3 class="text-primary fw-bold mb-4">
    <i class="bi bi-pencil-square"></i> Chỉnh sửa Khóa Học
  </h3>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-basic">Thông tin chính</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-time">Lịch - Học vụ</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-settings">Cài đặt khóa học</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-limit">Giới hạn</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-thumb">Ảnh đại diện</button></li>
  </ul>

  <form method="post" action="/teacher/courses/edit/{{ course.id }}" enctype="multipart/form-data">
    <div class="tab-content">

      <!-- TAB 1 – BASIC -->
      <div class="tab-pane fade show active" id="tab-basic">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Tên khóa học *</label>
            <input type="text" class="form-control" name="course_name" value="{{ course.course_name }}" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Môn học *</label>
            <input type="text" class="form-control" name="subject" value="{{ course.subject }}">
          </div>

          <div class="col-md-4">
            <label class="form-label">Số tín chỉ *</label>
            <input type="number" class="form-control" name="credit_hours" value="{{ course.credit_hours }}" min="1">
          </div>

          <div class="col-md-4">
            <label class="form-label">Độ khó</label>
            <select class="form-select" name="difficulty_level">
              <option value="beginner" {% if course.difficulty_level=='beginner' %}selected{% endif %}>Dễ</option>
              <option value="intermediate" {% if course.difficulty_level=='intermediate' %}selected{% endif %}>Trung bình</option>
              <option value="advanced" {% if course.difficulty_level=='advanced' %}selected{% endif %}>Khó</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Cấp độ lớp</label>
            <input type="number" class="form-control" name="grade_level" value="{{ course.grade_level }}">
          </div>

          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" name="description" rows="3">{{ course.description }}</textarea>
          </div>

        </div>
      </div>

      <!-- TAB 2 – TIME / YEAR -->
      <div class="tab-pane fade" id="tab-time">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Năm học *</label>
            <select class="form-select" name="academic_year_id">
              <option value="">-- Chọn năm học --</option>
              {% for y in years %}
                <option value="{{ y.id }}" {% if course.academic_year_id == y.id %}selected{% endif %}>{{ y.year_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Ngành học (Tự động)</label>
            <input type="text" readonly class="form-control bg-light"
                   value="{{ teacher.major.major_name if teacher.major else 'Không xác định' }}">
          </div>

          <input type="hidden" name="major_id" value="{{ teacher.major_id }}">

          <div class="col-md-4">
            <label class="form-label">Ngày bắt đầu</label>
            <input type="date" class="form-control" name="start_date" value="{{ course.start_date }}">
          </div>

          <div class="col-md-4">
            <label class="form-label">Ngày kết thúc</label>
            <input type="date" class="form-control" name="end_date" value="{{ course.end_date }}">
          </div>

          <div class="col-md-4">
            <label class="form-label">Học kỳ</label>
            <input type="number" class="form-control" name="semester" value="{{ course.semester }}">
          </div>

        </div>
      </div>

      <!-- TAB 3 – SETTINGS -->
      <div class="tab-pane fade" id="tab-settings">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Cho phép bài tập</label>
            <select class="form-select" name="allow_assignments">
              <option value="1" {% if course.allow_assignments %}selected{% endif %}>Có</option>
              <option value="0" {% if not course.allow_assignments %}selected{% endif %}>Không</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Hình thức nộp bài</label>
            <select class="form-select" name="default_submission_type">
              <option value="individual" {% if course.default_submission_type=='individual' %}selected{% endif %}>Cá nhân</option>
              <option value="group" {% if course.default_submission_type=='group' %}selected{% endif %}>Nhóm</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Tiên quyết</label>
            <textarea class="form-control" name="prerequisites">{{ course.prerequisites }}</textarea>
          </div>

        </div>
      </div>

      <!-- TAB 4 – LIMIT -->
      <div class="tab-pane fade" id="tab-limit">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Giá khóa học (VNĐ)</label>
            <input type="number" class="form-control" name="price" min="0" value="{{ course.price }}" step="1000">
          </div>

          <div class="col-md-6">
            <label class="form-label">Số lượng tối đa</label>
            <input type="number" class="form-control" name="max_students" min="1" value="{{ course.max_students }}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Chế độ đăng ký</label>
            <select class="form-select" name="enrollment_mode">
              <option value="auto" {% if course.enrollment_mode=='auto' %}selected{% endif %}>Tự động</option>
              <option value="approval" {% if course.enrollment_mode=='approval' %}selected{% endif %}>Chờ duyệt</option>
              <option value="invite_only" {% if course.enrollment_mode=='invite_only' %}selected{% endif %}>Mời</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Công khai</label>
            <select class="form-select" name="is_public">
              <option value="0" {% if not course.is_public %}selected{% endif %}>Không</option>
              <option value="1" {% if course.is_public %}selected{% endif %}>Có</option>
            </select>
          </div>

        </div>
      </div>

      <!-- TAB 5 – THUMBNAIL -->
      <div class="tab-pane fade" id="tab-thumb">
        <div class="col-md-6">
          <label class="form-label">Ảnh đại diện</label>
          <img src="{{ course.thumbnail_url or '/uploads/course_thumbnails/default-course.png' }}" id="preview" class="preview-img">
          <input type="file" class="form-control mt-2" name="thumbnail" accept="image/*" onchange="previewImage(event)">
        </div>
        <p class="text-muted mt-2">Hỗ trợ: JPG, PNG, GIF, WEBP (khuyến nghị 1280x720)</p>
      </div>

      <!-- STATUS FIELD (Router yêu cầu) -->
      <input type="hidden" name="status_str" value="{{ course.status }}">

    </div>

    <!-- Action -->
    <div class="d-flex justify-content-between mt-4">
      <a href="/teacher/courses/manage" class="btn btn-secondary px-4">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>

      <button class="btn btn-success px-4" type="submit">
        <i class="bi bi-check-lg"></i> Lưu thay đổi
      </button>
    </div>

  </form>

</div>

<script>
function previewImage(event) {
  const preview = document.getElementById("preview");
  if (event.target.files && event.target.files[0]) {
    preview.src = URL.createObjectURL(event.target.files[0]);
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
