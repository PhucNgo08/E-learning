<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>✏️ Chỉnh sửa bài học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width:760px;">
  <h4 class="text-primary fw-bold mb-4"><i class="bi bi-pencil-square"></i> Chỉnh sửa bài học</h4>
  <form method="post">
    <input type="hidden" name="lesson_id" value="{{ lesson.id }}" />
    <div class="mb-3">
      <label class="form-label">Tên bài học</label>
      <input type="text" name="title" class="form-control" value="{{ lesson.title }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Loại nội dung</label>
      <select name="content_type" class="form-select">
        <option value="video" {% if lesson.content_type=='video' %}selected{% endif %}>Video</option>
        <option value="document" {% if lesson.content_type=='document' %}selected{% endif %}>Tài liệu</option>
        <option value="quiz" {% if lesson.content_type=='quiz' %}selected{% endif %}>Trắc nghiệm</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">URL Video / Tài liệu</label>
      <input type="url" name="video_url" value="{{ lesson.video_url }}" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Mô tả</label>
      <textarea name="description" class="form-control" rows="3">{{ lesson.description }}</textarea>
    </div>
    <div class="d-flex justify-content-between">
      <a href="/teacher/dashboard" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
      <button class="btn btn-success"><i class="bi bi-save"></i> Lưu thay đổi</button>
    </div>
  </form>
</div>
</body>
</html>
