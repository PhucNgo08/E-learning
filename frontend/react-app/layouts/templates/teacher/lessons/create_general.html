<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>➕ Tạo bài học mới</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: #f3f6fc;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    .card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      background: #ffffffdd;
      backdrop-filter: blur(6px);
    }

    .btn-primary {
      background: linear-gradient(90deg, #0062ff, #004aad);
      border: none;
      font-weight: 600;
      padding: 0.6rem 1.6rem;
      border-radius: 50px;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #004aad, #00398c);
    }

    .header-icon {
      color: #0062ff;
    }

    select {
      padding: 10px 14px !important;
      border-radius: 10px !important;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width: 720px;">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div>
          <h3 class="fw-bold mb-1">
            <i class="bi bi-journal-plus header-icon"></i> Tạo bài học mới
          </h3>
          {% if teacher_name %}
          <small class="text-muted">Giảng viên: {{ teacher_name }}</small>
          {% endif %}
        </div>

        <a href="/teacher/lessons/list-all" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>

      <p class="text-muted mb-4">
        Chọn chương mà bạn muốn thêm bài học vào.
      </p>

      <form id="selectModuleForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Chọn chương</label>
          <select id="module_id" name="module_id" class="form-select" required>
            <option value="">-- Chọn chương --</option>

            {% for m in modules %}
            <option value="{{ m.id }}">
              {{ m.course.course_name if m.course else 'Không rõ khóa học' }} — Module {{ m.module_number }}: {{ m.title }}
            </option>
            {% endfor %}
          </select>
        </div>

        {% if not modules %}
        <div class="alert alert-info">
          Hiện chưa có module nào thuộc các khóa học bạn đang giảng dạy.
        </div>
        {% endif %}

        <div class="d-flex justify-content-between mt-4">
          <a href="/teacher/lessons/list-all" class="btn btn-outline-secondary px-4 py-2">
            <i class="bi bi-arrow-left"></i> Quay lại
          </a>

          <button type="submit" class="btn btn-primary" {% if not modules %}disabled{% endif %}>
            Tiếp tục <i class="bi bi-arrow-right-circle"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("selectModuleForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const moduleId = document.getElementById("module_id").value;
      if (!moduleId) {
        alert("⚠️ Vui lòng chọn module trước khi tiếp tục!");
        return;
      }

      window.location.href = "/teacher/lessons/create/" + moduleId;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
