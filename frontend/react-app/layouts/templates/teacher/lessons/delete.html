<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑️ Xóa bài học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
      <div class="card-body text-center">
        <h4 class="fw-bold text-danger mb-3">Xác nhận xóa bài học</h4>
        <p class="text-muted">Bạn có chắc chắn muốn xóa bài học 
          <strong class="text-dark">{{ lesson.title }}</strong> không?</p>

        <form method="post" action="/teacher/lessons/delete/{{ lesson.id }}">
          <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash"></i> Xóa
          </button>
          <a href="/teacher/lessons/list/{{ lesson.module_id }}" class="btn btn-secondary px-4 ms-2">
            <i class="bi bi-arrow-left"></i> Hủy
          </a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
