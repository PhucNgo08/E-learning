<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Tạo bài học mới</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f8ff;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg,#0056d2,#003087);
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.07);
      background: #fff;
    }

    .form-label {
      font-weight: 600;
      color: #003087;
    }

    .btn-primary {
      background: linear-gradient(90deg,#0062ff,#004aad);
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      opacity: .95;
    }

    #preview {
      max-height: 180px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/teacher/dashboard">
        <i class="bi bi-mortarboard-fill"></i> E-Learning Teacher
      </a>
      <a href="/teacher/lessons/list/{{ module.id }}" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width:780px;">

      <h3 class="fw-bold text-primary mb-3">
        <i class="bi bi-journal-plus"></i> Tạo bài học mới
      </h3>

      <div class="mb-3">
        <label class="form-label">📘 Thuộc module</label>
        <input class="form-control" value="{{ module.title }}" disabled>
      </div>

      <form method="post" enctype="multipart/form-data">

        <!-- Title -->
        <div class="mb-3">
          <label class="form-label">📝 Tên bài học <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" required placeholder="Nhập tên bài học...">
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label">📄 Mô tả</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Mô tả bài học..."></textarea>
        </div>

        <!-- Video URL -->
        <div class="mb-3">
          <label class="form-label">🔗 Video URL (nếu có)</label>
          <input type="url" name="video_url" class="form-control" placeholder="https://youtube.com/...">
        </div>

        <!-- Document URL -->
        <div class="mb-3">
          <label class="form-label">📁 Tài liệu (Document URL)</label>
          <input type="text" name="document_url" class="form-control" placeholder="https://link-tai-lieu...">
        </div>

        <!-- Thumbnail -->
        <div class="mb-3">
          <label class="form-label">🖼 Thumbnail (tuỳ chọn)</label>
          <input type="file" name="thumbnail" class="form-control" accept="image/*" onchange="previewImg(event)">
          <img id="preview" class="img-fluid rounded mt-2 d-none" />
        </div>

        <div class="d-flex justify-content-between">
          <a href="/teacher/lessons/list/{{ module.id }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle"></i> Hủy
          </a>

          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Lưu bài học
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    function previewImg(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('preview');

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('d-none');
      }
    }
  </script>

</body>
</html>
