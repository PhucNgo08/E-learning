<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>➕ Tạo bài học mới</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #eef3ff;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .navbar {
      background: linear-gradient(90deg, #0056d2, #003087);
    }
    .lesson-card {
      border-radius: 18px;
      padding: 28px;
      background: white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
    }
    .form-label {
      font-weight: 600;
      color: #003087;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #003087;
      border-left: 4px solid #0d6efd;
      padding-left: 10px;
      margin-bottom: 12px;
    }
    .thumbnail-preview {
      max-height: 180px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #d0d0d0;
    }
    .question-card {
      border: 1px solid #d6d6d6;
      padding: 16px;
      border-radius: 10px;
      background: #fafbff;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/teacher/dashboard">
        <i class="bi bi-mortarboard-fill"></i> E-Learning Teacher
      </a>
      <a href="/teacher/lessons/list/{{ module.id }}" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container mt-5">
    <div class="lesson-card mx-auto" style="max-width: 800px;">

      <h3 class="fw-bold text-primary mb-3">
        <i class="bi bi-journal-plus"></i> Tạo bài học mới
      </h3>

      <!-- Module Info -->
      <div class="mb-3">
        <label class="form-label">📘 Thuộc module</label>
        <input class="form-control" value="{{ module.title }}" disabled>
      </div>

      <form method="post" enctype="multipart/form-data" onsubmit="return validateForm()">

        <!-- TITLE -->
        <div class="mb-4">
          <div class="section-title">📝 Thông tin cơ bản</div>

          <label class="form-label">Tên bài học <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" required placeholder="Nhập tên bài học...">
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-4">
          <label class="form-label">📄 Mô tả bài học</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Nhập mô tả..."></textarea>
        </div>

        <!-- VIDEO -->
        <div class="mb-4">
          <div class="section-title">🎥 Video bài học (tuỳ chọn)</div>
          <input type="url" name="video_url" class="form-control" placeholder="https://youtube.com/...">
        </div>

        <!-- DOCUMENT UPLOAD -->
        <div class="mb-4">
          <div class="section-title">📁 Tài liệu bài học (upload file *tuỳ chọn*)</div>

          <input type="file" name="document_file" id="document_file"
            class="form-control"
            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip"
            onchange="showDocName()">

          <small id="doc_name" class="text-muted mt-1 d-block"></small>
        </div>

        <!-- QUIZ AREA -->
        <div class="section-title">
          <i class="bi bi-ui-checks-grid"></i> Thêm câu hỏi trắc nghiệm (tuỳ chọn)
        </div>

        <div id="questions_list"></div>

        <button type="button" class="btn btn-outline-primary mb-3" onclick="addQuestion()">
          <i class="bi bi-plus-circle"></i> Thêm câu hỏi
        </button>

        <textarea id="questions_json" name="questions_json" class="d-none"></textarea>

        <!-- THUMBNAIL -->
        <div class="mb-4">
          <label class="form-label">🖼 Thumbnail ảnh (tuỳ chọn)</label>
          <input type="file" name="thumbnail" class="form-control" accept="image/*" onchange="previewImg(event)">
          <img id="thumbnail_preview" class="thumbnail-preview d-none">
        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-between mt-4">
          <a href="/teacher/lessons/list/{{ module.id }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle"></i> Hủy
          </a>

          <button type="submit" class="btn btn-primary" onclick="saveQuestions()">
            <i class="bi bi-check-circle"></i> Lưu bài học
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    /* Hiển thị tên file tài liệu */
    function showDocName() {
      const file = document.getElementById("document_file").files[0];
      const nameBox = document.getElementById("doc_name");

      if (file) nameBox.innerHTML = "📄 Đã chọn: <b>" + file.name + "</b>";
      else nameBox.innerHTML = "";
    }

    /* Add question card */
    let qIndex = 0;

    function addQuestion() {
      qIndex++;

      const qHtml = `
        <div class="question-card" id="q${qIndex}">
          <label class="form-label">❓ Câu hỏi ${qIndex}</label>
          <input type="text" class="form-control mb-3" placeholder="Nhập câu hỏi..." id="question_${qIndex}">

          <label class="form-label">Đáp án</label>

          ${[1,2,3,4].map(n => `
            <div class="input-group mb-2">
              <span class="input-group-text">Đáp án ${n}</span>
              <input type="text" class="form-control" id="q${qIndex}_opt${n}">
            </div>
          `).join("")}

          <label class="form-label mt-3">✔ Chọn đáp án đúng</label>
          <select id="correct_${qIndex}" class="form-select mb-3" style="max-width:220px;">
            <option value="">-- Chọn đáp án --</option>
            <option value="1">Đáp án 1</option>
            <option value="2">Đáp án 2</option>
            <option value="3">Đáp án 3</option>
            <option value="4">Đáp án 4</option>
          </select>

          <button type="button" class="btn btn-danger btn-sm mt-1" onclick="removeQ(${qIndex})">
            <i class="bi bi-trash"></i> Xóa câu
          </button>
        </div>
      `;

      document.getElementById("questions_list").insertAdjacentHTML("beforeend", qHtml);
    }

    function removeQ(index) {
      document.getElementById("q" + index)?.remove();
    }

    /* Save questions to JSON */
    function saveQuestions() {
      const questions = [];

      for (let i = 1; i <= qIndex; i++) {
        const box = document.getElementById("q" + i);
        if (!box) continue;

        const question = document.getElementById(`question_${i}`).value;

        const options = [
          document.getElementById(`q${i}_opt1`).value,
          document.getElementById(`q${i}_opt2`).value,
          document.getElementById(`q${i}_opt3`).value,
          document.getElementById(`q${i}_opt4`).value
        ];

        const correct = document.getElementById(`correct_${i}`).value;
        const correctAnswer = correct ? parseInt(correct) : null;

        questions.push({ question, options, correct: correctAnswer });
      }

      document.getElementById("questions_json").value = JSON.stringify(questions);
    }

    /* Thumbnail preview */
    function previewImg(e) {
      const file = e.target.files[0];
      const preview = document.getElementById("thumbnail_preview");

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove("d-none");
      }
    }

    /* Validate: ít nhất 1 loại nội dung */
    function validateForm() {
      let video = document.querySelector("[name='video_url']").value.trim();
      let docFile = document.getElementById("document_file").files.length;
      let quiz = document.getElementById("questions_json").value.trim();

      if (video === "" && docFile === 0 && quiz === "[]") {
        alert("❌ Vui lòng thêm Video hoặc File tài liệu hoặc Câu hỏi Trắc nghiệm!");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
