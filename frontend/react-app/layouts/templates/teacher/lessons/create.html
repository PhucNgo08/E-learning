<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>➕ Tạo bài học mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: #f5f8ff;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg, #0056d2, #003087);
    }

    .navbar-brand, .btn-outline-light {
      color: #fff !important;
      font-weight: 500;
    }

    .form-label {
      font-weight: 600;
      color: #003087;
    }

    footer {
      background: #003087;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/teacher/dashboard">
        <i class="bi bi-mortarboard-fill"></i> E-Learning - Giáo viên
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>
  </nav>

  <!-- Form -->
  <div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width:760px;">
    <h4 class="fw-bold text-primary mb-4">
      <i class="bi bi-plus-circle"></i> Tạo bài học mới
    </h4>

    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">📘 Thuộc module</label>
        <input type="text" class="form-control" value="{{ module.title }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">📝 Tên bài học</label>
        <input type="text" name="title" class="form-control" placeholder="Nhập tên bài học..." required>
      </div>

      <div class="mb-3">
        <label class="form-label">📄 Mô tả</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Mô tả nội dung bài học..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">🔗 URL Video (nếu có)</label>
        <input type="url" name="video_url" class="form-control" placeholder="https://...">
      </div>

      <div class="mb-3">
        <label class="form-label">📁 Tài liệu đính kèm (nếu có)</label>
        <input type="text" name="document_url" class="form-control" placeholder="https://hoặc đường dẫn tài liệu...">
      </div>

      <div class="mb-3">
        <label class="form-label">🖼️ Ảnh thumbnail (tùy chọn)</label>
        <input type="file" name="thumbnail" class="form-control" accept="image/*">
      </div>

      <div class="d-flex justify-content-between">
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Hủy
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Lưu bài học
        </button>
      </div>
    </form>
  </div>

  <footer>© {{ now.year }} E-Learning Platform | Giáo viên</footer>
</body>
</html>
