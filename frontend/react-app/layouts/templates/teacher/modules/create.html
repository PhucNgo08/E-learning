{% extends "layout_teacher.html" %}
{% block title %}➕ Thêm Module{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold text-primary mb-1">
          ➕ Thêm chương cho khóa học: {{ course.course_name }}
        </h4>
        {% if teacher %}
        <small class="text-muted">
          Giảng viên: {{ teacher.full_name if teacher.full_name else teacher.username }}
        </small>
        {% endif %}
      </div>

      <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <form method="post" action="/teacher/modules/create/{{ course.id }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Số thứ tự chương</label>
        <input type="number" name="module_number" class="form-control" min="1" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Tên chương</label>
        <input type="text" name="title" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mô tả</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mục tiêu học tập</label>
        <textarea name="learning_objectives" class="form-control" rows="3"></textarea>
      </div>

      <div class="text-end">
        <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Lưu chương
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
