<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm Module mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      min-height: 100vh;
      font-family: "Segoe UI", "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }
    .module-card {
      background: #fff;
      border-radius: 15px;
      padding: 35px 40px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      max-width: 720px;
      width: 100%;
    }
    .btn { border-radius: 8px; transition: all 0.2s; }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="module-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold text-primary m-0">➕ Thêm Module mới</h3>
      <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <p class="text-muted mb-4">
      Khóa học: <strong>{{ course.course_name }}</strong>
    </p>

    <form method="post" onsubmit="return confirm('Bạn có chắc muốn tạo module này?')">
      <div class="mb-3">
        <label class="form-label">📑 Số thứ tự Module</label>
        <input type="number" name="module_number" class="form-control" min="1" required>
      </div>
      <div class="mb-3">
        <label class="form-label">📝 Tiêu đề Module</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">🎯 Mục tiêu học tập</label>
        <textarea name="learning_objectives" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">📖 Mô tả</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
        <button class="btn btn-success">
          <i class="bi bi-check-circle"></i> Lưu Module
        </button>
      </div>
    </form>
  </div>
</body>
</html>
