{% extends "layout_teacher.html" %}
{% block title %}🗑️ Xóa Module{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card border-danger shadow-sm">
    <div class="card-header bg-danger text-white fw-bold">
      <i class="bi bi-exclamation-triangle"></i> Xác nhận xóa Module
    </div>
    <div class="card-body">
      <p>Bạn có chắc chắn muốn <strong class="text-danger">xóa module "{{ module.title }}"</strong> khỏi khóa học <strong>{{ course.course_name }}</strong> không?</p>
      <form method="post" action="/teacher/modules/delete/{{ module.id }}">
        <div class="text-end">
          <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Hủy
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Xóa
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
