<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗑️ Xóa Module</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-danger-subtle py-5">
  <div class="container bg-white p-4 rounded shadow-sm text-center" style="max-width: 600px;">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3 mb-2">Bạn có chắc muốn xóa module này?</h4>
    <p class="text-muted">
      <strong>{{ module.title }}</strong> thuộc khóa học
      <em>{{ course.course_name }}</em><br>
      Hành động này sẽ xóa tất cả bài học liên quan.
    </p>

    <form method="post" action="/teacher/modules/delete/{{ module.id }}">
      <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="/teacher/modules/list/{{ module.course_id }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Không xóa, quay lại
        </a>
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash"></i> Xóa module
        </button>
      </div>
    </form>
  </div>
</body>
</html>
