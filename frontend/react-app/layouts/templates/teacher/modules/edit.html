<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ Chỉnh sửa Module</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-warning-subtle py-5">
  <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold text-primary m-0">✏️ Chỉnh sửa Module</h3>
      <a href="/teacher/modules/list/{{ module.course_id }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>
    </div>

    <form method="post" action="/teacher/modules/edit/{{ module.id }}" onsubmit="return confirm('Xác nhận cập nhật module này?')">
      <div class="mb-3">
        <label class="form-label">📑 Số thứ tự</label>
        <input type="number" name="module_number" value="{{ module.module_number }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">📝 Tiêu đề</label>
        <input type="text" name="title" value="{{ module.title }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">🎯 Mục tiêu học tập</label>
        <textarea name="learning_objectives" class="form-control" rows="3">{{ module.learning_objectives }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">📖 Mô tả</label>
        <textarea name="description" class="form-control" rows="3">{{ module.description }}</textarea>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <a href="/teacher/modules/list/{{ module.course_id }}" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>
        <button class="btn btn-primary">
          <i class="bi bi-save"></i> Cập nhật
        </button>
      </div>
    </form>
  </div>
</body>
</html>
