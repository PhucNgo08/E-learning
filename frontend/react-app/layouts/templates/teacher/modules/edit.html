{% extends "layout_teacher.html" %}
{% block title %}✏️ Chỉnh sửa Module{% endblock %}

{% block content %}
<style>
  :root {
    --module-page-bg: #f5f8ff;
    --module-card-bg: #ffffff;
    --module-card-border: #e5e7eb;
    --module-card-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);

    --module-text-main: #1e293b;
    --module-text-muted: #64748b;
    --module-heading: #0d6efd;
    --module-label: #003087;

    --module-input-bg: #ffffff;
    --module-input-text: #1e293b;
    --module-input-border: #cbd5e1;
    --module-input-placeholder: #94a3b8;
  }

  body.dark-mode,
  body.theme-dark,
  html.dark-mode,
  html[data-theme="dark"],
  body[data-theme="dark"],
  [data-bs-theme="dark"] {
    --module-page-bg: #071226;
    --module-card-bg: #0f1b33;
    --module-card-border: rgba(255,255,255,0.1);
    --module-card-shadow: 0 16px 40px rgba(0,0,0,0.42);

    --module-text-main: #e5edf8;
    --module-text-muted: #9caec8;
    --module-heading: #8ea6ff;
    --module-label: #dbeafe;

    --module-input-bg: #101d36;
    --module-input-text: #e5edf8;
    --module-input-border: rgba(255,255,255,0.16);
    --module-input-placeholder: #8ea0bb;
  }

  body.dark-mode .teacher-content,
  body.dark-mode .main-content,
  body.dark-mode .content-wrapper,
  body.dark-mode .page-content,
  body.dark-mode main,
  body.theme-dark .teacher-content,
  body.theme-dark .main-content,
  body.theme-dark .content-wrapper,
  body.theme-dark .page-content,
  body.theme-dark main,
  html[data-theme="dark"] .teacher-content,
  html[data-theme="dark"] .main-content,
  html[data-theme="dark"] .content-wrapper,
  html[data-theme="dark"] .page-content,
  html[data-theme="dark"] main,
  [data-bs-theme="dark"] .teacher-content,
  [data-bs-theme="dark"] .main-content,
  [data-bs-theme="dark"] .content-wrapper,
  [data-bs-theme="dark"] .page-content,
  [data-bs-theme="dark"] main {
    background: #071226 !important;
  }

  .module-page {
    min-height: calc(100vh - 110px);
    padding: 24px 16px 40px;
    background: var(--module-page-bg);
    color: var(--module-text-main);
  }

  .module-wrapper {
    max-width: 920px;
    margin: 0 auto;
  }

  .module-card {
    background: var(--module-card-bg);
    color: var(--module-text-main);
    border: 1px solid var(--module-card-border);
    border-radius: 18px;
    box-shadow: var(--module-card-shadow);
    padding: 28px;
  }

  .module-card h4,
  .module-card .text-primary {
    color: var(--module-heading) !important;
  }

  .module-card .text-muted {
    color: var(--module-text-muted) !important;
  }

  .module-card .form-label {
    color: var(--module-label);
    font-weight: 600;
  }

  .module-card .form-control,
  .module-card textarea {
    background-color: var(--module-input-bg) !important;
    color: var(--module-input-text) !important;
    border-color: var(--module-input-border) !important;
    border-radius: 12px;
    box-shadow: none !important;
  }

  .module-card .form-control:focus,
  .module-card textarea:focus {
    background-color: var(--module-input-bg) !important;
    color: var(--module-input-text) !important;
    border-color: #60a5fa !important;
    box-shadow: 0 0 0 0.22rem rgba(96,165,250,0.18) !important;
  }

  body.dark-mode .module-card .btn-outline-secondary,
  body.theme-dark .module-card .btn-outline-secondary,
  html[data-theme="dark"] .module-card .btn-outline-secondary,
  body[data-theme="dark"] .module-card .btn-outline-secondary,
  [data-bs-theme="dark"] .module-card .btn-outline-secondary {
    color: #dbeafe;
    border-color: rgba(255,255,255,0.25);
  }

  body.dark-mode .module-card .btn-outline-secondary:hover,
  body.theme-dark .module-card .btn-outline-secondary:hover,
  html[data-theme="dark"] .module-card .btn-outline-secondary:hover,
  body[data-theme="dark"] .module-card .btn-outline-secondary:hover,
  [data-bs-theme="dark"] .module-card .btn-outline-secondary:hover {
    background: rgba(255,255,255,0.1);
    color: #ffffff;
  }

  @media (max-width: 768px) {
    .module-page {
      padding: 16px 8px 32px;
    }

    .module-card {
      padding: 20px;
    }

    .module-card .text-end {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-card .text-end .btn {
      width: 100%;
    }
  }
</style>

<div class="module-page">
  <div class="module-wrapper">
    <div class="module-card">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="fw-bold text-primary mb-1">
            ✏️ Chỉnh sửa chương: {{ module.title }}
          </h4>
          {% if teacher %}
          <small class="text-muted">
            Giảng viên: {{ teacher.full_name if teacher.full_name else teacher.username }}
          </small>
          {% endif %}
        </div>

        <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>

      <form method="post" action="/teacher/modules/edit/{{ module.id }}">
        <div class="mb-3">
          <label class="form-label">Số thứ tự chương</label>
          <input
            type="number"
            name="module_number"
            class="form-control"
            min="1"
            value="{{ module.module_number }}"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Tên chương</label>
          <input
            type="text"
            name="title"
            class="form-control"
            value="{{ module.title }}"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea name="description" class="form-control" rows="3">{{ module.description or '' }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Mục tiêu học tập</label>
          <textarea name="learning_objectives" class="form-control" rows="3">{{ module.learning_objectives or '' }}</textarea>
        </div>

        <div class="text-end">
          <a href="/teacher/modules/list/{{ course.id }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Quay lại
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Cập nhật
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
