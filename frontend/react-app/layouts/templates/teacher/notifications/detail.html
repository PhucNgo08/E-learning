{% extends "layout_teacher.html" %}
{% block title %}📩 {{ notification.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="bi bi-bell"></i> {{ notification.title }}</h5>
    </div>
    <div class="card-body">
      <p class="text-muted small">{{ notification.created_at.strftime('%H:%M - %d/%m/%Y') }}</p>
      <p>{{ notification.message }}</p>
    </div>
  </div>

  <a href="/teacher/notifications" class="btn btn-outline-secondary mt-3">
    <i class="bi bi-arrow-left-circle"></i> Quay lại danh sách
  </a>
</div>
{% endblock %}
