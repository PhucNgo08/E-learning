<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa hồ sơ giáo viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; font-family: "Inter", "Segoe UI", sans-serif; }
    .container { max-width: 700px; margin-top: 60px; }
  </style>
</head>
<body>
<div class="container">
  <div class="bg-white rounded shadow-sm p-4">
    <h3 class="mb-4 text-center">✏️ Chỉnh sửa hồ sơ giáo viên</h3>

    <form method="post" action="/teacher/profile/edit">
      <div class="mb-3">
        <label class="form-label">👤 Tên đăng nhập</label>
        <input type="text" class="form-control" value="{{ teacher.username }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">🧑‍🏫 Họ và tên</label>
        <input type="text" name="full_name" class="form-control" value="{{ teacher.full_name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">📧 Email</label>
        <input type="email" name="email" class="form-control" value="{{ teacher.email }}" required>
      </div>

      <div class="mt-4 d-flex justify-content-between">
        <a href="/teacher/profile" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
