<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>✏️ Chỉnh sửa hồ sơ giáo viên</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(180deg, #f6f9ff 0%, #eef3ff 100%);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .edit-container {
      max-width: 700px;
      margin: 80px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .edit-header {
      background: linear-gradient(90deg, #0056d2, #007bff);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    .edit-body {
      padding: 40px 50px;
    }

    .form-label {
      font-weight: 600;
      color: #003087;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #007bff;
      object-fit: cover;
      display: block;
      margin: 15px auto;
    }

    .btn-save {
      background: linear-gradient(90deg, #007bff, #0056d2);
      color: white;
      font-weight: 500;
      border-radius: 10px;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      .edit-body { padding: 25px; }
    }
  </style>
</head>

<body>
  <div class="edit-container">
    <div class="edit-header">
      <h3>✏️ Chỉnh sửa hồ sơ</h3>
      <p>Cập nhật thông tin cá nhân của bạn bên dưới</p>
    </div>

    <div class="edit-body">
      <form action="/teacher/profile/edit" method="post" enctype="multipart/form-data">
        <div class="mb-3 text-center">
          {% if teacher.avatar_url %}
            <img src="{{ teacher.avatar_url }}" alt="Avatar" class="avatar-preview">
          {% else %}
            <img src="/uploads/avatars/default-avatar.png" alt="Avatar" class="avatar-preview">
          {% endif %}
        </div>

        <div class="mb-3">
          <label class="form-label">📷 Ảnh đại diện (tùy chọn)</label>
          <input type="file" name="avatar" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
          <label class="form-label">👤 Họ và tên</label>
          <input type="text" name="full_name" class="form-control" value="{{ teacher.full_name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">📧 Email</label>
          <input type="email" name="email" class="form-control" value="{{ teacher.email }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">📞 Số điện thoại</label>
          <input type="text" name="phone" class="form-control" value="{{ teacher.phone or '' }}">
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-save px-4">
            <i class="bi bi-save"></i> Lưu thay đổi
          </button>
          <a href="/teacher/profile" class="btn btn-outline-secondary ms-2">
            <i class="bi bi-arrow-left"></i> Quay lại
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Preview ảnh khi chọn -->
  <script>
    const fileInput = document.querySelector('input[name="avatar"]');
    const previewImg = document.querySelector('.avatar-preview');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImg.src = URL.createObjectURL(file);
      }
    });
  </script>
</body>
</html>
