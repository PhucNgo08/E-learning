<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🔑 Đổi mật khẩu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
  <h3 class="text-center mb-4 text-primary">🔑 Đổi mật khẩu</h3>

  <form method="post" action="/teacher/profile/change-password">
    <div class="mb-3">
      <label class="form-label">Mật khẩu hiện tại</label>
      <input type="password" class="form-control" name="current_password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Mật khẩu mới</label>
      <input type="password" class="form-control" name="new_password" required minlength="6">
    </div>
    <div class="mb-3">
      <label class="form-label">Xác nhận mật khẩu mới</label>
      <input type="password" class="form-control" name="confirm_password" required minlength="6">
    </div>

    <div class="d-flex justify-content-between">
      <a href="/teacher/profile" class="btn btn-outline-secondary">⬅ Quay lại</a>
      <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
    </div>
  </form>
</div>
</body>
</html>
