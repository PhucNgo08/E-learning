<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xác nhận xóa danh mục</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #fef2f2;
      font-family: "Inter", sans-serif;
    }
    .confirm-box {
      max-width: 600px;
      margin: 80px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 2rem;
      text-align: center;
    }
    h2 {
      color: #dc3545;
      font-weight: 700;
    }
    .alert-icon {
      font-size: 3rem;
      color: #dc3545;
      margin-bottom: 1rem;
    }
    .btn-danger {
      background: linear-gradient(45deg, #dc3545, #b02a37);
      border: none;
      transition: all 0.2s ease;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
    }
  </style>
</head>
<body>
  <div class="confirm-box">
    <div class="alert-icon">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h2>Xác nhận xóa danh mục</h2>
    <p class="text-muted mt-3 mb-4">
      Bạn có chắc chắn muốn xóa danh mục <strong class="text-dark">"{{ category.category_name }}"</strong> không?<br>
      Hành động này không thể hoàn tác.
    </p>

    <form method="post" action="/admin/CourseCategory/delete/{{ category.id }}">
      <div class="d-flex justify-content-center gap-3">
        <a href="/admin/CourseCategory/manage" class="btn btn-secondary px-4">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash"></i> Xóa
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
