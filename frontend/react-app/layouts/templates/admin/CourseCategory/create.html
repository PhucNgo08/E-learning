<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thêm danh mục khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f6f8fc;
      font-family: "Inter", sans-serif;
    }
    .form-wrapper {
      max-width: 600px;
      margin: 60px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 2rem;
    }
    h2 {
      font-weight: 700;
      color: #0d47a1;
    }
    .btn-success {
      background: linear-gradient(45deg, #198754, #28a745);
      border: none;
      transition: all 0.2s ease;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(25, 135, 84, 0.3);
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <h2 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Thêm danh mục mới</h2>
    <p class="text-muted mb-4">Điền thông tin bên dưới để tạo danh mục khóa học mới.</p>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/CourseCategory/create">
      <div class="mb-3">
        <label class="form-label">Tên danh mục</label>
        <input
          type="text"
          name="category_name"
          class="form-control"
          placeholder="VD: Lập trình, Thiết kế..."
          value="{{ form_data.category_name if form_data else '' }}"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea
          name="description"
          class="form-control"
          rows="3"
          placeholder="Nhập mô tả ngắn gọn..."
        >{{ form_data.description if form_data else '' }}</textarea>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/CourseCategory/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save"></i> Lưu danh mục
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
