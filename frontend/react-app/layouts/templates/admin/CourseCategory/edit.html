<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>➕ Thêm danh mục khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f5f9ff, #e9f0ff);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .form-wrapper {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2.2rem;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: 700;
      color: #0d47a1;
    }

    .lead-text {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      color: #333;
    }

    .form-control {
      border-radius: 8px;
      padding: 10px 14px;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    .btn-success {
      background: linear-gradient(45deg, #198754, #28a745);
      border: none;
      transition: all 0.25s ease;
      border-radius: 8px;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
    }

    .btn-secondary {
      border-radius: 8px;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(108, 117, 125, 0.25);
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      margin-top: 2rem;
    }

    .icon-header {
      background: #e9f2ff;
      display: inline-block;
      padding: 15px;
      border-radius: 50%;
      color: #0d47a1;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <div class="text-center mb-4">
      <div class="icon-header"><i class="bi bi-tags-fill"></i></div>
      <h2>Thêm danh mục mới</h2>
      <p class="lead-text">Điền thông tin bên dưới để tạo danh mục khóa học trong hệ thống.</p>
    </div>

    <form method="post" action="/admin/CourseCategory/add">
      <div class="mb-3">
        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
        <input type="text" name="category_name" class="form-control" placeholder="VD: Lập trình, Thiết kế, Tin học..." required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Nhập mô tả ngắn gọn về danh mục..."></textarea>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/CourseCategory/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save2 me-1"></i> Lưu danh mục
        </button>
      </div>
    </form>
  </div>

  <footer>© 2025 E-Learning Admin Dashboard</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
