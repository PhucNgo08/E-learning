<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Sửa danh mục khóa học</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f5f9ff, #e9f0ff);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .form-wrapper {
      width: 100%;
      max-width: 650px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2.2rem;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      font-weight: 800;
      color: #0d47a1;
      margin-bottom: 0.25rem;
    }
    .lead-text {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .form-label {
      font-weight: 600;
      color: #333;
    }
    .form-control {
      border-radius: 10px;
      padding: 10px 14px;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }
    .btn-primary {
      background: linear-gradient(45deg, #0d6efd, #2563eb);
      border: none;
      transition: all 0.25s ease;
      border-radius: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
    .btn-secondary {
      border-radius: 10px;
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(108, 117, 125, 0.25);
    }
    .icon-header {
      background: #e9f2ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: #0d47a1;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .meta-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f5ff;
      color: #1e40af;
      font-size: 0.85rem;
      font-weight: 600;
    }
    footer {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      margin-top: 1.75rem;
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <div class="text-center mb-4">
      <div class="icon-header"><i class="bi bi-pencil-square"></i></div>
      <h2>Sửa danh mục</h2>
      <div class="lead-text">
        Cập nhật thông tin danh mục khóa học trong hệ thống.
      </div>

      <div class="meta-badge">
        ID: {{ category.id }}
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/CourseCategory/edit/{{ category.id }}">
      <div class="mb-3">
        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
        <input
          type="text"
          name="category_name"
          class="form-control"
          required
          placeholder="VD: Lập trình, Thiết kế, Tin học..."
          value="{{ category.category_name or '' }}"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea
          name="description"
          class="form-control"
          rows="4"
          placeholder="Nhập mô tả ngắn gọn về danh mục..."
        >{{ category.description or '' }}</textarea>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/CourseCategory/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check2-circle me-1"></i> Cập nhật
        </button>
      </div>
    </form>

    <footer>© {{ current_year }} E-Learning Admin Dashboard</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
