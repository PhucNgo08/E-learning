<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗑️ Xóa học phần</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f3f8ff, #e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      padding: 2rem 2.5rem;
      max-width: 600px;
      text-align: center;
    }
    h2 { color: #dc3545; font-weight: 700; }
  </style>
</head>
<body>
  <div class="confirm-card">
    <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
    <h2>Xác nhận xóa học phần</h2>

    <p>
      Bạn có chắc chắn muốn xóa học phần
      <strong>{{ section.section_name }}</strong><br>
      (Mã: <strong>{{ section.section_code }}</strong>)?
    </p>

    <div class="alert alert-warning">
      Nếu học phần đang có dữ liệu liên kết, hệ thống có thể từ chối xóa.
    </div>

    <form action="/admin/sections/delete/{{ section.id }}" method="post" class="d-flex justify-content-center gap-3">
      <a href="/admin/sections/manage" class="btn btn-secondary px-4">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
      </a>
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash3-fill me-1"></i> Xóa học phần
      </button>
    </form>
  </div>
</body>
</html>
