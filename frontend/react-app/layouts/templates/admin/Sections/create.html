<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>➕ Thêm học phần</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #f3f8ff, #e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrapper {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: 700;
      color: #0d47a1;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    .btn-success {
      background: linear-gradient(45deg, #198754, #28a745);
      border: none;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25,135,84,0.35);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(108,117,125,0.25);
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <div class="text-center mb-4">
      <i class="bi bi-diagram-3 text-primary fs-1 mb-2"></i>
      <h2>Thêm học phần mới</h2>
      <p class="text-muted mb-0">Điền thông tin bên dưới để tạo học phần.</p>
    </div>

    <form action="/admin/sections/create" method="post">
      <div class="row g-3">
        <!-- Mã học phần -->
        <div class="col-md-6">
          <label class="form-label">Mã học phần <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="section_code" placeholder="VD: SECT101" required />
        </div>

        <!-- Tên học phần -->
        <div class="col-md-6">
          <label class="form-label">Tên học phần <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="section_name" placeholder="VD: Lập trình C cơ bản" required />
        </div>

        <!-- Khóa học -->
        <div class="col-md-12">
          <label class="form-label">Khóa học <span class="text-danger">*</span></label>
          <select class="form-select" name="course_id" required>
            <option value="">-- Chọn khóa học --</option>
            {% for c in courses %}
              <option value="{{ c.id }}">{{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Số lượng tối đa -->
        <div class="col-md-6">
          <label class="form-label">Số lượng tối đa</label>
          <input type="number" class="form-control" name="max_students" value="50" min="1" />
        </div>

        <!-- Phòng học -->
        <div class="col-md-6">
          <label class="form-label">Địa điểm / Phòng học</label>
          <input type="text" class="form-control" name="location" placeholder="VD: Phòng A101" />
        </div>

        <!-- Lịch học -->
        <div class="col-12">
          <label class="form-label">Lịch học</label>
          <textarea class="form-control" name="schedule_info" rows="2" placeholder="VD: Thứ 2, 4 - Tiết 1-3"></textarea>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-5">
         <a href="/admin/sections/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save2 me-1"></i> Lưu học phần
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
