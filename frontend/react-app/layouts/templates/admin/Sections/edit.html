<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✏️ Chỉnh sửa học phần</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg,#f3f8ff,#e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrapper {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      max-width: 720px;
      width: 100%;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: 700;
      color: #0d47a1;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    .btn-primary {
      background: linear-gradient(45deg, #0d6efd, #007bff);
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13,110,253,0.35);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(108,117,125,0.25);
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <div class="text-center mb-4">
      <i class="bi bi-pencil-square text-primary fs-1 mb-2"></i>
      <h2>Chỉnh sửa học phần</h2>
      <p class="text-muted mb-0">Cập nhật thông tin chi tiết cho học phần.</p>
    </div>

    <form action="/admin/sections/edit/{{ section.id }}" method="post">
      <div class="row g-3">
        <!-- Mã học phần -->
        <div class="col-md-6">
          <label class="form-label">Mã học phần</label>
          <input type="text" class="form-control" name="section_code"
                 value="{{ section.section_code }}" required />
        </div>

        <!-- Tên học phần -->
        <div class="col-md-6">
          <label class="form-label">Tên học phần</label>
          <input type="text" class="form-control" name="section_name"
                 value="{{ section.section_name }}" required />
        </div>

        <!-- Khóa học -->
        <div class="col-md-12">
          <label class="form-label">Khóa học</label>
          <select class="form-select" name="course_id" required>
            {% for c in courses %}
              <option value="{{ c.id }}" {% if section.course_id == c.id %}selected{% endif %}>
                {{ c.course_name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- Số lượng tối đa -->
        <div class="col-md-6">
          <label class="form-label">Số lượng tối đa</label>
          <input type="number" class="form-control" name="max_students"
                 value="{{ section.max_students or 50 }}" min="1" />
        </div>

        <!-- Phòng học -->
        <div class="col-md-6">
          <label class="form-label">Địa điểm / Phòng học</label>
          <input type="text" class="form-control" name="location"
                 value="{{ section.location or '' }}" />
        </div>

        <!-- Lịch học -->
        <div class="col-12">
          <label class="form-label">Lịch học</label>
          <textarea class="form-control" name="schedule_info" rows="2">{{ section.schedule_info or '' }}</textarea>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-5">
        <a href="/admin/sections/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-save2 me-1"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
