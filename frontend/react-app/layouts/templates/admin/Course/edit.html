<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa Khóa Học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f3f8ff, #e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrapper {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: 700;
      color: #0d47a1;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }

    .btn-primary {
      background: linear-gradient(45deg, #0d6efd, #007bff);
      border: none;
      transition: all 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13,110,253,0.35);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(108,117,125,0.25);
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #999;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <!-- 🔹 Header -->
    <div class="text-center mb-4">
      <i class="bi bi-pencil-square text-primary fs-1 mb-2"></i>
      <h2>Chỉnh sửa khóa học</h2>
      <p class="text-muted mb-0">Cập nhật thông tin chi tiết cho khóa học hiện có.</p>
    </div>

    <!-- 🔹 Form -->
    <form method="post" action="/admin/Course/edit/{{ course.id }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Mã khóa học</label>
          <input type="text" class="form-control" name="course_code" value="{{ course.course_code }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tên khóa học</label>
          <input type="text" class="form-control" name="course_name" value="{{ course.course_name }}" required>
        </div>

        <div class="col-12">
          <label class="form-label">Mô tả khóa học</label>
          <textarea class="form-control" name="description" rows="3">{{ course.description }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label">Số tín chỉ</label>
          <input type="number" class="form-control" name="credit_hours" min="1" value="{{ course.credit_hours }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Giảng viên</label>
          <select class="form-select" name="teacher_id">
            <option value="">-- Chọn giảng viên --</option>
            {% for t in teachers %}
              <option value="{{ t.id }}" {% if course.teacher_id == t.id %}selected{% endif %}>{{ t.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Năm học</label>
          <select class="form-select" name="academic_year_id">
            <option value="">-- Chọn năm học --</option>
            {% for y in years %}
              <option value="{{ y.id }}" {% if course.academic_year_id == y.id %}selected{% endif %}>{{ y.year_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Ngành học</label>
          <select class="form-select" name="major_id">
            <option value="">-- Chọn ngành học --</option>
            {% for m in majors %}
              <option value="{{ m.id }}" {% if course.major_id == m.id %}selected{% endif %}>{{ m.major_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Ngày bắt đầu</label>
          <input type="date" class="form-control" name="start_date" 
                 value="{{ course.start_date.strftime('%Y-%m-%d') if course.start_date }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Ngày kết thúc</label>
          <input type="date" class="form-control" name="end_date" 
                 value="{{ course.end_date.strftime('%Y-%m-%d') if course.end_date }}">
        </div>

        <div class="col-md-12">
          <label class="form-label">Trạng thái</label>
          <select class="form-select" name="status">
            <option value="draft" {% if course.status == 'draft' %}selected{% endif %}>Bản nháp</option>
            <option value="published" {% if course.status == 'published' %}selected{% endif %}>Công khai</option>
            <option value="archived" {% if course.status == 'archived' %}selected{% endif %}>Lưu trữ</option>
          </select>
        </div>
      </div>

      <!-- 🔹 Nút hành động -->
      <div class="d-flex justify-content-between align-items-center mt-5">
        <a href="/admin/Course/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-save2 me-1"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>

  <footer>© 2025 E-Learning Admin Panel</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
