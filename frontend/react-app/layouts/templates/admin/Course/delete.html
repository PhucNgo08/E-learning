<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗑️ Xóa Khóa Học</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f3f8ff, #e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      padding: 2rem 2.5rem;
      max-width: 600px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #dc3545;
      font-weight: 700;
    }

    p {
      color: #444;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .btn-danger {
      background: linear-gradient(45deg, #dc3545, #c82333);
      border: none;
      color: white;
      transition: all 0.3s ease;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(108, 117, 125, 0.3);
    }
  </style>
</head>

<body>
  <div class="confirm-card">
    <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
    <h2>Xác nhận xóa khóa học</h2>
    <p>Bạn có chắc chắn muốn xóa khóa học <strong>{{ course.course_name }}</strong> không?</p>

    <form action="/admin/Course/delete/{{ course.id }}" method="get" class="d-flex justify-content-center gap-3">
      <a href="/admin/Course/manage" class="btn btn-secondary px-4">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
      </a>
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash3-fill me-1"></i> Xóa
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
