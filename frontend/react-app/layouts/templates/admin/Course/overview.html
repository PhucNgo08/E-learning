<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📈 Tổng Quan Khóa Học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7ff;
      font-family: "Inter", "Segoe UI", sans-serif;
      padding: 40px 20px;
    }

    .overview-card {
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      padding: 25px 30px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2, h3 {
      font-weight: 700;
      color: #0d47a1;
    }

    .stat-box {
      padding: 15px 20px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .stat-icon {
      font-size: 2rem;
      opacity: 0.9;
    }

    .bg-lesson { background: linear-gradient(45deg, #28a745, #4caf50); }
    .bg-quiz { background: linear-gradient(45deg, #ffc107, #ffb300); }
    .bg-assign { background: linear-gradient(45deg, #17a2b8, #138496); }
    .bg-student { background: linear-gradient(45deg, #6610f2, #6f42c1); }
    .bg-rating { background: linear-gradient(45deg, #ff5722, #e64a19); }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13,110,253,0.35);
    }

  </style>
</head>

<body>

  <div class="overview-card mx-auto" style="max-width: 700px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <i class="bi bi-graph-up-arrow text-primary fs-1 mb-2"></i>
      <h2>Tổng quan khóa học</h2>
      <h3 class="text-success mt-2">📘 {{ course.course_name }}</h3>
    </div>

    <!-- Stats -->
    <div class="stat-box bg-lesson">
      <i class="bi bi-journal-bookmark stat-icon"></i>
      <div>
        <div class="fw-bold fs-5">{{ total_lessons }}</div>
        <div class="small">Tổng số bài học</div>
      </div>
    </div>

    <div class="stat-box bg-quiz">
      <i class="bi bi-ui-checks-grid stat-icon"></i>
      <div>
        <div class="fw-bold fs-5">{{ total_quizzes }}</div>
        <div class="small">Tổng số bài kiểm tra</div>
      </div>
    </div>

    <div class="stat-box bg-assign">
      <i class="bi bi-clipboard2-check stat-icon"></i>
      <div>
        <div class="fw-bold fs-5">{{ total_assignments }}</div>
        <div class="small">Tổng số bài tập</div>
      </div>
    </div>

    <div class="stat-box bg-student">
      <i class="bi bi-people-fill stat-icon"></i>
      <div>
        <div class="fw-bold fs-5">{{ total_students }}</div>
        <div class="small">Tổng học viên đã tham gia</div>
      </div>
    </div>

    <div class="stat-box bg-rating">
      <i class="bi bi-star-fill stat-icon"></i>
      <div>
        <div class="fw-bold fs-5">{{ avg_rating }}/5</div>
        <div class="small">Điểm đánh giá trung bình</div>
      </div>
    </div>

    <!-- Back button -->
    <div class="text-center mt-4">
      <a href="/admin/Course/manage" class="btn btn-primary px-4 back-btn">
        <i class="bi bi-arrow-left-circle me-1"></i> Quay lại quản lý khóa học
      </a>
    </div>

  </div>

</body>
</html>
