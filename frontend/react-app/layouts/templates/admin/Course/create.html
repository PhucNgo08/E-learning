<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm Khóa Học</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f3f8ff, #e9f2ff);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrapper {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      padding: 2.5rem;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: 700;
      color: #0d47a1;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }

    .btn-success {
      background: linear-gradient(45deg, #198754, #28a745);
      border: none;
      transition: all 0.25s ease;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25,135,84,0.35);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(108,117,125,0.25);
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #999;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="form-wrapper">
    <!-- 🔹 Header -->
    <div class="text-center mb-4">
      <i class="bi bi-mortarboard text-primary fs-1 mb-2"></i>
      <h2>Thêm Khóa Học Mới</h2>
      <p class="text-muted mb-0">Điền thông tin bên dưới để tạo khóa học trong hệ thống.</p>
    </div>

    <!-- 🔹 Form -->
    <form action="/admin/Course/create" method="post" enctype="multipart/form-data">

      <div class="row g-3">
        <div class="col-md-6">
          <label for="course_code" class="form-label">Mã Khóa Học <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="course_code" name="course_code" placeholder="VD: CS101" required>
        </div>

        <div class="col-md-6">
          <label for="course_name" class="form-label">Tên Khóa Học <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="course_name" name="course_name" placeholder="VD: Lập trình Python cơ bản" required>
        </div>

        <div class="col-12">
          <label for="description" class="form-label">Mô Tả</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Giới thiệu ngắn gọn về khóa học..."></textarea>
        </div>

        <div class="col-md-6">
          <label for="credit_hours" class="form-label">Số Tín Chỉ <span class="text-danger">*</span></label>
          <input type="number" class="form-control" id="credit_hours" name="credit_hours" min="1" value="3" required>
        </div>

        <div class="col-md-6">
          <label for="teacher_id" class="form-label">Giảng Viên Phụ Trách</label>
          <select class="form-select" id="teacher_id" name="teacher_id">
            <option value="">-- Chọn giảng viên --</option>
            {% for t in teachers %}
              <option value="{{ t.id }}">{{ t.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="academic_year_id" class="form-label">Năm Học</label>
          <select class="form-select" id="academic_year_id" name="academic_year_id">
            <option value="">-- Chọn năm học --</option>
            {% for y in years %}
              <option value="{{ y.id }}">{{ y.year_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="major_id" class="form-label">Ngành Học</label>
          <select class="form-select" id="major_id" name="major_id">
            <option value="">-- Chọn ngành học --</option>
            {% for m in majors %}
              <option value="{{ m.id }}">{{ m.major_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="start_date" class="form-label">Ngày Bắt Đầu</label>
          <input type="date" class="form-control" id="start_date" name="start_date">
        </div>

        <div class="col-md-6">
          <label for="end_date" class="form-label">Ngày Kết Thúc</label>
          <input type="date" class="form-control" id="end_date" name="end_date">
        </div>
      </div>

      <!-- 🔹 Nút hành động -->
      <div class="d-flex justify-content-between align-items-center mt-5">
        <a href="/admin/Course/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save2 me-1"></i> Lưu Khóa Học
        </button>
      </div>
    </form>
  </div>

  <footer>© 2025 E-Learning Admin Panel</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
