<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>➕ Tạo bài tập mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3 class="text-primary fw-bold mb-4">➕ Tạo bài tập mới</h3>
    <form method="post" action="/admin/assignment/create">
      <div class="mb-3">
        <label class="form-label">Tiêu đề</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Mã khóa học</label>
        <input type="text" name="course_id" class="form-control" placeholder="Nhập ID khóa học" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Hạn nộp (YYYY-MM-DD)</label>
        <input type="date" name="due_date" class="form-control">
      </div>
      <button type="submit" class="btn btn-success">✅ Tạo bài tập</button>
      <a href="/admin/assignment/list" class="btn btn-secondary">⬅️ Quay lại</a>
    </form>
  </div>
</body>
</html>
