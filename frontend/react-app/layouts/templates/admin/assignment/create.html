<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>➕ Tạo bài tập mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; }
    .card { border-radius: 12px; }
  </style>
</head>

<body class="p-4">

<div class="container">
  <div class="card shadow-sm p-4">
    <h3 class="text-primary fw-bold mb-4">
      ➕ Tạo bài tập mới
    </h3>

    <form method="post" action="/admin/assignment/create">

      <!-- Tiêu đề -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📘 Tiêu đề</label>
        <input type="text" name="title" class="form-control" required>
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📝 Mô tả</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <!-- Chọn khóa học -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📚 Khóa học</label>
        <select name="course_id" id="courseSelect" class="form-select" required>
          <option value="">-- Chọn khóa học --</option>
          {% for c in courses %}
            <option value="{{ c.id }}">{{ c.course_name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Chọn module -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📂 Module</label>
        <select name="module_id" id="moduleSelect" class="form-select">
          <option value="">-- Không chọn module --</option>
          {% for m in modules %}
            <option value="{{ m.id }}" data-course="{{ m.course_id }}">
              {{ m.title }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Chọn giáo viên -->
      <div class="mb-3">
        <label class="form-label fw-semibold">👨‍🏫 Giảng viên phụ trách</label>
        <select name="teacher_id" class="form-select">
          <option value="">-- Không gán giảng viên --</option>

          {% for t in teachers %}
            <option value="{{ t.id }}">{{ t.full_name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Hạn nộp -->
      <div class="mb-3">
        <label class="form-label fw-semibold">⏳ Hạn nộp</label>
        <input type="datetime-local" name="due_date" class="form-control">
      </div>

      <!-- Nút -->
      <div class="mt-3">
        <button type="submit" class="btn btn-success px-4">✅ Tạo bài tập</button>
        <a href="/admin/assignment/list" class="btn btn-secondary px-4">⬅️ Quay lại</a>
      </div>

    </form>
  </div>
</div>

<!-- Script lọc module theo khóa học -->
<script>
  const courseSelect = document.getElementById("courseSelect");
  const moduleSelect = document.getElementById("moduleSelect");

  function filterModules() {
    const selectedCourse = courseSelect.value;

    for (let opt of moduleSelect.options) {
      if (!opt.dataset.course || selectedCourse === "") {
        opt.hidden = false;
        continue;
      }

      opt.hidden = (opt.dataset.course !== selectedCourse);
    }

    moduleSelect.value = "";
  }

  courseSelect.addEventListener("change", filterModules);
  window.onload = filterModules;
</script>

</body>
</html>
