{% extends "layout_admin.html" %}
{% block title %}➕ Tạo bài tập mới{% endblock %}

{% block content %}
<style>
  body { background: #f5f7fa; }
  .card { border-radius: 12px; border: none; }
</style>

<div class="container py-4">
  <div class="card shadow-sm p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h3 class="text-primary fw-bold mb-0">➕ Tạo bài tập mới</h3>
      <a href="/admin/assignment/list" class="btn btn-secondary">⬅ Quay lại</a>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/assignment/create">
      <div class="mb-3">
        <label class="form-label fw-semibold">📘 Tiêu đề</label>
        <input type="text" name="title" class="form-control"
               value="{{ form_data.title if form_data else '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📝 Mô tả</label>
        <textarea name="description" class="form-control" rows="4">{{ form_data.description if form_data else '' }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📚 Khóa học</label>
        <select name="course_id" id="courseSelect" class="form-select" required>
          <option value="">-- Chọn khóa học --</option>
          {% for c in courses %}
            <option value="{{ c.id }}"
              {% if form_data and form_data.course_id == c.id %}selected{% endif %}>
              {{ c.course_name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📂 Module</label>
        <select name="module_id" id="moduleSelect" class="form-select">
          <option value="">-- Không chọn module --</option>
          {% for m in modules %}
            <option value="{{ m.id }}" data-course="{{ m.course_id }}"
              {% if form_data and form_data.module_id == m.id %}selected{% endif %}>
              {{ m.title }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">👨‍🏫 Giảng viên phụ trách</label>
        <select name="teacher_id" class="form-select">
          <option value="">-- Không gán giảng viên --</option>
          {% for t in teachers %}
            <option value="{{ t.id }}"
              {% if form_data and form_data.teacher_id == t.id %}selected{% endif %}>
              {{ t.full_name if t.full_name else (t.user_profile.full_name if t.user_profile else t.username) }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">⏳ Hạn nộp</label>
        <input type="datetime-local" name="due_date" class="form-control"
               value="{{ form_data.due_date if form_data else '' }}">
      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success px-4">✅ Tạo bài tập</button>
        <a href="/admin/assignment/list" class="btn btn-outline-secondary px-4">Hủy</a>
      </div>
    </form>
  </div>
</div>

<script>
  const courseSelect = document.getElementById("courseSelect");
  const moduleSelect = document.getElementById("moduleSelect");

  function filterModules() {
    const selectedCourse = courseSelect.value;

    for (const opt of moduleSelect.options) {
      if (!opt.dataset.course) {
        opt.hidden = false;
        continue;
      }
      opt.hidden = selectedCourse && opt.dataset.course !== selectedCourse;
    }

    const current = moduleSelect.options[moduleSelect.selectedIndex];
    if (current && current.hidden) {
      moduleSelect.value = "";
    }
  }

  courseSelect.addEventListener("change", filterModules);
  window.addEventListener("load", filterModules);
</script>
{% endblock %}
