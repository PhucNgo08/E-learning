<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📊 Thống kê bài tập theo khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; }
    .stat-card {
      border-radius: 12px;
      padding: 20px;
      background: white;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .stat-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body class="p-4">
<div class="container">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary fw-bold">📊 Thống kê bài tập theo khóa học</h3>
    <a href="/admin/assignment/list" class="btn btn-secondary px-4">
      ⬅️ Quay lại
    </a>
  </div>

  <!-- Statistics -->
  <div class="row g-4">

    <!-- Tổng bài tập -->
    <div class="col-md-3">
      <div class="stat-card shadow-sm text-center">
        <div class="stat-icon text-primary">
          <i class="bi bi-file-earmark-text"></i>
        </div>
        <h6 class="text-muted">Tổng bài tập</h6>
        <h3 class="fw-bold text-primary">{{ stats.total_assignments }}</h3>
      </div>
    </div>

    <!-- Đã nộp -->
    <div class="col-md-3">
      <div class="stat-card shadow-sm text-center">
        <div class="stat-icon text-success">
          <i class="bi bi-send-check"></i>
        </div>
        <h6 class="text-muted">Đã nộp</h6>
        <h3 class="fw-bold text-success">{{ stats.submitted }}</h3>
      </div>
    </div>

    <!-- Đã chấm -->
    <div class="col-md-3">
      <div class="stat-card shadow-sm text-center">
        <div class="stat-icon text-info">
          <i class="bi bi-check2-circle"></i>
        </div>
        <h6 class="text-muted">Đã chấm</h6>
        <h3 class="fw-bold text-info">{{ stats.graded }}</h3>
      </div>
    </div>

    <!-- Nộp trễ -->
    <div class="col-md-3">
      <div class="stat-card shadow-sm text-center">
        <div class="stat-icon text-danger">
          <i class="bi bi-clock-history"></i>
        </div>
        <h6 class="text-muted">Nộp trễ</h6>
        <h3 class="fw-bold text-danger">{{ stats.late }}</h3>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="text-center text-muted mt-4 small">
    © {{ current_year if current_year else "" }} E-Learning Analytics
  </div>

</div>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
