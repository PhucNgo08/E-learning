<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📊 Thống kê bài tập theo khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3 class="text-primary fw-bold mb-4">📊 Thống kê bài tập theo khóa học</h3>
    <table class="table table-bordered table-striped shadow-sm">
      <thead class="table-info">
        <tr class="text-center">
          <th>Tổng bài tập</th>
          <th>Đã nộp</th>
          <th>Đã chấm</th>
          <th>Nộp trễ</th>
        </tr>
      </thead>
      <tbody class="text-center">
        <tr>
          <td>{{ stats.total_assignments }}</td>
          <td>{{ stats.submitted }}</td>
          <td>{{ stats.graded }}</td>
          <td>{{ stats.late }}</td>
        </tr>
      </tbody>
    </table>
    <a href="/admin/assignment/list" class="btn btn-secondary">⬅️ Quay lại</a>
  </div>
</body>
</html>
