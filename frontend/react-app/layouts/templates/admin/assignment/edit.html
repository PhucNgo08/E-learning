<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; }
    .card { border-radius: 12px; }
  </style>
</head>

<body class="p-4">

<div class="container">
  <div class="card shadow-sm p-4">

    <h3 class="text-primary fw-bold mb-4">
      ✏️ Chỉnh sửa bài tập
    </h3>

    <!-- Tiêu đề gốc -->
    <div class="alert alert-info">
      <b>Bài tập:</b> {{ assignment.title }}
      <br>
      <small class="text-muted">ID: {{ assignment.id }}</small>
    </div>

    <form method="post" action="/admin/assignment/edit/{{ assignment.id }}">

      <!-- Tiêu đề -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📘 Tiêu đề</label>
        <input 
          type="text" 
          name="title" 
          class="form-control" 
          value="{{ assignment.title }}" 
          required
        >
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📝 Mô tả</label>
        <textarea 
          name="description" 
          class="form-control" 
          rows="4"
        >{{ assignment.description }}</textarea>
      </div>

      <!-- Nút -->
      <div class="mt-3">
        <button type="submit" class="btn btn-warning px-4">
          💾 Lưu thay đổi
        </button>
        <a href="/admin/assignment/list" class="btn btn-secondary px-4">
          ⬅️ Quay lại
        </a>
      </div>

    </form>

  </div>
</div>

</body>
</html>
