<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑️ Xóa bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f8f9fc; }
    .confirm-box {
      max-width: 600px;
      margin: auto;
      border-radius: 12px;
    }
  </style>
</head>

<body class="p-4">

<div class="container">
  <div class="card shadow-sm p-4 confirm-box">
    <h3 class="text-danger fw-bold text-center mb-3">
      ⚠️ Xác nhận xóa bài tập
    </h3>

    <p class="text-center mb-4">
      Bạn có chắc chắn muốn xóa bài tập:
      <br>
      <b class="text-primary">{{ assignment.title }}</b> không?
    </p>

    <div class="alert alert-warning text-center">
      Hành động này <b>không thể hoàn tác</b>.  
      Tất cả bài nộp liên quan cũng sẽ bị xóa theo.
    </div>

    <form method="post" action="/admin/assignment/delete/{{ assignment.id }}" class="text-center">
      <button type="submit" class="btn btn-danger px-4">
        🗑️ Xóa ngay
      </button>
      <a href="/admin/assignment/list" class="btn btn-secondary px-4">
        Hủy
      </a>
    </form>
  </div>
</div>

</body>
</html>
