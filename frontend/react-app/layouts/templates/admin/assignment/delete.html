<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑️ Xóa bài tập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container text-center">
    <h3 class="text-danger fw-bold mb-4">⚠️ Xác nhận xóa bài tập</h3>
    <p>Bạn có chắc muốn xóa <b>{{ assignment.title }}</b> không?</p>
    <form method="post" action="/admin/assignment/delete/{{ assignment.id }}">
      <button type="submit" class="btn btn-danger">🗑️ Xóa</button>
      <a href="/admin/assignment/list" class="btn btn-secondary">Hủy</a>
    </form>
  </div>
</body>
</html>
