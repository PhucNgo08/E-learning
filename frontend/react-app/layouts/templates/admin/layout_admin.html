<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Bảng điều khiển quản trị{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <link rel="stylesheet" href="/frontend/react-app/layouts/styles/admin.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" onerror="this.disabled=true; this.media='all';">
  
  <link rel="icon" type="image/png" href="/static/images/fox-logo.png">

  {% block extra_css %}{% endblock %}
</head>

<body>
  <nav id="sidebar">
    <div class="sidebar-header">
      <img src="/static/images/fox-logo.png" alt="Logo" />
      <span>E-Learning Admin</span>
      
      <i class="bi bi-x-lg" id="closeSidebar"></i>
    </div>

    <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Trang chủ</a>
    <a href="/admin/Account/manage-users"><i class="bi bi-people-fill"></i> Người dùng</a>
    <a href="/admin/Course/manage"><i class="bi bi-book-half"></i> Khóa học</a>
    <a href="/admin/majors/list"><i class="bi bi-mortarboard-fill"></i> Ngành học</a>
    <a href="/admin/academic_years/list"><i class="bi bi-calendar3"></i> Năm học</a>
    <a href="/admin/settings/manage"><i class="bi bi-gear-fill"></i> Cấu hình</a>
    <a href="/admin/wallets/list"><i class="bi bi-wallet2"></i> Quản lý Ví</a>

    <div class="sidebar-footer">
      👋 Xin chào, <strong>{{ username or "Admin" }}</strong><br />
      <a href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
    </div>
  </nav>

  <header class="admin-header">
    <div class="nav-icons ms-auto">
      
      <button class="mode-toggle" id="toggleMode" title="Chế độ Sáng/Tối">
        <i class="bi bi-moon-fill"></i>
      </button>

      
      
      <div class="avatar ms-3">
        <img src="/static/images/fox-logo.png" alt="Admin Avatar" />
      </div>
    </div>
  </header>

  <button class="toggle-btn" id="toggleSidebar" title="Mở menu">
    <i class="bi bi-list"></i>
  </button>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleSidebar");
    const closeBtn = document.getElementById("closeSidebar"); 
    const body = document.body;
    const modeToggle = document.getElementById("toggleMode");

    // 1. Hàm bật/tắt menu chung
    const toggleMenu = () => {
      sidebar.classList.toggle("active");      
      body.classList.toggle("sidebar-open");   
    };

    // 2. Sự kiện Click nút 3 gạch
    toggleBtn.addEventListener("click", toggleMenu);

    // 3. Sự kiện Click nút X (Đóng sidebar)
    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        sidebar.classList.remove("active");
        body.classList.remove("sidebar-open");
      });
    }

    // 4. Xử lý Dark Mode
    const setDarkMode = (isDark) => {
      document.body.classList.toggle("dark-mode", isDark);
      // Đổi icon mặt trăng/mặt trời
      modeToggle.innerHTML = isDark ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
      localStorage.setItem("darkMode", isDark);
    };

    modeToggle.addEventListener("click", () => setDarkMode(!document.body.classList.contains("dark-mode")));
    
    // Giữ trạng thái Dark Mode khi load lại trang
    if (localStorage.getItem("darkMode") === "true") setDarkMode(true);
  </script>
</body>
</html>
