<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa Mẫu Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h4 class="text-primary mb-3"><i class="bi bi-pencil-square"></i> Chỉnh sửa Mẫu Quiz</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Tên mẫu</label>
        <input type="text" name="name" class="form-control" value="{{ template.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="4">{{ template.description }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Luật / Quy tắc</label>
        <textarea name="rules" class="form-control" rows="5">{{ template.rules }}</textarea>
      </div>
      <button type="submit" class="btn btn-success">Cập nhật</button>
      <a href="/admin/quiz-template/list" class="btn btn-secondary">Hủy</a>
    </form>
  </div>
</body>
</html>
