<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm Mẫu Quiz</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      font-family: "Inter", sans-serif;
    }

    .page-header h4 {
      font-weight: 700;
      color: #0d47a1;
    }

    .card-form {
      max-width: 720px;
      margin: auto;
      padding: 25px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .form-label {
      font-weight: 600;
      color: #1e293b;
    }

    .btn-primary {
      background: linear-gradient(90deg, #0056d2, #003087);
      border: none;
      padding: 8px 20px;
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,80,200,0.25);
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-secondary {
      border-radius: 10px;
    }

    .field-hint {
      font-size: 0.83rem;
      color: #6b7280;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <!-- Header -->
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/admin/quiz-template/list" class="btn btn-outline-secondary btn-sm shadow-sm">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
    <h4 class="mb-0 text-primary page-header">
      <i class="bi bi-plus-circle"></i> Thêm Mẫu Quiz
    </h4>
  </div>

  <!-- Form Card -->
  <div class="card-form">

    <form method="post">

      <!-- Tên mẫu -->
      <div class="mb-3">
        <label class="form-label">Tên mẫu <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="Ví dụ: Mẫu Quiz kỹ năng số" required>
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Mô tả ý nghĩa của mẫu quiz..."></textarea>
      </div>

      <!-- Quy tắc sinh câu hỏi -->
      <div class="mb-3">
        <label class="form-label">
          Luật / Quy tắc sinh câu hỏi <span class="text-danger">*</span>
        </label>

        <textarea name="rules" class="form-control" rows="6"
          placeholder='Ví dụ:
{
  "difficulty": "easy",
  "source": "question_bank",
  "tags": ["math", "logic"],
  "limit": 10
}' required></textarea>

        <div class="field-hint mt-1">
          Gợi ý: Có thể nhập JSON hoặc mô tả text — dùng để tự động sinh quiz từ ngân hàng câu hỏi.
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Lưu Mẫu Quiz
        </button>
        <a href="/admin/quiz-template/list" class="btn btn-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
      </div>

    </form>

  </div>
</div>

</body>
</html>
