{% extends "layout_admin.html" %}
{% block title %}➕ Thêm Mẫu Quiz{% endblock %}

{% block content %}
<style>
  body {
    background: #f5f7fb;
    font-family: "Inter", sans-serif;
  }

  .card-form {
    max-width: 720px;
    margin: auto;
    padding: 25px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  .form-label {
    font-weight: 600;
    color: #1e293b;
  }

  .btn-primary {
    background: linear-gradient(90deg, #0056d2, #003087);
    border: none;
    padding: 8px 20px;
    font-weight: 600;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,80,200,0.25);
  }

  .field-hint {
    font-size: 0.83rem;
    color: #6b7280;
  }
</style>

<div class="container py-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/admin/quiz-template/list" class="btn btn-outline-secondary btn-sm shadow-sm">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
    <h4 class="mb-0 text-primary">
      <i class="bi bi-plus-circle"></i> Thêm Mẫu Quiz
    </h4>
  </div>

  {% if error_message %}
  <div class="alert alert-danger max-w-720 mx-auto">{{ error_message }}</div>
  {% endif %}

  <div class="card-form">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Tên mẫu <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control"
               value="{{ form_data.name if form_data else '' }}"
               placeholder="Ví dụ: Mẫu Quiz kỹ năng số" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="4"
                  placeholder="Mô tả ý nghĩa của mẫu quiz...">{{ form_data.description if form_data else '' }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Luật / Quy tắc sinh câu hỏi <span class="text-danger">*</span></label>
        <textarea name="rules" class="form-control" rows="6"
                  placeholder='Ví dụ:
{
  "difficulty": "easy",
  "source": "question_bank",
  "tags": ["math", "logic"],
  "limit": 10
}' required>{{ form_data.rules if form_data else '' }}</textarea>

        <div class="field-hint mt-1">
          Có thể nhập JSON hoặc mô tả text để phục vụ sinh quiz tự động.
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Lưu Mẫu Quiz
        </button>
        <a href="/admin/quiz-template/list" class="btn btn-secondary">
          <i class="bi bi-x-circle"></i> Hủy
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
