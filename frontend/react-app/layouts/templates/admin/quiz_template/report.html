{% extends "layout_admin.html" %}
{% block title %}📊 Báo cáo Quiz Template{% endblock %}

{% block content %}
<div class="container py-4">
  <h3 class="text-primary mb-4">📊 Báo cáo quiz: {{ quiz.title if quiz else "—" }}</h3>
  <div class="card shadow-sm border-0 rounded-4 p-4">
    <canvas id="quizChart" height="100"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script id="labels-data" type="application/json">
  {{ labels | tojson | safe }}
</script>

<script id="chart-values-data" type="application/json">
  {{ data | tojson | safe }}
</script>

<script>
  const labels = JSON.parse(document.getElementById("labels-data").textContent);
  const values = JSON.parse(document.getElementById("chart-values-data").textContent);

  const ctx = document.getElementById("quizChart");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Số câu đúng",
        data: values,
        backgroundColor: "#007bff",
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1 }
        }
      }
    }
  });
</script>
{% endblock %}
