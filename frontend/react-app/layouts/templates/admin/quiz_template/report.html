<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📊 Báo cáo quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="p-4 bg-light">
  <h3 class="text-primary mb-4">📊 Báo cáo quiz: {{ quiz.title }}</h3>
  <canvas id="quizChart" height="100"></canvas>

  <script>
    const ctx = document.getElementById("quizChart");

    // ✅ Dữ liệu an toàn & không lỗi VSCode
    const chartData = {
      labels: JSON.parse('{{ labels | tojson | safe }}'),
      datasets: [{
        label: "Số câu đúng",
        data: JSON.parse('{{ data | tojson | safe }}'),
        backgroundColor: "#007bff",
        borderWidth: 1
      }]
    };

    new Chart(ctx, {
      type: "bar",
      data: chartData,
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });
  </script>
</body>
</html>
