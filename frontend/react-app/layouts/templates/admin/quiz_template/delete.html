<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xóa Mẫu Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h4 class="text-danger mb-4"><i class="bi bi-exclamation-triangle"></i> Xác nhận xóa</h4>
    <p>Bạn có chắc muốn xóa mẫu quiz <strong>{{ template.name }}</strong> không?</p>
    <form method="post">
      <button type="submit" class="btn btn-danger">Xóa</button>
      <a href="/admin/quiz-template/list" class="btn btn-secondary">Hủy</a>
    </form>
  </div>
</body>
</html>
