{% extends "layout_admin.html" %}
{% block title %}🗑️ Xóa bản sao lưu{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #eef3ff, #dae6ff);
    font-family: "Inter", sans-serif;
  }
  .confirm-box {
    max-width: 520px;
    border-radius: 14px;
    padding: 35px 30px;
    background: #fff;
    box-shadow: 0 6px 22px rgba(0,0,0,0.08);
    animation: fadeIn 0.3s ease-in-out;
    border-top: 6px solid #ff3b3b;
    margin: 30px auto;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
  }
  .file-box {
    background: #f8f9ff;
    padding: 12px;
    border-radius: 10px;
    font-family: monospace;
    border: 1px dashed #b9c4ff;
    color: #3b4cff;
  }
</style>

<div class="container py-4">
  <div class="confirm-box text-center">
    <div class="mb-3">
      <i class="bi bi-exclamation-octagon fs-1 text-danger"></i>
    </div>

    <h4 class="fw-bold text-danger mb-3">
      Bạn có chắc muốn xóa bản sao lưu này?
    </h4>

    <p class="text-muted">Hành động này không thể hoàn tác.</p>

    <div class="file-box mt-3">
      <i class="bi bi-filetype-sql"></i>
      {{ backup.file_path.replace('\\', '/').split('/')[-1] if backup.file_path else 'unknown.sql' }}
    </div>

    <form method="post" action="/admin/backups/delete/{{ backup.id }}">
      <div class="d-flex justify-content-center mt-4 gap-3">
        <a href="/admin/backups/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Hủy
        </a>

        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash"></i> Xóa ngay
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
