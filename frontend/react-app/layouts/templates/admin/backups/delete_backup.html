<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xóa bản sao lưu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
<div class="card shadow-lg p-4 text-center" style="max-width:500px;">
  <h4>🗑️ Bạn có chắc chắn muốn xóa bản sao lưu này?</h4>
  <p class="text-muted">{{ backup.file_path }}</p>
  <form method="post" action="/admin/backups/delete/{{ backup.id }}">
    <div class="d-flex justify-content-center mt-4 gap-3">
      <a href="/admin/backups/manage" class="btn btn-secondary">Hủy</a>
      <button type="submit" class="btn btn-danger">Xóa</button>
    </div>
  </form>
</div>
</body>
</html>
