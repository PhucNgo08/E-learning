<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑️ Xóa bản sao lưu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #eef3ff, #dae6ff);
      font-family: "Inter", sans-serif;
    }
    .confirm-box {
      max-width: 520px;
      border-radius: 14px;
      padding: 35px 30px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      animation: fadeIn 0.3s ease-in-out;
      border-top: 6px solid #ff3b3b;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .file-box {
      background: #f8f9ff;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      border: 1px dashed #b9c4ff;
      color: #3b4cff;
    }
    .btn-danger {
      font-weight: 600;
      padding-left: 25px;
      padding-right: 25px;
    }
    .btn-secondary {
      padding-left: 25px;
      padding-right: 25px;
    }
  </style>

</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">

  <div class="confirm-box text-center">

    <div class="mb-3">
      <i class="bi bi-exclamation-octagon fs-1 text-danger"></i>
    </div>

    <h4 class="fw-bold text-danger mb-3">
      Bạn có chắc muốn xóa bản sao lưu này?
    </h4>

    <p class="text-muted">Hành động này không thể hoàn tác.</p>

    <div class="file-box mt-3">
      <i class="bi bi-filetype-sql"></i>
      {{ backup.file_path.split('/')[-1] }}
    </div>

    <form method="post" action="/admin/backups/delete/{{ backup.id }}">
      <div class="d-flex justify-content-center mt-4 gap-3">

        <a href="/admin/backups/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Hủy
        </a>

        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash"></i> Xóa ngay
        </button>

      </div>
    </form>

  </div>

</body>
</html>
