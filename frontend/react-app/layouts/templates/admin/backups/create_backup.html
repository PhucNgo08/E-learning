<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>💾 Tạo bản sao lưu mới</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e8eeff, #d6e4ff);
      font-family: "Inter", sans-serif;
    }
    .box {
      max-width: 520px;
      width: 100%;
      background: #fff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="box">

    <h3 class="fw-bold text-primary text-center mb-4">
      <i class="bi bi-hdd-network"></i> Tạo bản sao lưu hệ thống
    </h3>

    <form method="post" action="/admin/backups/create">

      <!-- DATABASE NAME -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên database</label>
        <input type="text" class="form-control" name="database_name" value="e_learning" readonly>
      </div>

      <!-- BACKUP TYPE -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Loại backup
          <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
             title="Full: sao lưu toàn bộ hệ thống. Incremental: chỉ sao lưu phần thay đổi."></i>
        </label>
        <select class="form-select" name="backup_type">
          <option value="full">🔵 Full Backup</option>
          <option value="incremental">🟡 Incremental Backup</option>
        </select>
      </div>

      <!-- NOTE -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Ghi chú (không bắt buộc)</label>
        <textarea class="form-control" rows="3" placeholder="VD: Backup trước khi cập nhật hệ thống..."></textarea>
      </div>

      <div class="text-end mt-4">
        <a href="/admin/backups/manage" class="btn btn-outline-secondary me-2">
          <i class="bi bi-arrow-left-circle"></i> Hủy
        </a>

        <button type="submit" class="btn btn-success">
          <i class="bi bi-cloud-arrow-up"></i> Tạo backup
        </button>
      </div>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
    tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el))
  </script>

</body>
</html>
