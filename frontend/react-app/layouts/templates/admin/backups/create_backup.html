{% extends "layout_admin.html" %}
{% block title %}💾 Tạo bản sao lưu mới{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #e8eeff, #d6e4ff);
    font-family: "Inter", sans-serif;
  }
  .box {
    max-width: 520px;
    width: 100%;
    background: #fff;
    padding: 35px 30px;
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.08);
    animation: fadeIn 0.3s ease-in-out;
    margin: 30px auto;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="container py-4">
  <div class="box">
    <h3 class="fw-bold text-primary text-center mb-4">
      <i class="bi bi-hdd-network"></i> Tạo bản sao lưu hệ thống
    </h3>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/backups/create">
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên database</label>
        <input type="text" class="form-control" name="database_name"
               value="{{ form_data.database_name if form_data else 'e_learning' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">
          Loại backup
          <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
             title="Full: sao lưu toàn bộ. Incremental: sao lưu phần thay đổi."></i>
        </label>
        <select class="form-select" name="backup_type">
          <option value="full" {% if not form_data or form_data.backup_type == 'full' %}selected{% endif %}>🔵 Full Backup</option>
          <option value="incremental" {% if form_data and form_data.backup_type == 'incremental' %}selected{% endif %}>🟡 Incremental Backup</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Ghi chú (không bắt buộc)</label>
        <textarea class="form-control" name="note" rows="3"
                  placeholder="VD: Backup trước khi cập nhật hệ thống...">{{ form_data.note if form_data else '' }}</textarea>
      </div>

      <div class="text-end mt-4">
        <a href="/admin/backups/manage" class="btn btn-outline-secondary me-2">
          <i class="bi bi-arrow-left-circle"></i> Hủy
        </a>

        <button type="submit" class="btn btn-success">
          <i class="bi bi-cloud-arrow-up"></i> Tạo backup
        </button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el));
</script>
{% endblock %}
