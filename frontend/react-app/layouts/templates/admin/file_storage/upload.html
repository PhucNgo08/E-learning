{% extends "layout_admin.html" %}
{% block title %}📤 Upload File{% endblock %}

{% block content %}
<div class="container mt-5 col-lg-6">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-3"><i class="bi bi-upload"></i> Upload File mới</h4>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data" action="/admin/file-storage/upload">
        <div class="mb-3">
          <label class="form-label">Chọn file</label>
          <input type="file" name="file" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Storage Provider</label>
          <select name="storage_provider" class="form-select">
            <option value="local" {% if not form_data or form_data.storage_provider == 'local' %}selected{% endif %}>Local</option>
            <option value="s3" {% if form_data and form_data.storage_provider == 's3' %}selected{% endif %}>S3</option>
            <option value="cdn" {% if form_data and form_data.storage_provider == 'cdn' %}selected{% endif %}>CDN</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Công khai (Public)</label>
          <select name="is_public" class="form-select">
            <option value="1" {% if not form_data or form_data.is_public|string == '1' %}selected{% endif %}>Có</option>
            <option value="0" {% if form_data and form_data.is_public|string == '0' %}selected{% endif %}>Không</option>
          </select>
        </div>

        <button class="btn btn-primary" type="submit">
          <i class="bi bi-cloud-upload"></i> Upload
        </button>
        <a href="/admin/file-storage/list" class="btn btn-secondary">Quay lại</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
