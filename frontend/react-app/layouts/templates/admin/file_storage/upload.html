{% extends "layout_admin.html" %}
{% block title %}📤 Upload File{% endblock %}
{% block content %}
<div class="container mt-5 col-lg-6">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-3"><i class="bi bi-upload"></i> Upload File mới</h4>
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Chọn file</label>
          <input type="file" name="file" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Storage Provider</label>
          <select name="storage_provider" class="form-select">
            <option value="local">Local</option>
            <option value="s3">S3</option>
            <option value="cdn">CDN</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Công khai (Public)</label>
          <select name="is_public" class="form-select">
            <option value="1">Có</option>
            <option value="0">Không</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-cloud-upload"></i> Upload
        </button>
        <a href="/admin/file-storage/list" class="btn btn-secondary">Quay lại</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
