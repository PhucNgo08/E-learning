<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>➕ Thêm lớp học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="max-width:700px;width:100%;">
    <h3 class="text-center text-primary mb-4">➕ Thêm lớp học mới</h3>
    <form method="post" action="/admin/Class/create">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Mã lớp</label>
          <input type="text" class="form-control" name="class_code" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Tên lớp</label>
          <input type="text" class="form-control" name="class_name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Ngành học</label>
          <select class="form-select" name="major_id">
            {% for m in majors %}
            <option value="{{ m.id }}">{{ m.major_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Năm học</label>
          <select class="form-select" name="academic_year_id">
            {% for y in academic_years %}
            <option value="{{ y.id }}">{{ y.year_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Giáo viên chủ nhiệm</label>
          <select class="form-select" name="homeroom_teacher_id">
            {% for t in teachers %}
            <option value="{{ t.id }}">{{ t.full_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Số lượng tối đa</label>
          <input type="number" class="form-control" name="max_students" value="50" min="1">
        </div>
      </div>

      <div class="mt-4 text-end">
        <a href="/admin/Class/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-save2"></i> Lưu
        </button>
      </div>
    </form>
  </div>
</body>
</html>
