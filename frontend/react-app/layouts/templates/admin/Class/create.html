<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>➕ Thêm lớp học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="max-width:800px; width:100%; border:none;">

    <h3 class="text-center text-primary mb-4">➕ Tạo lớp học mới</h3>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/Class/create">
      <h5 class="mb-3 fw-bold text-secondary">📘 Thông tin cơ bản</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Mã lớp</label>
          <input type="text" class="form-control" name="class_code"
                 value="{{ form_data.class_code if form_data else '' }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tên lớp</label>
          <input type="text" class="form-control" name="class_name"
                 value="{{ form_data.class_name if form_data else '' }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Loại lớp</label>
          <select class="form-select" name="class_type">
            <option value="official" {% if not form_data or form_data.class_type == 'official' %}selected{% endif %}>Chính thức</option>
            <option value="club" {% if form_data and form_data.class_type == 'club' %}selected{% endif %}>Câu lạc bộ</option>
            <option value="course" {% if form_data and form_data.class_type == 'course' %}selected{% endif %}>Lớp khóa học</option>
            <option value="temporary" {% if form_data and form_data.class_type == 'temporary' %}selected{% endif %}>Tạm thời</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Khối / Niên khóa (Grade Level)</label>
          <input type="number" class="form-control" name="grade_level" placeholder="VD: 12"
                 value="{{ form_data.grade_level if form_data else '' }}">
        </div>
      </div>

      <h5 class="mt-4 mb-3 fw-bold text-secondary">🏫 Thông tin học vụ</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Ngành học</label>
          <select class="form-select" name="major_id">
            <option value="">-- Chọn ngành --</option>
            {% for m in majors %}
            <option value="{{ m.id }}" {% if form_data and form_data.major_id == m.id %}selected{% endif %}>
              {{ m.major_name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Năm học</label>
          <select class="form-select" name="academic_year_id">
            <option value="">-- Chọn năm học --</option>
            {% for y in academic_years %}
            <option value="{{ y.id }}" {% if form_data and form_data.academic_year_id == y.id %}selected{% endif %}>
              {{ y.year_name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Giáo viên chủ nhiệm</label>
          <select class="form-select" name="homeroom_teacher_id">
            <option value="">-- Chưa phân công --</option>
            {% for t in teachers %}
            <option value="{{ t.id }}" {% if form_data and form_data.homeroom_teacher_id == t.id %}selected{% endif %}>
              {{ t.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Số lượng tối đa</label>
          <input type="number" class="form-control" name="max_students" min="1"
                 value="{{ form_data.max_students if form_data else 50 }}">
        </div>
      </div>

      <h5 class="mt-4 mb-3 fw-bold text-secondary">⏳ Thời gian lớp học</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Ngày bắt đầu</label>
          <input type="date" class="form-control" name="start_date"
                 value="{{ form_data.start_date if form_data else '' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Ngày kết thúc</label>
          <input type="date" class="form-control" name="end_date"
                 value="{{ form_data.end_date if form_data else '' }}">
        </div>
      </div>

      <h5 class="mt-4 mb-3 fw-bold text-secondary">📝 Thời gian ghi danh</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Mở ghi danh</label>
          <input type="date" class="form-control" name="enrollment_start"
                 value="{{ form_data.enrollment_start if form_data else '' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Hạn ghi danh</label>
          <input type="date" class="form-control" name="enrollment_end"
                 value="{{ form_data.enrollment_end if form_data else '' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Trạng thái lớp</label>
          <select class="form-select" name="status">
            <option value="planning" {% if not form_data or form_data.status == 'planning' %}selected{% endif %}>Đang dự thảo</option>
            <option value="open_for_enrollment" {% if form_data and form_data.status == 'open_for_enrollment' %}selected{% endif %}>Mở ghi danh</option>
            <option value="active" {% if form_data and form_data.status == 'active' %}selected{% endif %}>Đang học</option>
            <option value="completed" {% if form_data and form_data.status == 'completed' %}selected{% endif %}>Đã hoàn thành</option>
            <option value="cancelled" {% if form_data and form_data.status == 'cancelled' %}selected{% endif %}>Đã hủy</option>
          </select>
        </div>
      </div>

      <div class="mt-4 text-end">
        <a href="/admin/Class/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-success">
          <i class="bi bi-save2"></i> Lưu lớp học
        </button>
      </div>
    </form>
  </div>
</body>
</html>
