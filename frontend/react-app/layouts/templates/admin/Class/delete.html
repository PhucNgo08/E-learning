<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑️ Xóa lớp học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

  <div class="card shadow-lg p-4 text-center" style="max-width:500px;width:100%;">
    
    <h4 class="text-danger mb-3">⚠️ Xác nhận xóa lớp học</h4>

    <p>Bạn có chắc muốn xóa lớp <strong>{{ cls.class_name }}</strong>?</p>

    <form action="/admin/Class/delete/{{ cls.id }}" method="post" class="mt-4">
      <div class="d-flex justify-content-center gap-3">
        <a href="/admin/Class/manage" class="btn btn-secondary">
          Hủy
        </a>

        <button type="submit" class="btn btn-danger">
          🗑️ Xóa
        </button>
      </div>
    </form>

  </div>

</body>
</html>
