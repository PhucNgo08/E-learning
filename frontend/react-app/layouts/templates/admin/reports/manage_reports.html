<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📊 Báo cáo thống kê</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h3 class="text-center text-primary mb-4">📊 Báo cáo tổng hợp hệ thống</h3>

  <div class="row g-4 text-center">
    <div class="col-md-3"><div class="card border-primary"><div class="card-body"><h5>👨‍🎓 Học viên</h5><p class="fs-4 fw-bold text-primary">{{ summary.students }}</p></div></div></div>
    <div class="col-md-3"><div class="card border-success"><div class="card-body"><h5>📘 Khóa học</h5><p class="fs-4 fw-bold text-success">{{ summary.courses }}</p></div></div></div>
    <div class="col-md-3"><div class="card border-warning"><div class="card-body"><h5>🧠 Quiz</h5><p class="fs-4 fw-bold text-warning">{{ summary.quizzes }}</p></div></div></div>
    <div class="col-md-3"><div class="card border-danger"><div class="card-body"><h5>⭐ Đánh giá</h5><p class="fs-4 fw-bold text-danger">{{ summary.reviews }}</p></div></div></div>
  </div>

  <form method="post" action="/admin/reports/generate" class="mt-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <select class="form-select" name="report_type" required>
          <option value="">-- Chọn loại báo cáo --</option>
          <option value="course">Khóa học</option>
          <option value="enrollment">Ghi danh</option>
          <option value="quiz">Bài kiểm tra</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100">Tạo báo cáo</button>
      </div>
    </div>
  </form>

  <a href="/admin/dashboard" class="btn btn-secondary mt-4">← Quay lại Dashboard</a>
</div>
</body>
</html>
