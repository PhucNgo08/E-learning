<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Xóa Báo Cáo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f4ff;
            min-height: 100vh;
        }
        .confirm-card {
            max-width: 600px;
            margin: 100px auto;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        .btn-danger {
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div class="confirm-card text-center">
        <h3 class="text-danger mb-3">⚠ Xác Nhận Xóa Báo Cáo</h3>

        <p class="fs-5">
            Bạn có chắc chắn muốn xóa báo cáo  
            <strong>{{ report.report_name if report else "Không xác định" }}</strong>?
        </p>

        <form method="post" action="/admin/reports/delete/{{ report.id }}">
            <button type="submit" class="btn btn-danger w-100 mt-3">
                🗑 Xóa Báo Cáo
            </button>
        </form>

        <a href="/admin/reports/manage" class="btn btn-link mt-3">
            ⬅ Trở lại Quản Lý Báo Cáo
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
