{% extends "layout_admin.html" %}

{% block title %}Cài đặt hệ thống{% endblock %}

{% block extra_css %}
<style>
  .settings-simple-page {
    max-width: 720px;
    margin: 0 auto;
    color: #0f172a;
  }

  .settings-simple-header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border-radius: 18px;
    padding: 24px 28px;
    box-shadow: 0 14px 34px rgba(37, 99, 235, 0.18);
  }

  .settings-simple-header .header-subtitle {
    color: rgba(255, 255, 255, 0.88);
  }

  .settings-simple-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
    padding: 26px;
  }

  .settings-simple-card .form-label {
    color: #0f172a;
    font-weight: 800;
  }

  .settings-simple-card .form-control {
    background: #ffffff;
    color: #0f172a;
    border-color: #cbd5e1;
    border-radius: 14px;
    min-height: 48px;
  }

  .settings-simple-card textarea.form-control {
    min-height: 120px;
  }

  .settings-simple-card .form-control:focus {
    background: #ffffff;
    color: #0f172a;
    border-color: #2563eb;
    box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.14);
  }

  body.dark-mode .settings-simple-page,
  html[data-bs-theme="dark"] .settings-simple-page {
    color: #e5e7eb;
  }

  body.dark-mode .settings-simple-card,
  html[data-bs-theme="dark"] .settings-simple-card {
    background: rgba(15, 23, 42, 0.96);
    border-color: rgba(148, 163, 184, 0.35);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
  }

  body.dark-mode .settings-simple-card .form-label,
  html[data-bs-theme="dark"] .settings-simple-card .form-label {
    color: #e5e7eb;
  }

  body.dark-mode .settings-simple-card .form-control,
  html[data-bs-theme="dark"] .settings-simple-card .form-control {
    background: #111827;
    color: #f8fafc;
    border-color: rgba(148, 163, 184, 0.35);
  }

  body.dark-mode .settings-simple-card .form-control:focus,
  html[data-bs-theme="dark"] .settings-simple-card .form-control:focus {
    background: #0f172a;
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.18);
  }
</style>
{% endblock %}

{% block content %}
<div class="settings-simple-page">

  <div class="settings-simple-header mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <h3 class="fw-bold mb-1">
        <i class="bi bi-sliders me-2"></i>Cài đặt hệ thống
      </h3>
      <p class="header-subtitle mb-0">
        Thêm hoặc cập nhật nhanh một cấu hình hệ thống.
      </p>
    </div>

    <a href="/admin/settings/manage" class="btn btn-light text-primary fw-semibold">
      <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>
  </div>

  <div class="settings-simple-card">
    <form method="post" onsubmit="return validateSimpleSettingsForm()">
      <div class="mb-3">
        <label class="form-label">Mã cấu hình</label>
        <input id="setting_key" name="setting_key" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Giá trị</label>
        <textarea id="setting_value" name="setting_value" class="form-control" required></textarea>
      </div>

      <button class="btn btn-success px-4">
        <i class="bi bi-save me-1"></i>Lưu thay đổi
      </button>
    </form>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
  function validateSimpleSettingsForm() {
    const key = document.getElementById("setting_key").value.trim();
    const val = document.getElementById("setting_value").value.trim();

    if (!key || !val) {
      alert("Vui lòng nhập đầy đủ thông tin!");
      return false;
    }

    return true;
  }
</script>
{% endblock %}
