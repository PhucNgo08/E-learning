{% extends "layout_admin.html" %}
{% block title %}✏️ Chỉnh sửa ngành học{% endblock %}

{% block content %}
<div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width: 760px;">
  <h3 class="text-center text-primary mb-4">✏️ Cập nhật ngành học</h3>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" action="/admin/majors/edit/{{ major.id }}">
    <div class="mb-3">
      <label class="form-label fw-bold">📘 Mã ngành</label>
      <input type="text" class="form-control" name="major_code" value="{{ major.major_code }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">🎓 Tên ngành</label>
      <input type="text" class="form-control" name="major_name" value="{{ major.major_name }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">🏫 Khoa trực thuộc</label>
      <input
        type="text"
        class="form-control"
        name="faculty_name"
        list="facultyOptions"
        value="{{ major.faculty_name or '' }}"
      >
      <datalist id="facultyOptions">
        {% for c in categories %}
          <option value="{{ c.category_name }}"></option>
        {% endfor %}
      </datalist>
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if major.is_active %}checked{% endif %}>
      <label class="form-check-label" for="is_active">Ngành đang hoạt động</label>
    </div>

    <div class="text-center">
      <button class="btn btn-success px-4" type="submit">Lưu thay đổi</button>
      <a href="/admin/majors/list" class="btn btn-outline-secondary ms-2">⬅ Quay lại</a>
    </div>
  </form>
</div>
{% endblock %}
