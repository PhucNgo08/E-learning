<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🗑 Xóa ngành học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 rounded shadow-sm text-center">
  <h3 class="mb-4 text-danger">🗑 Xóa ngành học</h3>
  <p>Bạn có chắc chắn muốn xóa ngành <strong>{{ major.major_name }}</strong> không?</p>
  <form method="post" action="/admin/majors/delete/{{ major.id }}">
    <button type="submit" class="btn btn-danger">Xóa</button>
    <a href="/admin/majors/list" class="btn btn-secondary">Hủy</a>
  </form>
</div>
</body>
</html>
