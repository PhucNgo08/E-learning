<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🔐 Mật khẩu mới của giảng viên</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .pw-box {
      font-size: 1.3rem;
      font-weight: bold;
      background: #f0f4ff;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #cfd8ff;
      letter-spacing: 1px;
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-5 bg-white p-4 rounded shadow-sm" style="max-width: 600px;">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary mb-0">🔐 Reset mật khẩu thành công</h3>
    <a href="/admin/teachers/edit/{{ teacher.id }}" class="btn btn-outline-secondary">
      ⬅ Quay lại
    </a>
  </div>

  <p class="mb-2">
    Mật khẩu mới của giảng viên:
  </p>

  <!-- Ô hiển thị mật khẩu -->
  <div class="pw-box d-flex justify-content-between align-items-center mb-3">
    <span id="pwValue">{{ new_password }}</span>
    <button type="button" class="btn btn-sm btn-outline-primary" onclick="copyPw()">
      📋 Copy
    </button>
  </div>

  <div class="alert alert-warning">
    ⚠️ <b>Lưu ý:</b> Hãy gửi mật khẩu mới này cho giảng viên để họ đăng nhập lại và đổi mật khẩu.
  </div>

  <!-- Footer button -->
  <div class="text-end mt-4">
    <a href="/admin/teachers/edit/{{ teacher.id }}" class="btn btn-primary">
      ✔ Trở lại trang chỉnh sửa
    </a>
  </div>

</div>

<script>
  function copyPw() {
    const pw = document.getElementById("pwValue").innerText;
    navigator.clipboard.writeText(pw);
    alert("Đã copy mật khẩu!");
  }
</script>

</body>
</html>
