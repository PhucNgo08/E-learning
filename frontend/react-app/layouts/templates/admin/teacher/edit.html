<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Cập nhật thông tin giảng viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 rounded shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary mb-0">✏️ Chỉnh sửa thông tin giảng viên</h3>
    <a href="/admin/teachers/list" class="btn btn-outline-secondary">
      ⬅ Quay lại danh sách
    </a>
  </div>

  <form method="post" action="/admin/teachers/edit/{{ teacher.id }}">
    <!-- Họ tên -->
    <div class="mb-3">
      <label class="form-label fw-semibold">👤 Họ và tên</label>
      <input type="text" class="form-control" name="full_name" value="{{ teacher.full_name }}" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-semibold">📧 Email</label>
      <input type="email" class="form-control" name="email" value="{{ teacher.email }}" required>
    </div>

    <!-- Vai trò -->
    <div class="mb-3">
      <label class="form-label fw-semibold">🎓 Vai trò</label>
      <select name="role" class="form-select">
        <option value="teacher" {% if teacher.role == "teacher" %}selected{% endif %}>Giảng viên</option>
        <option value="assistant" {% if teacher.role == "assistant" %}selected{% endif %}>Trợ giảng</option>
      </select>
    </div>

    <!-- Ngành học -->
    {% if teacher.major %}
    <div class="mb-3">
      <label class="form-label fw-semibold">🏫 Ngành học</label>
      <input type="text" class="form-control" value="{{ teacher.major.major_name }}" disabled>
    </div>

    <!-- Khoa -->
    <div class="mb-3">
      <label class="form-label fw-semibold">🏛️ Khoa</label>
      <input type="text" class="form-control" value="{{ teacher.major.faculty_name }}" disabled>
    </div>
    {% else %}
    <div class="alert alert-warning">
      ⚠️ Giảng viên này chưa được gán vào ngành học hoặc khoa.
    </div>
    {% endif %}

    <!-- Nút hành động -->
    <div class="mt-4 d-flex justify-content-end">
      <button type="submit" class="btn btn-primary px-4 me-2">💾 Lưu thay đổi</button>
      <a href="/admin/teachers/list" class="btn btn-secondary px-4">Hủy</a>
    </div>
  </form>
</div>
</body>
</html>
