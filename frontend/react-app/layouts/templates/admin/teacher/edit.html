<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>✏️ Cập nhật thông tin giảng viên</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f2f6fc;
    }

    .section-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .avatar-wrapper {
      padding: 25px 15px;
      border-radius: 12px;
      background: linear-gradient(145deg, #eef2ff, #e9effd);
      border: 1px solid #d5ddff;
    }

    .avatar-preview {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }

    .avatar-preview:hover {
      transform: scale(1.03);
    }

    .btn-custom {
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
    }

    .form-label {
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container mt-5">

    <!-- HEADER -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <div>
        <h3 class="text-primary mb-1">✏️ Chỉnh sửa thông tin giảng viên</h3>
        <p class="text-muted mb-0">Cập nhật hồ sơ, vai trò và ảnh đại diện giảng viên.</p>
      </div>
      <a href="/admin/teachers/list" class="btn btn-outline-secondary btn-custom">
        ⬅ Quay lại danh sách
      </a>
    </div>

    <div class="row g-4">

      <!-- ======================================
           THÔNG TIN GIẢNG VIÊN
      ======================================= -->
      <div class="col-md-8">
        <div class="section-card">

          <h5 class="fw-bold mb-3">📘 Thông tin giảng viên</h5>

          <form method="post" action="/admin/teachers/edit/{{ teacher.id }}">

            <div class="mb-3">
              <label class="form-label">👤 Họ và tên</label>
              <input type="text" class="form-control" name="full_name" value="{{ teacher.full_name }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label">📧 Email</label>
              <input type="email" class="form-control" name="email" value="{{ teacher.email }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label">🎓 Vai trò</label>
              <select name="role" class="form-select">
                <option value="teacher" {% if teacher.role == "teacher" %}selected{% endif %}>Giảng viên</option>
                <option value="teaching_assistant" {% if teacher.role == "teaching_assistant" %}selected{% endif %}>Trợ giảng</option>
              </select>
            </div>

            {% if teacher.major %}
            <div class="mb-3">
              <label class="form-label">🏫 Ngành học</label>
              <input type="text" class="form-control" value="{{ teacher.major.major_name }}" disabled>
            </div>

            <div class="mb-3">
              <label class="form-label">🏛️ Khoa</label>
              <input type="text" class="form-control" value="{{ teacher.major.faculty_name }}" disabled>
            </div>

            {% else %}
            <div class="alert alert-warning">⚠️ Chưa gán ngành học.</div>
            {% endif %}

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary btn-custom me-2">💾 Lưu thay đổi</button>
              <a href="/admin/teachers/list" class="btn btn-secondary btn-custom">Hủy</a>
            </div>

          </form>

        </div>
      </div>

      <!-- ======================================
           AVATAR GIẢNG VIÊN
      ======================================= -->
      <div class="col-md-4">
        <div class="avatar-wrapper text-center" id="avatar-section">

          <h5 class="fw-bold mb-3">🖼 Ảnh đại diện</h5>

          <img src="{{ teacher.avatar_url if teacher.avatar_url else '/static/images/default-avatar.png' }}"
            class="avatar-preview mb-3" id="avatarPreview">

          <form method="post" action="/admin/teachers/avatar/{{ teacher.id }}" enctype="multipart/form-data">

            <div class="mb-3">
              <input type="file" name="file" accept="image/*" class="form-control" id="avatarInput" required>
            </div>

            <button class="btn btn-success w-100 btn-custom">
              📤 Cập nhật Avatar
            </button>
          </form>

          <hr>

          <a href="/admin/teachers/reset-password/{{ teacher.id }}"
            class="btn btn-outline-danger btn-custom w-100 mt-3">
            🔐 Reset mật khẩu
          </a>

        </div>
      </div>

    </div>

  </div>

  <script>
    // Live preview avatar
    document.getElementById("avatarInput")?.addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById("avatarPreview").src = URL.createObjectURL(file);
      }
    });
  </script>

</body>

</html>
