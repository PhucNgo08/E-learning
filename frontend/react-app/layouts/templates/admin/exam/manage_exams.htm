<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bài Thi</title>
</head>
<body>
    <h1>Quản Lý Bài Thi</h1>
    <a href="/admin/exam/add">Tạo Bài Thi</a>
    <table>
        <thead>
            <tr>
                <th>Tên Bài Thi</th>
                <th>Ngày Thi</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            {% for exam in exams %}
                <tr>
                    <td>{{ exam.name }}</td>
                    <td>{{ exam.date }}</td>
                    <td>
                        <a href="/admin/exam/edit/{{ exam.id }}">Sửa</a> | 
                        <a href="/admin/exam/delete/{{ exam.id }}">Xóa</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
