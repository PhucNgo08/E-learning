{% extends "layout_admin.html" %}
{% block title %}⭐ Thống kê đánh giá khóa học{% endblock %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .stats-box {
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="stats-box">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
      <div>
        <h3 class="text-warning mb-1">⭐ Thống kê đánh giá khóa học</h3>
        <div class="text-muted">Course ID: {{ course_id }}</div>
      </div>
      <div class="d-flex gap-2">
        <span class="badge bg-warning text-dark fs-6">Điểm TB: {{ avg_rating }}</span>
        <a href="/admin/reviews/manage" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>
    </div>

    <canvas id="reviewChart" height="120"></canvas>
  </div>
</div>

<script>
  const rawData = JSON.parse('{{ review_data | tojson | safe }}');
  const reviewData = Array.isArray(rawData)
    ? rawData
    : [
        rawData["5"] || rawData[5] || 0,
        rawData["4"] || rawData[4] || 0,
        rawData["3"] || rawData[3] || 0,
        rawData["2"] || rawData[2] || 0,
        rawData["1"] || rawData[1] || 0
      ];

  const ctx = document.getElementById("reviewChart");

  new Chart(ctx, {
    type: "pie",
    data: {
      labels: ["5⭐", "4⭐", "3⭐", "2⭐", "1⭐"],
      datasets: [{
        data: reviewData,
        backgroundColor: [
          "#2ecc71", "#27ae60", "#f1c40f", "#e67e22", "#e74c3c"
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "bottom",
          labels: { color: "#333" }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const value = context.parsed || 0;
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
              return `${value} đánh giá (${percent}%)`;
            }
          }
        }
      }
    }
  });
</script>
{% endblock %}
