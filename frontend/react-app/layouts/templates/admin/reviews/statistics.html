<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>⭐ Thống kê đánh giá khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="p-4 bg-white">
  <h3 class="text-warning mb-4">⭐ Thống kê đánh giá khóa học</h3>
  <canvas id="reviewChart" height="120"></canvas>

  <script>
    const ctx = document.getElementById("reviewChart");

    // ✅ Dữ liệu an toàn, VSCode không cảnh báo
    const reviewData = JSON.parse('{{ review_data | tojson | safe }}');

    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['5⭐', '4⭐', '3⭐', '2⭐', '1⭐'],
        datasets: [{
          data: reviewData,
          backgroundColor: [
            '#2ecc71', '#27ae60', '#f1c40f', '#e67e22', '#e74c3c'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#333' }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const value = context.parsed;
                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                const percent = ((value / total) * 100).toFixed(1);
                return `${value} đánh giá (${percent}%)`;
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
