<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✏️ Chỉnh sửa Đánh giá Khóa học</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8fafc;
      font-family: "Segoe UI", "Inter", sans-serif;
    }
    .container {
      margin-top: 60px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
    }
    h3 {
      font-weight: 600;
      color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="container">
  <h3 class="text-center mb-4">✏️ Chỉnh sửa Đánh giá</h3>

  <form method="post" action="/admin/reviews/edit/{{ review.id }}">
    <div class="mb-3">
      <label class="form-label fw-semibold">Khóa học</label>
      <input type="text" class="form-control" value="{{ review.course.title if review.course else '—' }}" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Người đánh giá</label>
      <input type="text" class="form-control" value="{{ review.user.username if review.user else '—' }}" readonly>
    </div>

    <div class="mb-3">
      <label for="rating" class="form-label fw-semibold">Điểm đánh giá (1 - 5)</label>
      <input type="number" name="rating" id="rating" class="form-control" min="1" max="5"
             value="{{ review.rating }}" required>
    </div>

    <div class="mb-3">
      <label for="comment" class="form-label fw-semibold">Nhận xét</label>
      <textarea name="comment" id="comment" class="form-control" rows="4">{{ review.comment }}</textarea>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="/admin/reviews/manage" class="btn btn-secondary">
        ⬅️ Quay lại
      </a>
      <button type="submit" class="btn btn-primary">
        💾 Cập nhật
      </button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
