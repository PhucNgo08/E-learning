{% extends "layout_admin.html" %}
{% block title %}✏️ Chỉnh sửa Đánh giá Khóa học{% endblock %}

{% block head_extra %}
<style>
  body {
    background-color: #f8fafc;
    font-family: "Segoe UI", "Inter", sans-serif;
  }
  .page-box {
    margin-top: 30px;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    max-width: 700px;
  }
  h3 {
    font-weight: 600;
    color: #0d6efd;
  }
</style>
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
  <div class="page-box w-100">
    <h3 class="text-center mb-4">✏️ Chỉnh sửa Đánh giá</h3>

    {% if error %}
      <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/admin/reviews/edit/{{ review.id }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Khóa học</label>
        <input type="text" class="form-control" value="{{ course_name }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Người đánh giá</label>
        <input type="text" class="form-control" value="{{ reviewer_name }}" readonly>
      </div>

      <div class="mb-3">
        <label for="rating" class="form-label fw-semibold">Điểm đánh giá (1 - 5)</label>
        <input
          type="number"
          name="rating"
          id="rating"
          class="form-control"
          min="1"
          max="5"
          value="{{ rating_value }}"
          required
        >
      </div>

      <div class="mb-3">
        <label for="comment" class="form-label fw-semibold">Nhận xét</label>
        <textarea name="comment" id="comment" class="form-control" rows="4">{{ review.comment or '' }}</textarea>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/reviews/manage" class="btn btn-secondary">
          ⬅️ Quay lại
        </a>
        <button type="submit" class="btn btn-primary">
          💾 Cập nhật
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
