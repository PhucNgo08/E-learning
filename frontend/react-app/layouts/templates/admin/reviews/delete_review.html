<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🗑️ Xóa Đánh giá Khóa học</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8fafc;
      font-family: "Segoe UI", "Inter", sans-serif;
    }
    .container {
      margin-top: 80px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }
    h4 {
      font-weight: 600;
      color: #dc3545;
    }
  </style>
</head>
<body>

<div class="container">
  <h4 class="mb-3">🗑️ Xác nhận Xóa Đánh giá</h4>
  <p class="text-muted">Bạn có chắc chắn muốn xóa đánh giá này không?</p>

  <div class="alert alert-light text-start">
    <p><strong>Khóa học:</strong> {{ review.course.title if review.course else "—" }}</p>
    <p><strong>Người đánh giá:</strong> {{ review.user.username if review.user else "—" }}</p>
    <p><strong>Điểm:</strong> ⭐ {{ review.rating }}</p>
    <p><strong>Nhận xét:</strong> {{ review.comment or "—" }}</p>
  </div>

  <form method="post" action="/admin/reviews/delete/{{ review.id }}">
    <div class="d-flex justify-content-between mt-4">
      <a href="/admin/reviews/manage" class="btn btn-secondary w-50 me-2">
        ⬅️ Hủy bỏ
      </a>
      <button type="submit" class="btn btn-danger w-50">
        🗑️ Xóa
      </button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
