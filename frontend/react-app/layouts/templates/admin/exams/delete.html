<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗑️ Xóa kỳ thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm border-0">
      <div class="card-body text-center py-5">
        <h3 class="text-danger fw-bold"><i class="bi bi-exclamation-triangle"></i> Xác nhận xóa kỳ thi</h3>
        <p class="mt-3">
          Bạn có chắc chắn muốn xóa kỳ thi:
          <strong class="text-dark">"{{ exam.title }}"</strong>?
        </p>
        <p class="text-muted">Thao tác này không thể hoàn tác.</p>

        <form action="/admin/exams/delete/{{ exam.id }}" method="post" class="d-flex justify-content-center gap-3 mt-4">
          <a href="/admin/exams/manage" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Hủy
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Xóa
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
