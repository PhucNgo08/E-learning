<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>➕ Tạo kỳ thi mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="fw-bold text-success mb-4"><i class="bi bi-plus-circle"></i> Tạo kỳ thi mới</h2>

    <form action="/admin/exams/create" method="post" class="bg-white p-4 rounded shadow-sm">
      <div class="mb-3">
        <label class="form-label">Tên kỳ thi</label>
        <input type="text" name="title" class="form-control" placeholder="Nhập tên kỳ thi..." required />
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Nhập mô tả (nếu có)..."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Khóa học</label>
          <select name="course_id" class="form-select">
            <option value="">-- Chọn khóa học --</option>
            {% for course in courses %}
              <option value="{{ course.id }}">{{ course.course_name }}</option>
            {% endfor %}
            </select>
          </div>


      <div class="mb-3">
        <label class="form-label">Tổng số câu hỏi</label>
        <input type="number" name="total_questions" class="form-control" min="1" value="10" required />
      </div>

      <div class="d-flex justify-content-between">
        <a href="/admin/exams/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-save"></i> Lưu kỳ thi
        </button>
      </div>
    </form>
  </div>
</body>
</html>
