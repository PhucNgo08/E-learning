{% extends "layout_admin.html" %}
{% block title %}➕ Tạo kỳ thi mới{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-success m-0">
      <i class="bi bi-plus-circle"></i> Tạo kỳ thi mới
    </h2>
    <a href="/admin/exams/manage" class="btn btn-outline-secondary shadow-sm">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
  </div>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form action="/admin/exams/create" method="post"
        class="bg-white p-4 rounded-4 shadow-sm border-0 form-box">

    <h5 class="section-title mb-3">
      <i class="bi bi-info-circle"></i> Thông tin chung
    </h5>

    <div class="mb-3">
      <label class="form-label fw-semibold">Tên kỳ thi *</label>
      <input type="text" name="title" class="form-control"
             value="{{ form_data.title if form_data else '' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Mô tả</label>
      <textarea name="description" class="form-control" rows="3">{{ form_data.description if form_data else '' }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Khóa học *</label>
      <select name="course_id" class="form-select" required>
        <option value="">-- Chọn khóa học --</option>
        {% for course in courses %}
          <option value="{{ course.id }}" {% if form_data and form_data.course_id == course.id %}selected{% endif %}>
            {{ course.course_name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">
        Tổng số câu hỏi *
        <span class="text-muted">(sẽ cập nhật tự động sau khi import)</span>
      </label>
      <input type="number" name="total_questions" min="1"
             value="{{ form_data.total_questions if form_data else 10 }}"
             class="form-control" required>
    </div>

    <h5 class="section-title mb-3 mt-4">
      <i class="bi bi-gear"></i> Cấu hình kỳ thi
    </h5>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label fw-semibold">⏱ Thời gian (phút) *</label>
        <input type="number" name="time_limit"
               value="{{ form_data.time_limit if form_data else 45 }}"
               min="1" class="form-control" required>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label fw-semibold">🔁 Số lần làm tối đa *</label>
        <input type="number" name="max_attempts"
               value="{{ form_data.max_attempts if form_data else 1 }}"
               min="1" class="form-control" required>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label fw-semibold">📊 Điểm qua (%) *</label>
        <input type="number" name="passing_score"
               value="{{ form_data.passing_score if form_data else 60 }}"
               min="0" max="100" class="form-control" required>
      </div>
    </div>

    <h5 class="section-title mb-3 mt-4">
      <i class="bi bi-calendar-event"></i> Thời gian mở / đóng
    </h5>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Mở từ</label>
        <input type="datetime-local" name="available_from" class="form-control"
               value="{{ form_data.available_from if form_data else '' }}">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Đóng lúc</label>
        <input type="datetime-local" name="available_to" class="form-control"
               value="{{ form_data.available_to if form_data else '' }}">
      </div>
    </div>

    <div class="d-flex justify-content-between mt-3">
      <a href="/admin/exams/manage" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>

      <button type="submit" class="btn btn-success px-4 fw-semibold">
        <i class="bi bi-save"></i> Lưu kỳ thi
      </button>
    </div>
  </form>
</div>

<style>
.section-title {
  font-weight: 700;
  font-size: 1.1rem;
  background: linear-gradient(135deg, #0d6efd, #6610f2);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.fade-in {
  animation: fadeIn .45s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}
