{% extends "layout_admin.html" %}
{% block title %}➕ Thêm câu hỏi{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <h3 class="fw-bold text-primary mb-4">
    <i class="bi bi-plus-circle"></i> Thêm câu hỏi mới
  </h3>

  <form action="/admin/exams/{{ exam.id }}/questions/add" method="post"
        class="card shadow-sm p-4 border-0 rounded-4">

    <div class="mb-3">
      <label class="form-label fw-semibold">Câu hỏi *</label>
      <textarea name="question_text" class="form-control" rows="3" required></textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">A *</label>
        <input type="text" name="option_a" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">B *</label>
        <input type="text" name="option_b" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">C *</label>
        <input type="text" name="option_c" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">D *</label>
        <input type="text" name="option_d" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Đáp án đúng *</label>
      <select name="correct" class="form-select" required>
        <option value="">-- Chọn đáp án --</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="/admin/exams/{{ exam.id }}/questions" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>

      <button class="btn btn-success px-4">
        <i class="bi bi-check2-circle"></i> Thêm câu hỏi
      </button>
    </div>

  </form>

</div>

{% endblock %}
