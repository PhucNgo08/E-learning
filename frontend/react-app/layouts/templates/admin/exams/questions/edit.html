{% extends "layout_admin.html" %}
{% block title %}✏️ Chỉnh sửa câu hỏi{% endblock %}

{% block content %}
<div class="container py-4 fade-in">

  <h3 class="fw-bold text-warning mb-4">
    <i class="bi bi-pencil-square"></i> Chỉnh sửa câu hỏi
  </h3>

  <form action="/admin/exams/{{ exam_id }}/questions/{{ question.id }}/edit"
        method="post"
        class="card shadow-sm p-4 border-0 rounded-4">

    <div class="mb-3">
      <label class="form-label fw-semibold">Câu hỏi *</label>
      <textarea name="question_text" class="form-control" rows="3" required>
{{ question.question_text }}
      </textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">A *</label>
        <input type="text" name="option_a"
               value="{{ option_a }}" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">B *</label>
        <input type="text" name="option_b"
               value="{{ option_b }}" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">C *</label>
        <input type="text" name="option_c"
               value="{{ option_c }}" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">D *</label>
        <input type="text" name="option_d"
               value="{{ option_d }}" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Đáp án đúng *</label>
      <select name="correct" class="form-select" required>
        {% for letter in ['A','B','C','D'] %}
          <option value="{{ letter }}" {% if correct == letter %}selected{% endif %}>
            {{ letter }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="/admin/exams/{{ exam_id }}/questions" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>

      <button class="btn btn-warning px-4">
        <i class="bi bi-save"></i> Cập nhật
      </button>
    </div>

  </form>

</div>

{% endblock %}
