<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✏️ Chỉnh sửa kỳ thi</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: #f3f4f7;
    }

    .form-box {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .section-title {
      font-weight: 600;
      margin-top: 1rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid #e3e3e3;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <h2 class="fw-bold text-warning mb-4">
      <i class="bi bi-pencil-square"></i> Chỉnh sửa kỳ thi
    </h2>

    <form action="/admin/exams/edit/{{ exam.id }}" method="post" class="form-box">

      <!-- =============================
           THÔNG TIN CHUNG
      ============================== -->
      <h5 class="section-title text-primary">
        <i class="bi bi-info-circle"></i> Thông tin chung
      </h5>

      <div class="mb-3">
        <label class="form-label">Tên kỳ thi</label>
        <input type="text" name="title" class="form-control" value="{{ exam.title }}" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3">{{ exam.description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Khóa học</label>
        <select name="course_id" class="form-select" required>
          {% for course in courses %}
            <option value="{{ course.id }}"
              {% if course.id == exam.course_id %}selected{% endif %}>
              {{ course.course_name }}
            </option>
          {% endfor %}
        </select>
      </div>


      <!-- =============================
           CẤU HÌNH KỲ THI
      ============================== -->
      <h5 class="section-title text-primary">
        <i class="bi bi-gear"></i> Cấu hình kỳ thi
      </h5>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">⏱ Thời gian làm bài (phút)</label>
          <input type="number" name="time_limit_minutes" class="form-control"
                 value="{{ exam.time_limit_minutes }}" min="1" required />
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">🔁 Số lần làm bài tối đa</label>
          <input type="number" name="max_attempts" class="form-control"
                 value="{{ exam.max_attempts }}" min="1" required />
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">📊 Điểm qua môn (%)</label>
          <input type="number" name="passing_score" class="form-control"
                 value="{{ exam.passing_score }}" min="1" max="100" required />
        </div>
      </div>


      <!-- =============================
           THỜI GIAN MỞ / ĐÓNG
      ============================== -->
      <h5 class="section-title text-primary">
        <i class="bi bi-calendar-event"></i> Thời gian mở / đóng
      </h5>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Mở từ</label>
          <input type="datetime-local" 
                 name="available_from"
                 class="form-control"
                 value="{{ exam.available_from | replace(' ', 'T') if exam.available_from }}"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Đóng lúc</label>
          <input type="datetime-local"
                 name="available_to"
                 class="form-control"
                 value="{{ exam.available_to | replace(' ', 'T') if exam.available_to }}"
          />
        </div>
      </div>


      <!-- =============================
           TUỲ CHỌN HIỂN THỊ
      ============================== -->
      <h5 class="section-title text-primary">
        <i class="bi bi-sliders"></i> Tùy chọn hiển thị
      </h5>

      <div class="row mb-4">
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
              name="randomize_questions" value="1"
              {% if exam.randomize_questions %}checked{% endif %} />
            <label class="form-check-label">Xáo trộn câu hỏi</label>
          </div>
        </div>

        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
              name="randomize_options" value="1"
              {% if exam.randomize_options %}checked{% endif %} />
            <label class="form-check-label">Xáo trộn đáp án</label>
          </div>
        </div>

        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
              name="show_correct_answers" value="1"
              {% if exam.show_correct_answers %}checked{% endif %} />
            <label class="form-check-label">Hiển thị đáp án đúng</label>
          </div>
        </div>
      </div>


      <!-- =============================
           BUTTON
      ============================== -->
      <div class="d-flex justify-content-between">
        <a href="/admin/exams/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-warning px-4">
          <i class="bi bi-save"></i> Cập nhật
        </button>
      </div>

    </form>
  </div>

</body>

</html>
