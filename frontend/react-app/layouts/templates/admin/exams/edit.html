<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✏️ Chỉnh sửa kỳ thi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="fw-bold text-warning mb-4"><i class="bi bi-pencil"></i> Chỉnh sửa kỳ thi</h2>

    <form action="/admin/exams/edit/{{ exam.id }}" method="post" class="bg-white p-4 rounded shadow-sm">
      <div class="mb-3">
        <label class="form-label">Tên kỳ thi</label>
        <input type="text" name="title" class="form-control" value="{{ exam.title }}" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea name="description" class="form-control" rows="3">{{ exam.description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Tổng số câu hỏi</label>
        <input type="number" name="total_questions" class="form-control" min="1" value="{{ exam.total_questions }}" required />
      </div>

      <div class="d-flex justify-content-between">
        <a href="/admin/exams/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-warning">
          <i class="bi bi-save"></i> Cập nhật
        </button>
      </div>
    </form>
  </div>
</body>
</html>
