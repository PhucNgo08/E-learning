{% extends "layout_admin.html" %}
{% block title %}✏️ Chỉnh sửa kỳ thi{% endblock %}

{% block content %}
<div class="container py-5 fade-in">

  <!-- TITLE -->
  <h2 class="fw-bold mb-3 edit-title">
    <i class="bi bi-pencil-square"></i> Chỉnh sửa kỳ thi
  </h2>

  <!-- QUICK ACTION BUTTONS -->
  <div class="d-flex flex-wrap gap-2 mb-4">

    <a href="/admin/exams/{{ exam.id }}/questions"
       class="btn btn-primary shadow-sm">
      <i class="bi bi-list-check"></i> Quản lý câu hỏi
    </a>

 

 

  </div>

  <!-- ====================================================
       FORM CHỈNH SỬA KỲ THI
  ==================================================== -->
  <form action="/admin/exams/{{ exam.id }}/edit" method="post" class="form-box">

    <!-- =============================
         THÔNG TIN CHUNG
    ============================== -->
    <h5 class="section-title">
      <i class="bi bi-info-circle"></i> Thông tin chung
    </h5>

    <div class="mb-3">
      <label class="form-label fw-semibold">Tên kỳ thi</label>
      <input type="text" name="title" class="form-control"
             value="{{ exam.title }}" required />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Mô tả</label>
      <textarea name="description" class="form-control" rows="3">{{ exam.description }}</textarea>
    </div>

    <!-- KHÓA HỌC -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Khóa học</label>
      <select class="form-select" disabled>
        {% for course in courses %}
          <option value="{{ course.id }}" {% if course.id == exam.course_id %} selected {% endif %}>
            {{ course.course_name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Tổng câu hỏi -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        Tổng số câu hỏi
        <span class="text-muted">(tự cập nhật sau khi import)</span>
      </label>
      <input type="number" name="total_questions" class="form-control"
             min="1" value="{{ exam.total_questions }}" required />
    </div>

    <!-- =============================
         CẤU HÌNH KỲ THI
    ============================== -->
    <h5 class="section-title">
      <i class="bi bi-gear"></i> Cấu hình kỳ thi
    </h5>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">⏱ Thời gian làm bài (phút)</label>
        <input type="number" name="time_limit" class="form-control"
               min="1" value="{{ exam.time_limit_minutes }}" required />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">🔁 Số lần làm bài</label>
        <input type="number" name="max_attempts" class="form-control"
               min="1" value="{{ exam.max_attempts }}" required />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">📊 Điểm qua môn (%)</label>
        <input type="number" name="passing_score" class="form-control"
               min="0" max="100" value="{{ exam.passing_score }}" required />
      </div>
    </div>

    <!-- =============================
         THỜI GIAN MỞ / ĐÓNG
    ============================== -->
    <h5 class="section-title">
      <i class="bi bi-calendar-event"></i> Thời gian mở / đóng
    </h5>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Mở từ</label>
        <input type="datetime-local" name="available_from" class="form-control"
               value="{% if exam.available_from %}{{ exam.available_from.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Đóng lúc</label>
        <input type="datetime-local" name="available_to" class="form-control"
               value="{% if exam.available_to %}{{ exam.available_to.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="/admin/exams/manage" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
      </a>

      <button type="submit" class="btn btn-warning px-4 fw-semibold">
        <i class="bi bi-save"></i> Cập nhật
      </button>
    </div>

  </form>

  <!-- ====================================================
       DANH SÁCH CÂU HỎI
  ==================================================== -->
</div>
<style>
  body { background: #f3f4f7; }

  .edit-title {
    background: linear-gradient(135deg, #f59f00, #d9480f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .form-box {
    background: #ffffff;
    padding: 2rem;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    animation: fadeInUp .45s ease;
  }

  .section-title {
    font-weight: 700;
    padding-bottom: .5rem;
    margin-top: 1.8rem;
    margin-bottom: .8rem;
    border-bottom: 2px solid #e3e3e3;
  }

  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
</style>

{% endblock %}
