{% extends "layout_admin.html" %}
{% block title %}⚠️ User chưa có ví{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="card shadow-sm border-0 p-4 text-center" style="max-width: 520px; margin: auto;">
    <h3 class="fw-bold text-danger mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      Người dùng chưa có ví
    </h3>

    <p class="text-muted">
      Tài khoản này hiện chưa có ví điện tử trong hệ thống.
    </p>

    <div class="mt-4">
      <!-- Nút tạo ví -->
      <form action="/admin/wallets/create" method="post">
        <input type="hidden" name="user_id" value="{{ user_id }}">

        <button class="btn btn-primary px-4 py-2 rounded-pill">
          <i class="bi bi-wallet2 me-1"></i> Tạo ví ngay
        </button>
      </form>

      <!-- Nút quay lại -->
      <a href="/admin/wallets/manage" class="btn btn-outline-secondary mt-3 rounded-pill">
        <i class="bi bi-arrow-left"></i> Quay lại quản lý ví
      </a>
    </div>

  </div>

</div>
{% endblock %}
