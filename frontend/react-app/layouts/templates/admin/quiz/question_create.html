{% extends "layout_admin.html" %}
{% block title %}➕ Thêm câu hỏi{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-primary mb-0">➕ Thêm câu hỏi — {{ quiz.title }}</h3>
    <a href="/admin/quiz/detail/{{ quiz.id }}" class="btn btn-outline-secondary">← Chi tiết</a>
  </div>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="post" action="/admin/quiz/{{ quiz.id }}/question/create">
        <div class="mb-3"><label class="form-label fw-semibold">Nội dung câu hỏi</label><textarea name="question_text" class="form-control" rows="3" required></textarea></div>
        <div class="row g-3">
          <div class="col-md-6"><label>A</label><input name="option_a" class="form-control" required></div>
          <div class="col-md-6"><label>B</label><input name="option_b" class="form-control" required></div>
          <div class="col-md-6"><label>C</label><input name="option_c" class="form-control" required></div>
          <div class="col-md-6"><label>D</label><input name="option_d" class="form-control" required></div>
          <div class="col-md-3"><label>Đáp án đúng</label><select name="correct" class="form-select"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>
          <div class="col-md-3"><label>Điểm</label><input type="number" name="points" step="0.1" min="0" value="1" class="form-control"></div>
          <div class="col-md-6"><label>Giải thích</label><input name="explanation" class="form-control"></div>
        </div>
        <div class="text-end mt-4"><button class="btn btn-success px-4">Lưu câu hỏi</button></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
