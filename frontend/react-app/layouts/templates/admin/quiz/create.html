{% extends "layout_admin.html" %}
{% block title %}➕ Tạo Quiz{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-primary mb-0">➕ Tạo Quiz / Bài thi</h3>
    <a href="/admin/quiz/list" class="btn btn-outline-secondary">← Danh sách</a>
  </div>

  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="post" action="/admin/quiz/create">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold">Tiêu đề</label>
            <input name="title" class="form-control" value="{{ form_data.title if form_data else '' }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Khóa học</label>
            <select name="course_id" class="form-select" required>
              <option value="">-- Chọn khóa học --</option>
              {% for c in courses %}
                <option value="{{ c.id }}" {% if form_data and form_data.course_id == c.id %}selected{% endif %}>{{ c.course_code }} - {{ c.course_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Mô tả</label>
            <textarea name="description" rows="3" class="form-control">{{ form_data.description if form_data else '' }}</textarea>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Loại</label>
            <select name="quiz_type" class="form-select">
              <option value="practice">Practice</option>
              <option value="graded">Graded / Bài thi</option>
              <option value="survey">Survey</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Độ khó</label>
            <select name="difficulty_level" class="form-select">
              <option value="easy">Dễ</option>
              <option value="medium" selected>Trung bình</option>
              <option value="hard">Khó</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Trạng thái</label>
            <select name="status" class="form-select">
              <option value="published" selected>Published</option>
              <option value="draft">Draft</option>
              <option value="pending">Pending</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Điểm đạt (%)</label>
            <input type="number" name="passing_score" min="0" max="100" step="0.1" value="60" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Thời lượng phút</label>
            <input type="number" name="time_limit_minutes" min="0" value="30" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Số lần làm tối đa</label>
            <input type="number" name="max_attempts" min="1" value="1" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Mở từ</label>
            <input type="datetime-local" name="available_from" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Đóng lúc</label>
            <input type="datetime-local" name="available_to" class="form-control">
          </div>
        </div>
        <div class="text-end mt-4">
          <button class="btn btn-primary px-4">Lưu Quiz</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
