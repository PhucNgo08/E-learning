<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>✏️ Chỉnh sửa năm học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 rounded shadow-sm">
  <h4 class="mb-4 text-center">✏️ Cập nhật năm học</h4>

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Mã năm học</label>
      <input type="text" name="year_code" class="form-control" value="{{ year.year_code }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Tên năm học</label>
      <input type="text" name="year_name" class="form-control" value="{{ year.year_name }}" required>
    </div>
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Bắt đầu</label>
        <input type="number" name="start_year" class="form-control" value="{{ year.start_year }}">
      </div>
      <div class="col">
        <label class="form-label">Kết thúc</label>
        <input type="number" name="end_year" class="form-control" value="{{ year.end_year }}">
      </div>
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
             {% if year.is_active %}checked{% endif %}>
      <label class="form-check-label" for="isActive">Kích hoạt</label>
    </div>
    <button type="submit" class="btn btn-success">Cập nhật</button>
    <a href="/admin/academic_years/list" class="btn btn-secondary">Hủy</a>
  </form>
</div>
</body>
</html>
