{% extends "layout_admin.html" %}
{% block title %}✏️ Chỉnh sửa năm học{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #eef2f7, #e3edff);
    font-family: "Segoe UI", "Inter", sans-serif;
    color: #333;
  }
  .edit-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    padding: 35px;
    max-width: 700px;
    margin: 40px auto;
  }
  .edit-header {
    background: linear-gradient(90deg, #0066ff, #0048b5);
    color: white;
    border-radius: 10px;
    padding: 18px 25px;
    margin-bottom: 25px;
    text-align: center;
    font-weight: 600;
  }
  .btn {
    border-radius: 8px;
    font-weight: 500;
    transition: 0.2s;
  }
  .btn:hover { transform: translateY(-1px); }
  footer {
    text-align: center;
    color: #6c757d;
    font-size: 0.9rem;
    margin-top: 40px;
  }
</style>

<div class="container py-4">
  <div class="edit-header">
    ✏️ Cập nhật năm học
  </div>

  <div class="edit-card">
    {% if error %}
    <div class="alert alert-danger text-center mb-3">
      <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/academic_years/edit/{{ year.id }}">
      <div class="mb-3">
        <label class="form-label">Mã năm học</label>
        <input type="text" name="year_code" class="form-control" value="{{ year.year_code }}" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Tên năm học</label>
        <input type="text" name="year_name" class="form-control" value="{{ year.year_name }}" required />
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Bắt đầu</label>
          <input type="number" name="start_year" class="form-control" value="{{ year.start_year }}" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Kết thúc</label>
          <input type="number" name="end_year" class="form-control" value="{{ year.end_year }}" required />
        </div>
      </div>

      <div class="form-check mb-4">
        <input
          type="checkbox"
          name="is_active"
          class="form-check-input"
          id="isActive"
          {% if year.is_active %}checked{% endif %}
        />
        <label class="form-check-label" for="isActive">Kích hoạt (Hoạt động)</label>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/admin/academic_years/list" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save"></i> Cập nhật
        </button>
      </div>
    </form>
  </div>

  <footer>
    <p>© {{ current_year if current_year else "2025" }} E-Learning — Chỉnh sửa năm học</p>
  </footer>
</div>
{% endblock %}
