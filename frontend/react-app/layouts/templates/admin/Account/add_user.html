<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f3f6fd;
      font-family: "Inter", sans-serif;
    }
    .page-header {
      background: linear-gradient(135deg, #0061ff, #60efff);
      color: white;
      border-radius: 12px;
      padding: 25px 30px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      margin-bottom: 30px;
    }
    .form-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      padding: 25px;
      max-width: 800px;
      margin: auto;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="page-header d-flex justify-content-between align-items-center flex-wrap">
    <div>
      <h3 class="fw-bold mb-1"><i class="bi bi-person-plus-fill"></i> Thêm người dùng mới</h3>
      <p class="mb-0">Tạo tài khoản cho giáo viên, sinh viên hoặc quản trị viên.</p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a href="/admin/dashboard" class="btn btn-light">
        <i class="bi bi-house-door"></i> Trang chính
      </a>
      <a href="/admin/Account/manage-users" class="btn btn-outline-light">
        <i class="bi bi-people"></i> Danh sách người dùng
      </a>
    </div>
  </div>

  <div class="form-card">
    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/Account/add-user">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Tên đăng nhập</label>
          <input type="text" name="username" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Mật khẩu</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Họ và tên</label>
          <input type="text" name="full_name" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Vai trò</label>
          <select name="role" class="form-select" required>
            <option value="student">Sinh viên</option>
            <option value="teacher">Giáo viên</option>
            <option value="teaching_assistant">Trợ giảng</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Năm học</label>
          <select name="academic_year_id" class="form-select">
            <option value="">-- Chọn năm học --</option>
            {% for year in academic_years %}
              <option value="{{ year.id }}">{{ year.year_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Ngành học</label>
          <select name="major_id" class="form-select">
            <option value="">-- Chọn ngành học --</option>
            {% for major in majors %}
              <option value="{{ major.id }}">{{ major.major_name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between">
        <a href="/admin/Account/manage-users" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle"></i> Lưu người dùng
        </button>
      </div>
    </form>
  </div>

  <footer>
    <p>© {{ current_year }} Hệ thống E-Learning — Thêm người dùng</p>
  </footer>
</div>

</body>
</html>
