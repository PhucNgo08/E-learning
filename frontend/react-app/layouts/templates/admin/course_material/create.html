<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm tài liệu mới</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <h4 class="text-primary mb-4">
      <i class="bi bi-upload"></i> Thêm tài liệu mới
    </h4>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4 rounded-4 bg-white">
      <!-- Tiêu đề -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tiêu đề tài liệu</label>
        <input type="text" name="title" class="form-control" placeholder="Nhập tiêu đề tài liệu..." required>
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Mô tả</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Mô tả ngắn gọn..."></textarea>
      </div>

      <!-- Dropdown chọn khóa học -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Chọn khóa học</label>
        <select name="course_id" class="form-select" required>
          <option value="">-- Chọn khóa học --</option>
          {% for course in courses %}
            <option value="{{ course.id }}">{{ course.course_name }}</option>
          {% endfor %}
        </select>
        {% if courses|length == 0 %}
          <div class="text-muted small mt-2">
            ⚠️ Chưa có khóa học nào. Hãy tạo trước tại
            <a href="/admin/Course/manage">Quản lý khóa học</a>.
          </div>
        {% endif %}
      </div>

      <!-- Upload file -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tệp tài liệu</label>
        <input type="file" name="file" class="form-control" accept=".pdf,.docx,.pptx,.zip,.rar,.txt" required>
      </div>

      <!-- Nút hành động -->
      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/course-material/list" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-cloud-arrow-up"></i> Tải lên
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
