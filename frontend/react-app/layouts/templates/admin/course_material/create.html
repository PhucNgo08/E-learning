<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Thêm tài liệu mới</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .file-hint { font-size: 0.85rem; color: #6c757d; }
    .file-list-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      display: none;
    }
    .file-item {
      padding: 6px 0;
      border-bottom: 1px solid #e9ecef;
      display:flex;
      align-items:center;
      justify-content: space-between;
    }
    .file-item:last-child { border-bottom: none; }
    .file-name { display:flex; align-items:center; gap:6px; }
    .file-size { font-size: 0.85rem; color:#555; }
  </style>
</head>

<body class="bg-light">

  <div class="container py-5">

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <i class="bi bi-upload"></i> Thêm tài liệu mới
      </div>
      <div class="card-body">

        {% if error %}
        <div class="alert alert-danger">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- FORM -->
        <form method="post" enctype="multipart/form-data">

          <!-- Tiêu đề -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Tiêu đề tài liệu</label>
            <input type="text" name="title" class="form-control" required>
          </div>

          <!-- Mô tả -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Mô tả</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>

          <!-- Khóa học -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Thuộc khóa học</label>
            <select name="course_id" class="form-select" required>
              <option value="">-- Chọn khóa học --</option>
              {% for course in courses %}
              <option value="{{ course.id }}">{{ course.course_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Upload MULTIPLE FILE -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Chọn tệp tài liệu (có thể chọn nhiều)</label>

            <input type="file"
                   id="fileInput"
                   name="files"
                   class="form-control"
                   multiple
                   accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.rar,.txt,.xlsx,.xls,.csv,.png,.jpg,.jpeg,.mp4"
                   required>

            <div class="file-hint mt-2">
              <i class="bi bi-info-circle"></i>
              Hỗ trợ: PDF, DOCX, PPTX, ZIP, RAR, TXT, PNG, JPG, MP4  
              <br>
              Dung lượng tối đa: <b>100MB mỗi file</b>
            </div>

            <!-- Preview danh sách file -->
            <div id="fileList" class="file-list-box mt-3"></div>
          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-between mt-4">
            <a href="/admin/course-material/list" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i> Quay lại
            </a>

            <button type="submit" class="btn btn-primary">
              <i class="bi bi-cloud-arrow-up"></i> Tải lên tài liệu
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- JS: Multiple file preview + icon mapping -->
  <script>
    const iconMap = {
      pdf: "bi-file-earmark-pdf text-danger",
      doc: "bi-file-earmark-word text-primary",
      docx: "bi-file-earmark-word text-primary",
      ppt: "bi-file-earmark-ppt text-warning",
      pptx: "bi-file-earmark-ppt text-warning",
      xls: "bi-file-earmark-spreadsheet text-success",
      xlsx: "bi-file-earmark-spreadsheet text-success",
      csv: "bi-file-earmark-spreadsheet text-success",
      zip: "bi-file-earmark-zip text-dark",
      rar: "bi-archive text-dark",
      txt: "bi-file-earmark-text text-secondary",
      jpg: "bi-file-earmark-image text-info",
      jpeg: "bi-file-earmark-image text-info",
      png: "bi-file-earmark-image text-info",
      mp4: "bi-file-earmark-play text-dark"
    };

    document.getElementById("fileInput").addEventListener("change", function () {
      const fileListBox = document.getElementById("fileList");
      fileListBox.innerHTML = "";
      const files = Array.from(this.files);

      if (files.length === 0) {
        fileListBox.style.display = "none";
        return;
      }

      let tooLarge = false;

      files.forEach(f => {
        if (f.size > 100 * 1024 * 1024) tooLarge = true;

        const ext = f.name.split(".").pop().toLowerCase();
        const icon = iconMap[ext] || "bi-file-earmark";

        const sizeMB = (f.size / (1024 * 1024)).toFixed(2);

        const item = document.createElement("div");
        item.classList.add("file-item");

        item.innerHTML = `
          <div class="file-name">
            <i class="bi ${icon}"></i>
            ${f.name}
          </div>
          <span class="file-size">${sizeMB} MB</span>
        `;

        fileListBox.appendChild(item);
      });

      if (tooLarge) {
        alert("❌ Một hoặc nhiều file vượt quá dung lượng tối đa 100MB!");
        this.value = "";
        fileListBox.style.display = "none";
        fileListBox.innerHTML = "";
        return;
      }

      fileListBox.style.display = "block";
    });
  </script>

</body>
</html>
