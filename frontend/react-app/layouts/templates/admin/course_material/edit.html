<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ Chỉnh sửa tài liệu</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <h4 class="text-primary mb-4">
      <i class="bi bi-pencil-square"></i> Chỉnh sửa tài liệu
    </h4>

    <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4 rounded-4 bg-white">

      <!-- Tiêu đề -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tiêu đề</label>
        <input type="text" name="title" class="form-control" value="{{ material.title }}" required>
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Mô tả</label>
        <textarea name="description" class="form-control" rows="4">{{ material.description }}</textarea>
      </div>

      <!-- Chọn khóa học -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Khóa học</label>
        <select name="course_id" class="form-select" disabled>
          {% for c in courses %}
            <option value="{{ c.id }}" {% if material.course_id == c.id %}selected{% endif %}>
              {{ c.course_name }}
            </option>
          {% endfor %}
        </select>
        <div class="form-text text-muted">⚠️ Không thể thay đổi khóa học sau khi tài liệu đã được tạo.</div>
      </div>

      <!-- File hiện tại -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tập tin hiện tại</label><br>
        {% if material.file_url %}
          <a href="{{ material.file_url }}" target="_blank" class="text-decoration-none">
            <i class="bi bi-file-earmark-text"></i> {{ material.file_name }}
          </a>
        {% else %}
          <span class="text-muted">Chưa có tệp nào</span>
        {% endif %}
      </div>

      <!-- Upload tệp mới -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Tệp mới (nếu thay thế)</label>
        <input type="file" name="file" class="form-control" accept=".pdf,.docx,.pptx,.zip,.rar,.txt">
      </div>

      <!-- Nút hành động -->
      <div class="d-flex justify-content-between mt-4">
        <a href="/admin/course-material/list" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-save"></i> Cập nhật
        </button>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
