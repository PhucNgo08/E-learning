<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗑️ Xóa ghi danh</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #fff3f3;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      padding: 2rem;
    }
    h3 {
      font-weight: 700;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card text-center" style="max-width:600px;width:100%;">

    <h3 class="text-danger mb-3">⚠️ Xác nhận xóa ghi danh</h3>

    <p class="fs-5">
      Bạn có chắc chắn muốn xóa ghi danh của học viên:<br>
      <strong>{{ enrollment.user.full_name if enrollment.user else "Không rõ" }}</strong>
      <br>khỏi lớp:<br>
      <strong>{{ enrollment.clazz.class_name if enrollment.clazz else "Không rõ" }}</strong>?
    </p>

    <form method="post" action="/admin/enrollments/delete/{{ enrollment.id }}" class="mt-4">

      <a href="/admin/enrollments/manage" class="btn btn-secondary px-4 me-3">
        <i class="bi bi-arrow-left-circle"></i> Hủy bỏ
      </a>

      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash"></i> Xóa ghi danh
      </button>

    </form>

  </div>

</body>
</html>
