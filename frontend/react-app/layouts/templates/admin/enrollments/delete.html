<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗑️ Xóa ghi danh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #fef7f7;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .card {
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    .btn-danger {
      padding: 10px 20px;
      font-weight: 500;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card p-4" style="max-width:550px;width:100%;">
    <h3 class="text-center text-danger mb-4">⚠️ Xác nhận xóa ghi danh</h3>

    <p class="text-center fs-5">
      Bạn có chắc chắn muốn xóa ghi danh của học viên 
      <strong>{{ enrollment.user.full_name if enrollment.user else 'Không rõ' }}</strong><br>
      khỏi lớp <strong>{{ enrollment.class_.class_name if enrollment.class_ else 'Không rõ' }}</strong> không?
    </p>

    <form method="post" action="/admin/enrollments/delete/{{ enrollment.id }}" class="text-center mt-4">
      <a href="/admin/enrollments/manage" class="btn btn-secondary me-3">
        <i class="bi bi-arrow-left-circle"></i> Hủy bỏ
      </a>
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i> Xóa ghi danh
      </button>
    </form>
  </div>

</body>
</html>
