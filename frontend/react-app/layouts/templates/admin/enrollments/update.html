{% extends "layout_admin.html" %}
{% block title %}✏️ Cập nhật ghi danh{% endblock %}
{% block content %}
<style>
  .enrollment-page{--enr-primary:#2563eb;--enr-text:#0f172a;--enr-muted:#64748b;--enr-line:#e2e8f0;--enr-card:rgba(255,255,255,.96);--enr-shadow:0 18px 45px rgba(15,23,42,.09);color:var(--enr-text)}
  .enrollment-page.enrollment-page-narrow{max-width:820px;margin:0 auto}.enrollment-page .enr-hero,.enrollment-page .enr-card{border:1px solid var(--enr-line);background:var(--enr-card);box-shadow:var(--enr-shadow);border-radius:24px}.enrollment-page .enr-hero{padding:24px;margin-bottom:18px;position:relative;overflow:hidden}.enrollment-page .enr-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left,rgba(37,99,235,.14),transparent 34%),radial-gradient(circle at bottom right,rgba(22,163,74,.12),transparent 36%);pointer-events:none}.enrollment-page .enr-hero>*{position:relative;z-index:1}.enrollment-page .enr-title{color:var(--enr-primary);font-weight:850;margin:0;letter-spacing:-.02em}.enrollment-page .enr-subtitle,.enrollment-page .text-muted,.enrollment-page .mini-muted{color:var(--enr-muted)!important}.enrollment-page .enr-card{padding:22px}.enrollment-page .form-control,.enrollment-page .form-select{border-radius:14px;border-color:var(--enr-line);color:var(--enr-text);background-color:#fff}.enrollment-page .form-control:focus,.enrollment-page .form-select:focus{border-color:#93c5fd;box-shadow:0 0 0 .22rem rgba(37,99,235,.14)}.enrollment-page .btn{border-radius:13px;font-weight:700}.enrollment-page .enr-table{color:var(--enr-text);--bs-table-color:var(--enr-text);--bs-table-border-color:var(--enr-line);--bs-table-hover-bg:rgba(37,99,235,.06)}.enrollment-page .enr-table thead th{background:#eaf1ff!important;color:#1e40af!important;font-weight:800;white-space:nowrap;vertical-align:middle}.enrollment-page .enr-table tbody td{color:var(--enr-text);vertical-align:middle}.enrollment-page .badge-status{border-radius:999px;padding:7px 11px;font-weight:750}.enrollment-page .enr-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.enrollment-page .enr-danger-box{border-radius:20px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.20);padding:18px}
  body.dark-mode .enrollment-page,html[data-bs-theme="dark"] .enrollment-page,body[data-theme="dark"] .enrollment-page{--enr-text:#e5e7eb;--enr-muted:#cbd5e1;--enr-line:rgba(148,163,184,.25);--enr-card:rgba(15,23,42,.92);--enr-shadow:0 18px 45px rgba(0,0,0,.38)}body.dark-mode .enrollment-page .enr-title,html[data-bs-theme="dark"] .enrollment-page .enr-title,body[data-theme="dark"] .enrollment-page .enr-title{color:#93c5fd}body.dark-mode .enrollment-page .form-control,body.dark-mode .enrollment-page .form-select,html[data-bs-theme="dark"] .enrollment-page .form-control,html[data-bs-theme="dark"] .enrollment-page .form-select,body[data-theme="dark"] .enrollment-page .form-control,body[data-theme="dark"] .enrollment-page .form-select{background:rgba(15,23,42,.98);border-color:rgba(148,163,184,.32);color:#e5e7eb}body.dark-mode .enrollment-page .enr-table thead th,html[data-bs-theme="dark"] .enrollment-page .enr-table thead th,body[data-theme="dark"] .enrollment-page .enr-table thead th{background:rgba(30,64,175,.38)!important;color:#dbeafe!important;border-color:rgba(147,197,253,.25)}body.dark-mode .enrollment-page .enr-table tbody td,html[data-bs-theme="dark"] .enrollment-page .enr-table tbody td,body[data-theme="dark"] .enrollment-page .enr-table tbody td{background:rgba(15,23,42,.34)!important;color:#e5e7eb;border-color:rgba(148,163,184,.22)}body.dark-mode .enrollment-page .enr-table.table-hover tbody tr:hover td,html[data-bs-theme="dark"] .enrollment-page .enr-table.table-hover tbody tr:hover td,body[data-theme="dark"] .enrollment-page .enr-table.table-hover tbody tr:hover td{background:rgba(30,41,59,.78)!important}
  @media(max-width:768px){.enrollment-page .enr-hero,.enrollment-page .enr-card{padding:18px;border-radius:20px}.enrollment-page .enr-actions,.enrollment-page .enr-actions .btn{width:100%}.enrollment-page .responsive-table thead{display:none}.enrollment-page .responsive-table tbody,.enrollment-page .responsive-table tr,.enrollment-page .responsive-table td{display:block;width:100%}.enrollment-page .responsive-table tr{border-bottom:1px solid var(--enr-line);padding:10px}.enrollment-page .responsive-table td{border:0!important;padding:7px 4px!important}.enrollment-page .responsive-table td:before{content:attr(data-label);display:block;font-weight:850;color:var(--enr-muted);margin-bottom:2px}}
</style>
<div class="enrollment-page enrollment-page-narrow px-2 px-md-4 py-3 py-md-4"><div class="enr-hero text-center"><h3 class="enr-title"><i class="bi bi-pencil-square me-2"></i>Cập nhật thông tin ghi danh</h3><p class="enr-subtitle mb-0 mt-2">Điều chỉnh trạng thái học tập của sinh viên trong lớp.</p></div><div class="enr-card">{% if error %}<div class="alert alert-danger rounded-4">{{ error }}</div>{% endif %}<form method="post" action="/admin/enrollments/update/{{ enrollment.id }}"><div class="mb-3"><label class="form-label fw-semibold">Sinh viên</label><input type="text" class="form-control" value="{{ student_name if student_name else (get_user_display_name(enrollment.student) if get_user_display_name is defined else 'Không rõ') }}" readonly></div><div class="mb-3"><label class="form-label fw-semibold">Lớp học</label><input type="text" class="form-control" value="{{ enrollment.clazz.class_name if enrollment.clazz else 'Không rõ lớp học' }}" readonly></div><div class="mb-3"><label class="form-label fw-semibold">Loại ghi danh</label><input type="text" class="form-control" value="{{ vi_enrollment_type(enrollment.enrollment_type) if vi_enrollment_type is defined else (enrollment.enrollment_type or '—') }}" readonly></div><div class="mb-3"><label class="form-label fw-semibold">Trạng thái hiện tại</label><input type="text" class="form-control" value="{{ vi_enrollment_status(enrollment.enrollment_status) if vi_enrollment_status is defined else (enrollment.enrollment_status or '—') }}" readonly></div><div class="mb-3"><label class="form-label fw-semibold" for="new_status">Cập nhật trạng thái</label><select id="new_status" name="new_status" class="form-select" required><option value="">Chọn trạng thái</option><option value="applied" {% if enrollment.enrollment_status == 'applied' %}selected{% endif %}>Chờ duyệt</option><option value="approved" {% if enrollment.enrollment_status == 'approved' %}selected{% endif %}>Đã duyệt</option><option value="active" {% if enrollment.enrollment_status == 'active' %}selected{% endif %}>Đang học</option><option value="completed" {% if enrollment.enrollment_status == 'completed' %}selected{% endif %}>Đã hoàn thành</option><option value="cancelled" {% if enrollment.enrollment_status == 'cancelled' %}selected{% endif %}>Đã hủy</option><option value="rejected" {% if enrollment.enrollment_status == 'rejected' %}selected{% endif %}>Đã từ chối</option><option value="removed" {% if enrollment.enrollment_status == 'removed' %}selected{% endif %}>Đã xóa khỏi lớp</option></select></div><div class="enr-actions mt-4"><a href="/admin/enrollments/manage" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left-circle me-1"></i>Quay lại</a><button type="submit" class="btn btn-primary px-4"><i class="bi bi-save2 me-1"></i>Lưu thay đổi</button></div></form></div></div>
{% endblock %}
