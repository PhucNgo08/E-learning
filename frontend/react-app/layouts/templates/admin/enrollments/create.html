{% extends "layout_admin.html" %}
{% block title %}➕ Ghi danh học viên{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #e8f0ff, #d9e5ff);
    font-family: "Inter", "Segoe UI", sans-serif;
  }
  .card {
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 2rem;
    backdrop-filter: blur(6px);
  }
  h3 {
    font-weight: 700;
    color: #0d47a1;
  }
  .search-box {
    border-radius: 10px;
    padding: 8px 14px;
    border: 1px solid #c5d3f5;
    margin-bottom: 8px;
  }
</style>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card" style="max-width:750px;width:100%;">
    <div class="text-center mb-4">
      <h3>➕ Ghi danh học viên vào lớp</h3>
      <p class="text-muted">Chọn học viên và lớp học cần ghi danh.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/enrollments/create">
      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Tìm kiếm học viên</label>
        <input type="text" id="studentSearch" class="search-box form-control" placeholder="Nhập tên, MSSV hoặc email...">

        <select name="user_id" id="studentSelect" class="form-select" required size="5">
          {% for u in students %}
          <option value="{{ u.id }}" {% if form_data and form_data.user_id == u.id %}selected{% endif %}>
            {{ u.full_name }}
            {% if u.mssv %} ({{ u.mssv }}) {% endif %}
            – {{ u.email }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">🏫 Tìm kiếm lớp học</label>
        <input type="text" id="classSearch" class="search-box form-control" placeholder="Nhập tên lớp hoặc mã lớp...">

        <select name="class_id" id="classSelect" class="form-select" required size="6">
          {% for c in classes %}
          <option
            value="{{ c.id }}"
            data-search="{{ c.class_name }} {{ c.class_code }}"
            {% if form_data and form_data.class_id == c.id %}selected{% endif %}
            {% if (c.current_students or 0) >= (c.max_students or 0) %}disabled{% endif %}
          >
            {{ c.class_name }} ({{ c.class_code }})
            – {{ c.current_students or 0 }}/{{ c.max_students or 0 }}
            {% if (c.current_students or 0) >= (c.max_students or 0) %}
              🔒 [Đã đầy]
            {% else %}
              🟢 [Còn chỗ]
            {% endif %}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📝 Loại ghi danh</label>
        <select name="enrollment_type" class="form-select">
          <option value="official" {% if not form_data or form_data.enrollment_type == 'official' %}selected{% endif %}>Chính thức</option>
          <option value="elective" {% if form_data and form_data.enrollment_type == 'elective' %}selected{% endif %}>Tự chọn</option>
          <option value="audit" {% if form_data and form_data.enrollment_type == 'audit' %}selected{% endif %}>Dự thính</option>
          <option value="temporary" {% if form_data and form_data.enrollment_type == 'temporary' %}selected{% endif %}>Tạm thời</option>
        </select>
      </div>

      <div class="text-end mt-4">
        <a href="/admin/enrollments/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-success">
          <i class="bi bi-save2"></i> Ghi danh
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById("studentSearch").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    const options = document.querySelectorAll("#studentSelect option");
    options.forEach(o => {
      o.style.display = o.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });

  document.getElementById("classSearch").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    const options = document.querySelectorAll("#classSelect option");
    options.forEach(o => {
      const searchable = (o.getAttribute("data-search") || "").toLowerCase();
      o.style.display = searchable.includes(q) ? "" : "none";
    });
  });
</script>
{% endblock %}
