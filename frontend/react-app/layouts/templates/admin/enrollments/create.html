<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Ghi danh học viên</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e8f0ff, #d9e5ff);
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .card {
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 2rem;
      backdrop-filter: blur(6px);
    }
    h3 {
      font-weight: 700;
      color: #0d47a1;
    }
    .search-box {
      border-radius: 10px;
      padding: 8px 14px;
      border: 1px solid #c5d3f5;
      margin-bottom: 8px;
    }
    .form-select:hover {
      cursor: pointer;
    }
    .badge-small {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card" style="max-width:750px;width:100%;">

    <div class="text-center mb-4">
      <h3>➕ Ghi danh học viên vào lớp</h3>
      <p class="text-muted">Chọn học viên và lớp học cần ghi danh.</p>
    </div>

    <form method="post" action="/admin/enrollments/create">

      <!-- ========================== -->
      <!-- 1) Học viên -->
      <!-- ========================== -->
      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Tìm kiếm học viên</label>
        <input type="text" id="studentSearch" class="search-box" placeholder="Nhập tên, MSSV hoặc email...">

        <select name="user_id" id="studentSelect" class="form-select" required size="5">
          {% for u in students %}
          <option value="{{ u.id }}">
            {{ u.full_name }} 
            {% if u.mssv %} ({{ u.mssv }}) {% endif %}
            – {{ u.email }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- ========================== -->
      <!-- 2) Lớp học -->
      <!-- ========================== -->
      <div class="mb-3">
        <label class="form-label fw-semibold">🏫 Tìm kiếm lớp học</label>
        <input type="text" id="classSearch" class="search-box" placeholder="Nhập tên lớp hoặc mã lớp...">

        <select name="class_id" id="classSelect" class="form-select" required size="6">
          {% for c in classes %}
          <option value="{{ c.id }}"
            data-search="{{ c.class_name }} {{ c.class_code }}"
            {% if c.current_students >= c.max_students %} disabled {% endif %}
          >
            {{ c.class_name }} ({{ c.class_code }})
            – {{ c.current_students }}/{{ c.max_students }}

            {% if c.current_students >= c.max_students %}
              🔒 [Đã đầy]
            {% else %}
              🟢 [Còn chỗ]
            {% endif %}
          </option>
          {% endfor %}
        </select>

        {% for c in classes %}
          {% if c.current_students >= c.max_students %}
            <div class="text-danger mt-1 small">
              ⚠️ Lớp "<strong>{{ c.class_name }}</strong>" đã đủ số lượng. Không thể ghi danh thêm.
            </div>
          {% endif %}
        {% endfor %}
      </div>

      <!-- ========================== -->
      <!-- 3) Loại ghi danh -->
      <!-- ========================== -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📝 Loại ghi danh</label>
        <select name="enrollment_type" class="form-select">
          <option value="official">Chính thức</option>
          <option value="elective">Tự chọn</option>
          <option value="audit">Dự thính</option>
          <option value="temporary">Tạm thời</option>
        </select>
      </div>

      <!-- ========================== -->
      <!-- 4) Buttons -->
      <!-- ========================== -->
      <div class="text-end mt-4">
        <a href="/admin/enrollments/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-success">
          <i class="bi bi-save2"></i> Ghi danh
        </button>
      </div>

    </form>
  </div>

  <!-- ======================================== -->
  <!-- 🔥 LIVE SEARCH SCRIPT -->
  <!-- ======================================== -->
  <script>
    // Search học viên
    document.getElementById("studentSearch").addEventListener("input", function () {
      const q = this.value.toLowerCase();
      const options = document.querySelectorAll("#studentSelect option");

      options.forEach(o => {
        o.style.display = o.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    });

    // Search lớp học
    document.getElementById("classSearch").addEventListener("input", function () {
      const q = this.value.toLowerCase();
      const options = document.querySelectorAll("#classSelect option");

      options.forEach(o => {
        const searchable = o.getAttribute("data-search").toLowerCase();
        o.style.display = searchable.includes(q) ? "" : "none";
      });
    });
  </script>

</body>
</html>
