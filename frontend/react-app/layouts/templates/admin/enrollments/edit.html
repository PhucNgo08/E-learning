<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ Cập nhật ghi danh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f3f7ff;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    .card {
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card p-4" style="max-width:650px;width:100%;">
    <h3 class="text-center text-primary mb-4">✏️ Cập nhật thông tin ghi danh</h3>

    <form method="post" action="/admin/enrollments/update/{{ enrollment.id }}">
      <div class="mb-3">
        <label class="form-label">👤 Học viên</label>
        <input type="text" class="form-control" value="{{ enrollment.user.full_name if enrollment.user else 'Không rõ' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">🏫 Lớp học</label>
        <input type="text" class="form-control" value="{{ enrollment.class_.class_name if enrollment.class_ else 'Không rõ' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">🔖 Loại ghi danh</label>
        <input type="text" class="form-control" value="{{ enrollment.enrollment_type }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">⚙️ Trạng thái hiện tại</label>
        <input type="text" class="form-control" value="{{ enrollment.enrollment_status }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">🔁 Cập nhật trạng thái</label>
        <select name="new_status" class="form-select" required>
          <option value="approved">✔️ Duyệt</option>
          <option value="dropped">❌ Hủy</option>
          <option value="completed">🏁 Hoàn thành</option>
        </select>
      </div>

      <div class="text-end mt-4">
        <a href="/admin/enrollments/manage" class="btn btn-secondary">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save2"></i> Lưu thay đổi
        </button>
      </div>
    </form>
  </div>

</body>
</html>
