{% extends "layout_admin.html" %}
{% block title %}✏️ Cập nhật ghi danh{% endblock %}

{% block content %}
<style>
  body {
    background: #eef4ff;
    font-family: "Inter", "Segoe UI", sans-serif;
  }

  .card {
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  h3 {
    font-weight: 700;
    color: #0d47a1;
  }

  .info-label {
    font-weight: 600;
    color: #344767;
  }
</style>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card p-4" style="max-width:700px;width:100%;">

    <h3 class="text-center mb-4">
      ✏️ Cập nhật thông tin ghi danh
    </h3>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/enrollments/update/{{ enrollment.id }}">

      <div class="mb-3">
        <label class="form-label info-label">👤 Học viên</label>
        <input type="text" class="form-control"
          value="{{ student_name if student_name else 'Không rõ' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label info-label">🏫 Lớp học</label>
        <input type="text" class="form-control"
          value="{{ enrollment.clazz.class_name if enrollment.clazz else 'Không rõ' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label info-label">🔖 Loại ghi danh</label>
        <input type="text" class="form-control"
          value="{{ enrollment.enrollment_type or '—' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label info-label">⚙️ Trạng thái hiện tại</label>
        <input type="text" class="form-control"
          value="{{ enrollment.enrollment_status or '—' }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label info-label">🔁 Cập nhật trạng thái</label>
        <select name="new_status" class="form-select" required>
          <option value="">-- Chọn trạng thái --</option>

          <option value="approved" {% if enrollment.enrollment_status == 'approved' %}selected{% endif %}>
            ✔️ Duyệt
          </option>

          <option value="active" {% if enrollment.enrollment_status == 'active' %}selected{% endif %}>
            🚀 Kích hoạt học
          </option>

          <option value="dropped" {% if enrollment.enrollment_status == 'dropped' %}selected{% endif %}>
            ❌ Hủy
          </option>

          <option value="completed" {% if enrollment.enrollment_status == 'completed' %}selected{% endif %}>
            🏁 Hoàn thành
          </option>

          <option value="rejected" {% if enrollment.enrollment_status == 'rejected' %}selected{% endif %}>
            ⛔ Từ chối
          </option>
        </select>
      </div>

      <div class="text-end mt-4">
        <a href="/admin/enrollments/manage" class="btn btn-secondary px-4">
          <i class="bi bi-arrow-left-circle"></i> Quay lại
        </a>

        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-save2"></i> Lưu thay đổi
        </button>
      </div>

    </form>

  </div>
</div>
{% endblock %}
